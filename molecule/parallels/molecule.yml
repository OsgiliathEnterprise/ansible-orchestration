---
dependency:
  name: galaxy
  enabled: ${DEPENDENCY_ENABLED:-True}
  options:
    role-file: ${REQUIREMENTS_PATH:-requirements-standalone.yml}
    requirements-file: requirements-collections.yml
    force: true
driver:
  name: vagrant
  # Molecule does not merge lists: override with the full option set.
  # These become ansible_ssh_common_args in the generated inventory, which
  # the ssh plugin appends AFTER [ssh_connection] ssh_args from the cfg.
  ssh_connection_options:
    - '-o UserKnownHostsFile=/dev/null'
    - '-o ControlMaster=auto'
    - '-o ControlPersist=1600s'
    - '-o ForwardX11=no'
    - '-o LogLevel=ERROR'
    - '-o IdentitiesOnly=yes'
    - '-o StrictHostKeyChecking=no'
  provider:
    name: parallels
platforms:
  - name: idm.osgiliath.test
    box: ${TESTBOX:-bento/fedora-43}
    provider_options:
      cpus: 2
      memory: 5120
    interfaces:
      - type: dhcp
        auto_config: true
        network_name: private_network
    provider_raw_config_args:
      - "customize ['set', :id, '--device-add', 'hdd', '--size', '7840']"
    groups:
      - ipaservers
  - name: master.osgiliath.test
    box: ${TESTBOX:-bento/fedora-43}
    provider_options:
      cpus: 4
      memory: 8192
    networks:
      - type: dhcp
        auto_config: true
        network_name: private_network
    groups:
      - ipaclients
      - kube_master
  - name: node1.osgiliath.test
    box: ${TESTBOX:-bento/fedora-43}
    provider_options:
      cpus: 4
      memory: 8192
    networks:
      - type: dhcp
        auto_config: true
        network_name: private_network
    groups:
      - ipaclients
      - kube_node
  - name: node2.osgiliath.test
    box: ${TESTBOX:-bento/fedora-43}
    provider_options:
      cpus: 4
      memory: 8192
    networks:
      - type: dhcp
        auto_config: true
        network_name: private_network
    groups:
      - ipaclients
      - kube_node
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../community-collections:${HOME}/.ansible/collections:/usr/share/ansible/collections"
    ANSIBLE_VERBOSITY: 1
  config_options:
    defaults:
      remote_tmp: /tmp
    ssh_connection:
      pipelining: true
verifier:
  name: testinfra
  env:
    PYTHONWARNINGS: "ignore:.*U.*mode is deprecated:DeprecationWarning"
  options:
    v: 1
scenario:
  name: parallels
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
