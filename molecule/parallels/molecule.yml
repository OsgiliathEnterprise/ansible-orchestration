---
dependency:
  name: galaxy
  enabled: ${DEPENDENCY_ENABLED:-True}
  options:
    role-file: ${REQUIREMENTS_PATH:-requirements-standalone.yml}
    requirements-file: requirements-collections.yml
    force: true
driver:
  name: vagrant
  provider:
    name: parallels
platforms:
  - name: idm.osgiliath.test
    box: ${TESTBOX:-bento/fedora-43}
    provider_options:
      cpus: 2
      memory: 5120
    interfaces:
      - type: dhcp
        auto_config: true
        network_name: private_network
    provider_raw_config_args:
      - "customize ['set', :id, '--device-add', 'hdd', '--size', '7840']"
    groups:
      - ipaservers
  - name: master.osgiliath.test
    box: ${TESTBOX:-bento/fedora-43}
    provider_options:
      cpus: 4
      memory: 8192
    networks:
      - network: private_network
        ip: 10.211.55.11
    groups:
      - ipaclients
      - kube_master
  - name: node1.osgiliath.test
    box: ${TESTBOX:-bento/fedora-43}
    provider_options:
      cpus: 4
      memory: 8192
    networks:
      - network: private_network
        ip: 10.211.55.12
    groups:
      - ipaclients
      - kube_node
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../community-collections:${HOME}/.ansible/collections:/usr/share/ansible/collections"
    ANSIBLE_VERBOSITY: 1
  config_options:
    defaults:
      remote_tmp: /tmp
verifier:
  name: testinfra
  env:
    PYTHONWARNINGS: "ignore:.*U.*mode is deprecated:DeprecationWarning"
  options:
    v: 1
scenario:
  name: parallels
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
