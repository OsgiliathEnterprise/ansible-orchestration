---
- name: Converge master
  hosts: master.osgiliath.test
  vars:
    secure_logs: False
    standalone_role: False
    company_domain: osgiliath.test
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    master_preferred_nic: "enp0s5"
    reset_kube: True
  #        kube_alt_names:
#          - "kubeadm.osgiliath.net"
  roles:
    - role: tcharl.ansible_orchestration

- name: Converge node
  hosts: node1.osgiliath.test
  vars:
    secure_logs: False
    standalone_role: False
    reset_kube: True
    company_domain: osgiliath.test
    preferred_nic: "enp0s5"
    master_preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    nfs_mountpoints:
      - host: idm.osgiliath.test
        mountpoints:
          - remote: /var/shared/csi
            local: /net
            csi_mount: Yes
          - local: /net
            remote: /var/shared/volume
            kubernetes_volumes:
              - subtree: /artefactrepo
                mountsize: 1
  roles:
    - role: tcharl.ansible_orchestration
