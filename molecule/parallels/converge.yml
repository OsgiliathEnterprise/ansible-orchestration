---
# Single order-tolerant play: master + all worker nodes run the role together in one pass
# instead of two sequential plays (master-fully-done -> then-node). Cross-host dependencies
# are handled by readiness gates inside the role (API-server /healthz + FreeIPA CA/profile
# availability), so a worker no longer requires a fully-completed control-plane play.
# Targeting group unions means adding a worker is a molecule.yml-only change.
- name: Converge cluster
  hosts: kube_master,kube_node
  vars:
    secure_logs: False
    standalone_role: False
    company_domain: osgiliath.test
    company_realm_password: '123ADMin'
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    master_preferred_nic: "enp0s5"
    reset_kube: True
    nfs_mountpoints:
      - host: idm.osgiliath.test
        mountpoints:
          - local: /net
            remote: /var/nfs/volume
            kubernetes_volumes:
              - subtree: /artefactrepo
                mountsize: 1
  roles:
    - role: tcharl.ansible_orchestration
