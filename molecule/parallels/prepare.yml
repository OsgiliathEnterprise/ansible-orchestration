---
- name: Prepare MAchines
  hosts:
    - all
  tasks:
    - name: "install fedora ansible prerequisites"
      ansible.builtin.raw: dnf install -y python3 python3-libdnf5
      changed_when: false
      become: true

- name: Prepare IDM
  hosts:
    - idm.osgiliath.test
  roles:
    - role: tcharl.freeipa_server
  vars:
    secure_logs: False
    company_domain: osgiliath.test
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
  tasks:
    # The freeipa_server role opens the firewall only at runtime (its
    # tcharl.ansible_routing include lacks the dns service and freeipa-ldap,
    # and nothing is written --permanent). A firewalld restart triggered by
    # the dnf transactions during converge then wipes the runtime-only rules
    # and the kube hosts lose the KDC/DNS ("Cannot contact any KDC").
    # Pin the full IPA service set permanently so it survives restarts.
    - name: "Make IPA/DNS firewall services permanent on IDM"
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - dns
        - freeipa-ldap
        - freeipa-ldaps
        - freeipa-replication
        - kerberos
        - kpasswd
        - http
        - https
      become: true
- name: Prepare secure the hosts
  hosts: kube_master,kube_node
  roles:
    - role: tcharl.ansible_securehost
  vars:
    standalone_role: False
    secure_logs: False
    company_domain: osgiliath.test
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: Prepare namesservers
  hosts:
    - all
  roles:
    - role: tcharl.ansible_nameserver
  vars:
    standalone_role: False
    secure_logs: False
    company_domain: osgiliath.test
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: Prepare NFS server on IDM
  hosts:
    - idm.osgiliath.test
  roles:
    - role: tcharl.nfs_server
  vars:
    standalone_role: False
    secure_logs: False
    company_domain: osgiliath.test
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
    lvm_groups:
      - vgname: non-persistent
        disks:
          - /dev/sdb
        create: true
        lvmetanames:
          - lvname: nfs_exposed
            size: 4G
            create: true
            filesystem: xfs
            expose_nfs: True
            mntp: /var/nfs/volume
            sec: "*(rw,no_root_squash,no_subtree_check)"
            csi_mount: true
    manage_lvm: true
    configure_nfs: True

- name: Prepare NFS client on Node
  hosts: kube_node
  roles:
    - role: tcharl.nfs_client
  vars:
    standalone_role: False
    secure_logs: False
    company_domain: osgiliath.test
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'

- name: configure containerization prereq # Execute master and nodes at the same time: one fact is created by the master and reused by nodes
  hosts: kube_master,kube_node # use this order: master should be created before node
  roles:
    - role: geerlingguy.swap
    - role: geerlingguy.containerd
  vars:
    swap_file_state: absent
  become: Yes
