---
- name: Prepare IDM
  hosts:
    - idm.osgiliath.test
  tasks:
    - name: "install fedora ansible prerequisites"
      ansible.builtin.raw: dnf install -y python3 python3-libdnf5
      changed_when: false
      become: true
    - include_role:
        name: tcharl.freeipa_server
      vars:
        secure_logs: False
        company_domain: osgiliath.test
        preferred_nic: "enp0s5"
        idm_preferred_nic: "enp0s5"
        company_realm_password: '123ADMin'
        company_ad_password: '123ADmPass'
- name: Prepare secure the hosts
  hosts:
    - master.osgiliath.test
    - node1.osgiliath.test
  tasks:
    - name: "install fedora ansible prerequisites"
      ansible.builtin.raw: dnf install -y python3 python3-libdnf5
      changed_when: false
      become: true
    - include_role:
        name: tcharl.ansible_securehost
      vars:
        standalone_role: False
        secure_logs: False
        company_domain: osgiliath.test
        preferred_nic: "enp0s5"
        idm_preferred_nic: "enp0s5"
        company_realm_password: '123ADMin'
        company_ad_password: '123ADmPass'
- name: Prepare namesservers
  hosts:
    - all
  tasks:
    - include_role:
        name: tcharl.ansible_nameserver
      vars:
        standalone_role: False
        secure_logs: False
        company_domain: osgiliath.test
        preferred_nic: "enp0s5"
        idm_preferred_nic: "enp0s5"
        company_realm_password: '123ADMin'
        company_ad_password: '123ADmPass'
- name: Prepare NFS server on IDM
  hosts:
    - idm.osgiliath.test
  tasks:
    - include_role:
        name: tcharl.nfs_server
      vars:
        standalone_role: False
        secure_logs: False
        company_domain: osgiliath.test
        preferred_nic: "enp0s5"
        idm_preferred_nic: "enp0s5"
        company_realm_password: '123ADMin'
        company_ad_password: '123ADmPass'
        lvm_groups:
          - vgname: non-persistent
            disks:
              - /dev/sdb
            create: true
            lvmetanames:
              - lvname: nfs_exposed
                size: 4G
                create: true
                filesystem: xfs
                expose_nfs: True
                mntp: /var/nfs/volume
                sec: "*(rw,no_root_squash,no_subtree_check)"
                csi_mount: true
        manage_lvm: true
        configure_nfs: True

- name: Prepare NFS client on Node
  hosts:
    - node1.osgiliath.test
  tasks:
    - include_role:
        name: tcharl.nfs_client
      vars:
        standalone_role: False
        secure_logs: False
        company_domain: osgiliath.test
        preferred_nic: "enp0s5"
        idm_preferred_nic: "enp0s5"
        company_realm_password: '123ADMin'
        company_ad_password: '123ADmPass'
- name: configure containerization prereq # Execute master and nodes at the same time: one fact is created by the master and reused by nodes
  hosts: # use this order: master should be created before node
    - master.osgiliath.test
    - node1.osgiliath.test
  roles:
    - role: geerlingguy.containerd
  become: Yes

- name: configure kubernetes prereq # Execute master and nodes at the same time: one fact is created by the master and reused by nodes
  hosts:
    - master.osgiliath.test
    - node1.osgiliath.test
  vars:
    swap_file_state: absent
  roles:
    - role: geerlingguy.swap
  become: Yes
