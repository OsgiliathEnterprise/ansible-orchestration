---
- name: Prepare Machines
  hosts:
    - all
  tasks:
    - name: "install fedora ansible prerequisites"
      ansible.builtin.raw: dnf install -y python3 python3-libdnf5
      changed_when: false
      become: true

- name: Prepare IDM
  hosts:
    - idm.osgiliath.test
  roles:
    - role:  tcharl.freeipa_server
  vars:
    secure_logs: False
    skip_hostname_assert: True # Nic name is randomized at startup
    skip_nameserver_assert: True
    preferred_nic: "ens6"
    idm_preferred_nic: "ens6"
    company_domain: osgiliath.test
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: Prepare Secure hosts
  hosts: kube_master,kube_node
  roles:
    - role:  tcharl.ansible_securehost
  vars:
    standalone_role: False
    secure_logs: False
    skip_hostname_assert: True # Nic name is randomized at startup
    skip_nameserver_assert: True
    preferred_nic: "ens6"
    company_domain: osgiliath.test
    idm_preferred_nic: "ens6"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: Prepare DNS
  hosts:
    - all
  roles:
    - role: tcharl.ansible_nameserver
  vars:
    standalone_role: False
    secure_logs: False
    skip_hostname_assert: True # Nic name is randomized at startup
    skip_nameserver_assert: True
    preferred_nic: "ens6"
    company_domain: osgiliath.test
    idm_preferred_nic: "ens6"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: Prepare NFS server on Master
  hosts:
    - idm.osgiliath.test
  roles:
    - role: tcharl.nfs_server
  vars:
    standalone_role: False
    secure_logs: False
    skip_hostname_assert: True # Nic name is randomized at startup
    skip_nameserver_assert: True
    preferred_nic: "ens6"
    company_domain: osgiliath.test
    idm_preferred_nic: "ens6"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
    lvm_groups:
      - vgname: non-persistent
        disks:
          - /dev/vdb
        create: true
        lvmetanames:
          - lvname: nfs_exposed
            size: 3G
            create: true
            filesystem: xfs
            expose_nfs: True
            mntp: /var/nfs/volume
            sec: "*(rw,no_root_squash,no_subtree_check)"
            csi_mount: true
    manage_lvm: true
    configure_nfs: True

- name: Prepare NFS client on Node
  hosts: kube_node
  roles:
    - role: tcharl.nfs_client
  vars:
    standalone_role: False
    secure_logs: False
    skip_hostname_assert: True # Nic name is randomized at startup
    skip_nameserver_assert: True
    preferred_nic: "ens6"
    company_domain: osgiliath.test
    idm_preferred_nic: "ens6"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: configure containerization prereq # Execute master and nodes at the same time: one fact is created by the master and reused by nodes
  hosts: kube_master,kube_node # use this order: master should be created before node
  roles:
    - role: geerlingguy.swap
    - role: geerlingguy.containerd
  vars:
    swap_file_state: absent
  become: Yes

  tasks:
    # cri-tools provides /usr/bin/crictl. geerlingguy.containerd installs containerd.io
    # only (ctr, no crictl) and the kube packages that carry cri-tools are installed
    # later, by the role's kube-install.yml — so without this the pre-pull below could
    # never execute (module exec failure: rc=ENOENT, empty stdout/stderr, silently
    # swallowed by the old failed_when: false).
    - name: Install cri-tools so the calico pre-pull can run
      ansible.builtin.dnf:
        name: cri-tools
        state: present

    # Warm the calico image cache before converge (Travis kvm #105-#110): since the
    # tigera-operator flow the master must pull tigera/operator + calico node/calico
    # images (all quay.io) during converge, and on cold CI runners those pulls ate the
    # calico-node Ready gate budget.
    # No native ansible module for crictl pull, so: the retry condition is evaluated on
    # rc (not on a `failed` flag we neutralised, which made retries dead), and the
    # warm-up stays best-effort through the rescue instead of a silent no-op.
    # changed_when: false — pulling an already-present tag is a content-store no-op, so
    # the image cache is not configuration state.
    # Keep the tags in sync with defaults/main.yml (calico_cni_version) and the
    # tigera-operator.yaml manifest pinned by tcharl.kubernetes.
    - name: Pre-pull calico images for converge
      block:
        - name: Pre-pull calico images | crictl pull
          ansible.builtin.command: "crictl pull {{ item }}"
          loop:
            - quay.io/tigera/operator:v1.44.0
            - quay.io/calico/node:v3.33.0
            - quay.io/calico/calico:v3.33.0
          register: kvm_calico_prepull
          until: kvm_calico_prepull.rc | default(1) == 0
          retries: 3
          delay: 10
          changed_when: false
      rescue:
        - name: Pre-pull calico images | warn that the warm-up did not complete
          ansible.builtin.debug:
            msg: >-
              Calico image pre-pull did not complete after 3 attempts
              ({{ kvm_calico_prepull.msg | default('no result recorded') }};
              images not pulled:
              {{ (kvm_calico_prepull.results | default([])
                  | selectattr('failed', 'defined') | selectattr('failed')
                  | map(attribute='item') | join(', ')) or 'none recorded' }}).
              Converge pulls the images itself; the calico-node Ready gate absorbs
              the extra time.
