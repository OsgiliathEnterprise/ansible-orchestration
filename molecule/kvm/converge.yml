---
# Single order-tolerant play: master + all worker nodes run the role together in one pass
# instead of two sequential plays. Cross-host dependencies are handled by readiness gates
# inside the role (API-server /healthz + FreeIPA CA/profile availability), not by play
# ordering. Targeting group unions means adding a worker is a molecule.yml-only change.
- name: Converge cluster
  hosts: kube_master,kube_node
  vars:
    secure_logs: False
    standalone_role: False
    company_domain: osgiliath.test
    company_realm_password: '123ADMin'
    skip_hostname_assert: True # Nic name is randomized at startup
    skip_nameserver_assert: True
    preferred_nic: "ens6"
    idm_preferred_nic: "ens6"
    master_preferred_nic: "ens6"
    kube_firewall_zone: 'internal'
    reset_kube: True
    # Constrained single-worker CI topology (2GB/2vCPU VMs on an 8GB/2vCPU runner): the
    # calico-node and coredns rollout waits exceed the 300s role default under CI load.
    # Calibrate: keep the budget at >=2x the measured calico wait duration.
    kubernetes_rollout_wait_timeout: 600
    nfs_mountpoints:
      - host: idm.osgiliath.test
        mountpoints:
          - local: /net
            remote: /var/nfs/volume
            kubernetes_volumes:
              - subtree: /artefactrepo
                mountsize: 1
  roles:
    - role: tcharl.ansible_orchestration
