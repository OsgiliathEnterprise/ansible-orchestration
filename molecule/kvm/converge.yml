---
# Single order-tolerant play: master + node run the role together in one pass instead of
# two sequential plays. Cross-host dependencies are handled by readiness gates inside the
# role (API-server /healthz + FreeIPA CA/profile availability), not by play ordering.
- name: Converge cluster
  hosts: master.osgiliath.test,node1.osgiliath.test
  vars:
    secure_logs: False
    standalone_role: False
    company_domain: osgiliath.test
    company_realm_password: '123ADMin'
    skip_hostname_assert: True # Nic name is randomized at startup
    skip_nameserver_assert: True
    preferred_nic: "ens7"
    idm_preferred_nic: "ens7"
    master_preferred_nic: "ens7"
    kube_firewall_zone: 'internal'
    reset_kube: True
    nfs_mountpoints:
      - host: idm.osgiliath.test
        mountpoints:
          - local: /net
            remote: /var/nfs/volume
            kubernetes_volumes:
              - subtree: /artefactrepo
                mountsize: 1
  roles:
    - role: tcharl.ansible_orchestration
