---
dependency:
  name: galaxy
  enabled: ${DEPENDENCY_ENABLED:-True}
  options:
    role-file: ${REQUIREMENTS_PATH:-requirements-standalone.yml}
    requirements-file: requirements-collections.yml
driver:
  name: vagrant
  # Molecule does not merge lists: override with the full option set.
  # These become ansible_ssh_common_args in the generated inventory, which
  # the ssh plugin appends AFTER [ssh_connection] ssh_args from the cfg.
  ssh_connection_options:
    - '-o UserKnownHostsFile=/dev/null'
    - '-o ControlMaster=auto'
    - '-o ControlPersist=1600s'
    - '-o ForwardX11=no'
    - '-o LogLevel=ERROR'
    - '-o IdentitiesOnly=yes'
    - '-o StrictHostKeyChecking=no'
  provider:
    name: libvirt
platforms:
  - name: idm.osgiliath.test
    box: ${TESTBOX:-fedora-cloud-44-libvirt}
    box_url: ${TESTBOX_URL:-https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Vagrant-libvirt-44-1.7.x86_64.vagrant.libvirt.box}
    provider_options:
      driver: "kvm"
      cpus: 2
      memory: 2048
      qemu_use_session: false
    interfaces:
      - auto_config: true
        network_name: private_network
        type: dhcp
    provider_raw_config_args:
      - "storage :file, :size => '5G', :device => 'vdb'"
#        ip: "192.168.50.6"
    groups:
      - ipaservers
  - name: master.osgiliath.test
    box: ${TESTBOX:-fedora-cloud-44-libvirt}
    box_url: ${TESTBOX_URL:-https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Vagrant-libvirt-44-1.7.x86_64.vagrant.libvirt.box}
    provider_options:
      driver: "kvm"
      cpus: 2
      memory: 2048
      qemu_use_session: false
    interfaces:
      - auto_config: true
        network_name: private_network
        type: dhcp
#        ip: "192.168.50.4"
    groups:
      - ipaclients
      - kube_master
  - name: node1.osgiliath.test
    box: ${TESTBOX:-fedora-cloud-44-libvirt}
    box_url: ${TESTBOX_URL:-https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Vagrant-libvirt-44-1.7.x86_64.vagrant.libvirt.box}
    provider_options:
      driver: "kvm"
      cpus: 2
      memory: 2048
      qemu_use_session: false
    interfaces:
      - auto_config: true
        network_name: private_network
        type: dhcp
    #        ip: "192.168.50.5"
    groups:
      - ipaclients
      - kube_node
  - name: node2.osgiliath.test
    box: ${TESTBOX:-fedora-cloud-44-libvirt}
    box_url: ${TESTBOX_URL:-https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Vagrant-libvirt-44-1.7.x86_64.vagrant.libvirt.box}
    provider_options:
      driver: "kvm"
      cpus: 2
      memory: 2048
      qemu_use_session: false
    interfaces:
      - auto_config: true
        network_name: private_network
        type: dhcp
    groups:
      - ipaclients
      - kube_node
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../community-collections:${HOME}/.ansible/collections:/usr/share/ansible/collections"
    ANSIBLE_VERBOSITY: 2
  config_options:
    defaults:
      remote_tmp: /tmp
      forks: 20
      timeout: 60
    ssh_connection:
      pipelining: true
verifier:
  name: testinfra
  env:
    PYTHONWARNINGS: "ignore:.*U.*mode is deprecated:DeprecationWarning"
  options:
    v: 1
scenario:
  name: kvm
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
