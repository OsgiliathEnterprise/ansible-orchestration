---
dependency:
  name: galaxy
  enabled: ${DEPENDENCY_ENABLED:-True}
  options:
    role-file: ${REQUIREMENTS_PATH:-requirements-standalone.yml}
    requirements-file: requirements-collections.yml
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: idm.osgiliath.test
    box: ${TESTBOX:-generic/fedora39}
    provider_options:
      driver: "kvm"
      cpus: 2
      memory: 2048
      qemu_use_session: false
    interfaces:
      - auto_config: true
        network_name: private_network
        type: dhcp
#        ip: "192.168.50.6"
    groups:
      - ipaservers
  - name: master.osgiliath.test
    box: ${TESTBOX:-generic/fedora39}
    provider_options:
      driver: "kvm"
      cpus: 2
      memory: 2048
      qemu_use_session: false
    interfaces:
      - auto_config: true
        network_name: private_network
        type: dhcp
#        ip: "192.168.50.4"
    groups:
      - ipaclients
      - kube_master
  - name: node1.osgiliath.test
    box: ${TESTBOX:-generic/fedora39}
    provider_options:
      driver: "kvm"
      cpus: 2
      memory: 2048
      qemu_use_session: false
    interfaces:
      - auto_config: true
        network_name: private_network
        type: dhcp
#        ip: "192.168.50.5"
    groups:
      - ipaclients
      - kube_node
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../community-collections:${HOME}/.ansible/collections:/usr/share/ansible/collections"
    ANSIBLE_REMOTE_TMP: /var/tmp/ansible-remote
    ANSIBLE_ASYNC_DIR: "/tmp/.ansible_async"
  options:
    vvv: True
  config_options:
    defaults:
      remote_tmp: /var/tmp/ansible-remote
#  config_options:
#    defaults:
#      forks: 20
#   ssh_connection:
#     pipelining: true
#      ssh_args: -o ControlMaster=auto -o ControlPersist=6000s
verifier:
  name: testinfra
  env:
    PYTHONWARNINGS: "ignore:.*U.*mode is deprecated:DeprecationWarning"
  options:
    v: 1
scenario:
  name: kvm
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
