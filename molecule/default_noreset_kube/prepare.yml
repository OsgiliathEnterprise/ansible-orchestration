---
# TODO This phase fails once
- name: Prepare Machines
  hosts:
    - all
  tasks:
    - name: "install fedora ansible prerequisites"
      ansible.builtin.raw: dnf install -y python3 python3-libdnf5
      changed_when: false
      become: true

- name: Prepare IDM
  hosts:
    - idm.osgiliath.test
  roles:
    - role: tcharl.freeipa_server
  vars:
    secure_logs: False
    preferred_nic: "eth1"
    idm_preferred_nic: "eth1"
    company_domain: osgiliath.test
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: Prepare nodes
  hosts: kube_master,kube_node
  roles:
    - role: tcharl.ansible_securehost
  vars:
    standalone_role: False
    secure_logs: False
    preferred_nic: "eth1"
    company_domain: osgiliath.test
    idm_preferred_nic: "eth1"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: Prepare
  hosts:
    - all
  roles:
    - role: tcharl.ansible_nameserver
  vars:
    standalone_role: False
    secure_logs: False
    preferred_nic: "eth1"
    company_domain: osgiliath.test
    idm_preferred_nic: "eth1"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: Prepare NFS server on Master
  hosts:
    - master.osgiliath.test
  roles:
    - role: tcharl.nfs_server
  vars:
    standalone_role: False
    secure_logs: False
    preferred_nic: "eth1"
    company_domain: osgiliath.test
    idm_preferred_nic: "eth1"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
    lvm_groups:
      - vgname: non-persistent
        disks:
          - /dev/sdb1
        create: true
        lvmetanames:
          - lvname: nfs_exposed
            size: 512M
            create: true
            filesystem: xfs
            expose_nfs: True
            mntp: /var/nfs/csi
            mount: true
          - lvname: nfs_exposed2
            size: 512M
            create: true
            filesystem: xfs
            expose_nfs: True
            mntp: /var/nfs/volume
            mount: true
    manage_lvm: true
    configure_nfs: True

- name: Prepare NFS client on Node
  hosts: kube_node
  roles:
    - role: tcharl.nfs_client
  vars:
    standalone_role: False
    secure_logs: False
    preferred_nic: "eth1"
    company_domain: osgiliath.test
    idm_preferred_nic: "eth1"
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: configure containerization prereq # Execute master and nodes at the same time: one fact is created by the master and reused by nodes
  hosts: kube_master,kube_node # use this order: master should be created before node
  roles:
    - role: geerlingguy.swap
    - role: geerlingguy.containerd
  vars:
    swap_file_state: absent
  become: Yes
