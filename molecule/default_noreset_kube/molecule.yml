---
dependency:
  name: galaxy
  enabled: ${DEPENDENCY_ENABLED:-True}
  options:
    role-file: ${REQUIREMENTS_PATH:-requirements-standalone.yml}
    requirements-file: requirements-collections.yml
driver:
  name: vagrant
  # Molecule does not merge lists: override with the full option set.
  # These become ansible_ssh_common_args in the generated inventory, which
  # the ssh plugin appends AFTER [ssh_connection] ssh_args from the cfg.
  ssh_connection_options:
    - '-4'
    - '-o UserKnownHostsFile=/dev/null'
    - '-o ControlMaster=auto'
    - '-o ControlPersist=1600s'
    - '-o ForwardX11=no'
    - '-o LogLevel=ERROR'
    - '-o IdentitiesOnly=yes'
    - '-o StrictHostKeyChecking=no'
  provider:
    name: virtualbox
platforms:
  - name: idm.osgiliath.test
    box: ${TESTBOX:-fedora-cloud-44-virtualbox}
    box_url: ${TESTBOX_URL:-https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Vagrant-VirtualBox-44-1.7.x86_64.vagrant.virtualbox.box}
    provider_options:
      cpus: 2
      memory: 2048
    interfaces:
      - auto_config: true
        network_name: private_network
        ip: "192.168.50.6"
        virtualbox__intnet: true
    groups:
      - ipaservers
  - name: master.osgiliath.test
    box: ${TESTBOX:-fedora-cloud-44-virtualbox}
    box_url: ${TESTBOX_URL:-https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Vagrant-VirtualBox-44-1.7.x86_64.vagrant.virtualbox.box}
    provider_options:
      cpus: 2
      memory: 2048
    interfaces:
      - auto_config: true
        network_name: private_network
        ip: "192.168.50.4"
        virtualbox__intnet: true
    groups:
      - kube_master
      - ipaclients
  - name: node1.osgiliath.test
    box: ${TESTBOX:-fedora-cloud-44-virtualbox}
    box_url: ${TESTBOX_URL:-https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Vagrant-VirtualBox-44-1.7.x86_64.vagrant.virtualbox.box}
    provider_options:
      cpus: 2
      memory: 2048
    groups:
      - kube_node
      - ipaclients
    interfaces:
      - auto_config: true
        network_name: private_network
        ip: "192.168.50.5"
        virtualbox__intnet: true
  - name: node2.osgiliath.test
    box: ${TESTBOX:-fedora-cloud-44-virtualbox}
    box_url: ${TESTBOX_URL:-https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Vagrant-VirtualBox-44-1.7.x86_64.vagrant.virtualbox.box}
    provider_options:
      cpus: 2
      memory: 2048
    groups:
      - kube_node
      - ipaclients
    interfaces:
      - auto_config: true
        network_name: private_network
        ip: "192.168.50.7"
        virtualbox__intnet: true
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../community-collections:${HOME}/.ansible/collections:/usr/share/ansible/collections"
  options:
    vvv: True
  config_options:
    defaults:
      remote_tmp: /tmp
#  config_options:
#    defaults:
#      forks: 20
#      gather_timeout: 20
#      timeout: 60
#    ssh_connection:
#      pipelining: true
#      ssh_args: -o ControlMaster=auto -o ControlPersist=6000s
    ssh_connection:
      pipelining: true
verifier:
  name: testinfra
  env:
    PYTHONWARNINGS: "ignore:.*U.*mode is deprecated:DeprecationWarning"
  options:
    v: 1
scenario:
  name: default_noreset_kube
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
