---

- name: Delete-configuration | stop kubelet service
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  failed_when: false
  with_items:
    - kubelet
    - containerd
  become: Yes

- name: Delete-configuration | clean stale kubeadm state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  failed_when: false
  loop:
    - /etc/kubernetes/admin.conf
    - /etc/kubernetes/controller-manager.conf
    - /etc/kubernetes/scheduler.conf
    - /etc/kubernetes/boottstrap-token.conf
    - /etc/kubernetes/kubelet.conf
    - /etc/kubernetes/pki

- name: Delete-configuration | reset kubeadm state
  ansible.builtin.command: kubeadm reset -f
  register: res
  changed_when: "'[reset]' in res.stdout"
  failed_when: false
  become: Yes

- name: Delete-configuration | list files
  ansible.builtin.find:
    paths: "/var/lib/kubelet/pods"
    follow: yes
    file_type: any
    recurse: True
  register: pod_data_folder_content
  become: Yes

- name: Delete-configuration | debug found folders to destroy
  ansible.builtin.debug:
    msg: "{{ pod_data_folder_content }}"
    verbosity: 3

- name: Delete-configuration | remove unwanted packages
  ansible.builtin.package:
    name:
     - kubeadm
     - containerd.io
     - kubectl
     - kubelet
     - kubernetes-cni
     - kubernetes-client
     - kubernetes-ansible
     - kubernetes-node
     - kubernetes-master
    state: absent
  become: Yes

- name: Delete-configuration | iterating over the pods
  ansible.builtin.include_tasks: destroy-kubelet-volumes.yml
  loop: "{{ pod_data_folder_content.files | map(attribute='path') }}"
  loop_control:
    loop_var: pod_files

- name: Delete-configuration | remove kubernetes configuration folder
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /etc/cni
    - /etc/kubernetes
    - /etc/sysconfig/kubelet
    - /etc/systemd/system/multi-user.target.wants/kubelet.service
    - /usr/lib/etcd
    - /usr/lib/kubelet
    - /usr/lib/systemd/system/kubelet.service
    - /usr/lib/systemd/system/kubelet.service.d
    - /var/lib/etcd
    - /var/lib/cni
    - /var/lib/kubelet
    - /usr/local/bin/kubectl-calico
    - /etc/containerd
    - /opt/containerd
    - /var/lib/containerd
    - /root/.kube
    - /home/kubecreds
  failed_when: false

- name: Delete-configuration | Reboot the server
  ansible.builtin.include_role:
    name: robertdebock.reboot
  vars:
    ansible_become: yes
