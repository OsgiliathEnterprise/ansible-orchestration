---
# Grant both cluster CAs' CA ACLs to a set of kube hosts (design D5 / task 5.2):
# the verbatim-duplicated wrapper (mint scratch admin ticket + two looped
# ipa-ca-acl-host.yml grants) that ipa-ca-acl-prejoin.yml (pre-join grants) and
# ipa-cert-renewal.yml (steady-state re-assert) each carried inline. One copy
# here; both files include it, so the pre-ticket convention (_krb_ticket.yml)
# and the grant loops cannot drift apart.
#
# Include with vars:
#   ipa_ca_acl_grant_hosts_kubernetes_ca:   hosts granted kubernetes-ca (CA #1).
#   ipa_ca_acl_grant_hosts_kubeclusteradm:  hosts granted the kubeclusteradm CA
#                                           (CA #2) ACL. Pre-join passes the
#                                           kube hosts; the steady-state
#                                           re-assert additionally covers the
#                                           IPA server (its host principal
#                                           renews certs too).
#   ipa_ca_acl_grant_when:                  optional gate (default true). The
#                                           renewal call site scopes the whole
#                                           wrapper to the master; the pre-join
#                                           call site needs no gate (it runs
#                                           from ipa-certs.yml, master-only).
#
# The admin ticket is minted on idm (privileged password principal, design D1
# rule) via the shared ticket include, and consumed by the delegated grant
# tasks through environment: KRB5CCNAME — never an ambient cache.

- name: Ipa-ca-acl-grants | mint admin ticket for the CA ACL grants
  ansible.builtin.include_tasks: _krb_ticket.yml
  vars:
    krb_ticket_principal: admin
    krb_ticket_password: "{{ company_realm_password }}"
    krb_ticket_cache_purpose: ca_acl
    krb_ticket_delegate_to: "{{ groups[idm_group] | first }}"
  when: ipa_ca_acl_grant_when | default(true) | bool

- name: Ipa-ca-acl-grants | grant kubernetes-ca access to the target hosts
  ansible.builtin.include_tasks: ipa-ca-acl-host.yml
  loop: "{{ ipa_ca_acl_grant_hosts_kubernetes_ca }}"
  vars:
    ipa_ca_acl_name: "kubernetes-ca-acl"
    ipa_ca_acl_host: "{{ item }}"
    ipa_ca_acl_ccache: "{{ kube_scratch_cache_dir }}/admin.ca_acl.ccache"
  when: ipa_ca_acl_grant_when | default(true) | bool

- name: Ipa-ca-acl-grants | grant kubeclusteradm CA access to the target hosts
  ansible.builtin.include_tasks: ipa-ca-acl-host.yml
  loop: "{{ ipa_ca_acl_grant_hosts_kubeclusteradm }}"
  vars:
    ipa_ca_acl_name: "{{ ipa_kubeclusteradm_ca_name }}-acl"
    ipa_ca_acl_host: "{{ item }}"
    ipa_ca_acl_ccache: "{{ kube_scratch_cache_dir }}/admin.ca_acl.ccache"
  when: ipa_ca_acl_grant_when | default(true) | bool
