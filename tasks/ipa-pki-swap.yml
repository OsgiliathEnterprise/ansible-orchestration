---

# Kubeconfigs were already re-pointed at the IPA CA in ipa-certs.yml (before the static pod
# restarts); only URL/readability fixes remain here.

- name: Ipa-pki-swap | ensure kubeconfig files are readable for testinfra
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0644'
  loop:
    - /etc/kubernetes/admin.conf
    - /etc/kubernetes/controller-manager.conf
    - /etc/kubernetes/scheduler.conf
  become: true

- name: Ipa-pki-swap | symlink root kubeconfig to admin.conf for testinfra
  ansible.builtin.file:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    state: link
    force: true
  become: true

- name: Ipa-pki-swap | patch kubelet.conf server URL to use hostname for TLS verification
  ansible.builtin.replace:
    path: /etc/kubernetes/kubelet.conf
    regexp: 'server: https://[\d.]+:6443'
    replace: 'server: https://{{ orchestration_host_hostname }}:6443'
  become: true

- name: Ipa-pki-swap | patch admin.conf server URL to use hostname for TLS verification
  ansible.builtin.replace:
    path: /etc/kubernetes/admin.conf
    regexp: 'server: https://[\d.]+:6443'
    replace: 'server: https://{{ orchestration_host_hostname }}:6443'
  become: true

# pki-swap only patches kubeconfigs, server URLs and file readability — it never touches the
# serving certificate, so no restart is implied here. This single validated gate confirms the API
# is healthy and presents the IPA-CA-anchored serving cert; stabilization semantics are carried
# by the functional gates below (KCM lease freshness, scheduler Ready).
- name: Ipa-pki-swap | wait for API server to be healthy with post-swap certificate (validated)
  ansible.builtin.uri:
    url: "https://{{ orchestration_master_ip }}:{{ kubernetes_api_port }}/healthz"
    ca_path: "{{ kubernetes_certificates_path }}ca.crt"
    status_code: 200
  become: true
  register: api_healthz
  retries: "{{ kubernetes_api_ready_retries }}"
  delay: "{{ kubernetes_api_ready_delay }}"
  # uri's `until` only retries when status == 200; on a TLS verification failure (stale CA, cert not yet swapped) the module returns status null and fails immediately without retrying — the guard makes this gate wait for reachability AND trust.
  until: api_healthz is not skipped and api_healthz.status | default(0) == 200

# Functional gate, not just container Ready: a KCM that cannot verify the API cert (stale CA
# trust) reports Ready=True yet never renews its leader lease. A fresh lease proves it can
# actually talk to the API; otherwise fail loudly instead of converging green with dead controllers.
- name: Ipa-pki-swap | wait for controller manager to hold a fresh leader lease
  kubernetes.core.k8s_info:
    api_version: coordination.k8s.io/v1
    kind: Lease
    namespace: kube-system
    name: kube-controller-manager
    kubeconfig: "{{ kube_config_path }}"
    context: kubernetes-admin@kubernetes
  become: true
  register: cm_lease
  retries: "{{ kubernetes_api_ready_retries }}"
  delay: "{{ kubernetes_api_ready_delay }}"
  # Freshness check runs in one controller-side python3 call: ansible-core 2.21's strftime filter no longer
  # accepts a piped datetime (signature is now strftime(format, epoch)), and renewTime carries fractional
  # seconds that to_datetime's explicit format cannot parse. fromisoformat handles both shapes cleanly.
  until: >-
    (cm_lease.resources | length == 1) and
    (lookup('pipe', 'RENEW_TIME=' ~ (cm_lease.resources[0].spec.renewTime | default('1970-01-01T00:00:00Z')) ~ ' python3 -c "' ~ "import os,datetime;r=datetime.datetime.fromisoformat(os.environ['RENEW_TIME'].replace('Z','+00:00'));n=datetime.datetime.now(datetime.timezone.utc);print(str((n-r).total_seconds()<90).lower())" ~ '"') == 'true')
  delegate_to: "{{ groups[kube_masters_group] | first }}"

# Symmetric with the KCM lease gate above: a crash-looping scheduler (e.g. broken CA trust in
# its kubeconfig) leaves every unscheduled pod — CNI DaemonSets included — stuck Pending, so
# converge must not pass it silently.
- name: Ipa-pki-swap | wait for scheduler static pod to report Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: kube-system
    label_selectors:
      - component=kube-scheduler
    kubeconfig: "{{ kube_config_path }}"
    context: kubernetes-admin@kubernetes
  become: true
  register: scheduler_ready
  retries: "{{ kubernetes_api_ready_retries }}"
  delay: "{{ kubernetes_api_ready_delay }}"
  until: >-
    (scheduler_ready.resources | length == 1) and
    ((scheduler_ready.resources[0].status.containerStatuses | default([])) | selectattr('ready', 'equalto', true) | list | length
     == (scheduler_ready.resources[0].status.containerStatuses | default([]) | length)) and
    ((scheduler_ready.resources[0].status.containerStatuses | default([]) | length > 0))
  delegate_to: "{{ groups[kube_masters_group] | first }}"

- name: Ipa-pki-swap | add API server override block to kubelet config
  # kubeadm-generated config has no apiServerOverride key, so the block is appended at EOF as a top-level key
  ansible.builtin.blockinfile:
    path: /var/lib/kubelet/config.yaml
    marker: "# {mark} API server override (ipa-pki-swap)"
    insertafter: EOF
    block: |
      apiServerOverride:
        certAuthority: /etc/kubernetes/pki/ca.crt
        url: https://{{ orchestration_host_hostname }}:6443
  become: true
  notify: ansible-orchestration | refresh kube

- name: Ipa-pki-swap | verify kubectl can connect with new CA
  kubernetes.core.k8s_cluster_info:
    kubeconfig: "{{ kube_config_path }}"
    context: kubernetes-admin@kubernetes
  become: true
  register: kubectl_verify
  retries: 6
  delay: "{{ kubernetes_api_ready_delay }}"
  until: (kubectl_verify.version | default({})) | length > 0

# Data-plane recovery must run last: after the kubelet refresh (above) so a recreated pod
# mounts the post-swap CA, and after cluster stabilization. No-op when Calico is absent.
- name: Ipa-pki-swap | recover Calico/Tigera data-plane workloads after CA swap
  ansible.builtin.include_tasks: calico-ca-recovery.yml
