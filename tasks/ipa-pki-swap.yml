---

# Kubeconfigs were already re-pointed at the IPA CA in ipa-certs.yml (before the static pod
# restarts); only URL/readability fixes remain here.

- name: Ipa-pki-swap | ensure kubeconfig files are readable for testinfra
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0644'
  loop:
    - /etc/kubernetes/admin.conf
    - /etc/kubernetes/controller-manager.conf
    - /etc/kubernetes/scheduler.conf
  become: true

- name: Ipa-pki-swap | symlink root kubeconfig to admin.conf for testinfra
  ansible.builtin.file:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    state: link
    force: true
  become: true

- name: Ipa-pki-swap | patch kubelet.conf server URL to use hostname for TLS verification
  ansible.builtin.replace:
    path: /etc/kubernetes/kubelet.conf
    regexp: 'server: https://[\d.]+:6443'
    replace: 'server: https://{{ orchestration_host_hostname }}:6443'
  become: true

- name: Ipa-pki-swap | patch admin.conf server URL to use hostname for TLS verification
  ansible.builtin.replace:
    path: /etc/kubernetes/admin.conf
    regexp: 'server: https://[\d.]+:6443'
    replace: 'server: https://{{ orchestration_host_hostname }}:6443'
  become: true

# The API server hot-reloads its serving cert (no static pod restart needed); the manifest
# edits in ipa-certs.yml already restarted KCM/scheduler with the patched kubeconfigs.

- name: Ipa-pki-swap | wait for API server to be healthy
  ansible.builtin.uri:
    url: "https://{{ kubernetes_api_host }}:{{ kubernetes_api_port }}/healthz"
    validate_certs: no
    status_code: 200
  become: true
  register: api_healthz
  retries: "{{ kubernetes_api_ready_retries }}"
  delay: "{{ kubernetes_api_ready_delay }}"
  until: api_healthz.status == 200

- name: Ipa-pki-swap | wait for cluster to stabilize after CA swap
  ansible.builtin.uri:
    url: "https://{{ kubernetes_api_host }}:{{ kubernetes_api_port }}/healthz"
    validate_certs: no
    status_code: 200
  become: true
  register: cluster_healthz
  retries: "{{ kubernetes_api_ready_retries }}"
  delay: "{{ kubernetes_api_ready_delay }}"
  until: cluster_healthz.status == 200

# Functional gate, not just container Ready: a KCM that cannot verify the API cert (stale CA
# trust) reports Ready=True yet never renews its leader lease. A fresh lease proves it can
# actually talk to the API; otherwise fail loudly instead of converging green with dead controllers.
- name: Ipa-pki-swap | wait for controller manager to hold a fresh leader lease
  # Shell kept as a documented exception: no native module accepts an arbitrary kubeconfig path
  ansible.builtin.shell: |
    renew_time=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get lease -n kube-system kube-controller-manager -o jsonpath='{.spec.renewTime}' 2>/dev/null) || renew_time=""
    if [ -z "$renew_time" ]; then echo "no-lease"; exit 0; fi
    age=$(( $(date +%s) - $(date -d "$renew_time" +%s) ))
    if [ "$age" -lt 90 ]; then echo "fresh:$age"; else echo "stale:$age"; fi
  become: true
  changed_when: false
  register: cm_lease
  retries: "{{ kubernetes_api_ready_retries }}"
  delay: "{{ kubernetes_api_ready_delay }}"
  until: "'fresh' in cm_lease.stdout"
  delegate_to: "{{ groups[kube_masters_group] | first }}"

# Symmetric with the KCM lease gate above: a crash-looping scheduler (e.g. broken CA trust in
# its kubeconfig) leaves every unscheduled pod — CNI DaemonSets included — stuck Pending, so
# converge must not pass it silently.
- name: Ipa-pki-swap | wait for scheduler static pod to report Ready
  # Shell kept as a documented exception: no native module accepts an arbitrary kubeconfig path
  ansible.builtin.shell: |
    kubectl --kubeconfig /etc/kubernetes/admin.conf get pods -n kube-system -l component=kube-scheduler -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo ""
  become: true
  changed_when: false
  register: scheduler_ready
  retries: "{{ kubernetes_api_ready_retries }}"
  delay: "{{ kubernetes_api_ready_delay }}"
  until: scheduler_ready.stdout == 'true'
  delegate_to: "{{ groups[kube_masters_group] | first }}"

- name: Ipa-pki-swap | add API server override block to kubelet config
  # kubeadm-generated config has no apiServerOverride key, so the block is appended at EOF as a top-level key
  ansible.builtin.blockinfile:
    path: /var/lib/kubelet/config.yaml
    marker: "# {mark} API server override (ipa-pki-swap)"
    insertafter: EOF
    block: |
      apiServerOverride:
        certAuthority: /etc/kubernetes/pki/ca.crt
        url: https://{{ orchestration_host_hostname }}:6443
  become: true
  notify: ansible-orchestration | refresh kube

- name: Ipa-pki-swap | verify kubectl can connect with new CA
  ansible.builtin.shell: |
    kubectl --kubeconfig /etc/kubernetes/admin.conf cluster-info
  become: true
  changed_when: false
  register: kubectl_verify
  retries: 6
  delay: 10
  until: "'Kubernetes control plane' in kubectl_verify.stdout"

# Data-plane recovery must run last: after the kubelet refresh (above) so a recreated pod
# mounts the post-swap CA, and after cluster stabilization. No-op when Calico is absent.
- name: Ipa-pki-swap | recover Calico/Tigera data-plane workloads after CA swap
  ansible.builtin.include_tasks: calico-ca-recovery.yml
