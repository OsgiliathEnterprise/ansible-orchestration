---

- name: Ipa-kubernetes-ca | ensure Kerberos ticket is valid
  ansible.builtin.shell: |
    set -euo pipefail
    echo '{{ company_realm_password }}' | kinit admin
  delegate_to: "{{ groups[idm_group] | first }}"
  changed_when: false
  become: true
  no_log: true

- name: Ipa-kubernetes-ca | ensure kubernetes-ca lightweight ca, acl and membership
  ansible.builtin.include_tasks: ipa-ca-ensure.yml
  vars:
    ipa_ca_ensure_name: kubernetes-ca

# ipagroup is idempotent by itself: no pre-check needed.
- name: Ipa-kubernetes-ca | create kubernetes administrators group
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ company_realm_password }}"
    name: "kubernetes-administrators"
  delegate_to: "{{ groups[idm_group] | first }}"
  no_log: "{{ secure_logs }}"

- name: Ipa-kubernetes-ca | add kube service cluster IP to IPA server hosts for Dogtag reachability check
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ((kube_service_cidr | default('10.96.0.0/12')) | ansible.utils.next_nth_usable(1)) }} {{ orchestration_host_hostname }}"
    state: present
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true

- name: Ipa-kubernetes-ca | add master node IP to IPA server hosts for Dogtag reachability check
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ orchestration_master_ip }} {{ orchestration_host_hostname }}"
    state: present
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true

# FreeIPA's ipacert request runs _validate_san_ips unconditionally (FreeIPA
# layer): every IP SAN needs a forward-reachable IPA-managed A record under a
# name that is also in the same SAN set, plus a matching IPA-managed PTR
# record. The zone, A and PTR records below are load-bearing: without them
# the request fails ("IP address in subjectAltName ... unreachable from DNS
# names" / "does not have PTR record"). The alias names are added to the
# apiserver CSR SAN set in ipa-api-server.yml. The profile flag and
# /etc/hosts entries above cover only the Dogtag layer
# (disableDogtagReachabilityValidation) and do not affect this FreeIPA-layer
# check.

- name: Ipa-kubernetes-ca | ensure reverse zone for service cluster IP exists
  freeipa.ansible_freeipa.ipadnszone:
    ipaadmin_password: "{{ company_realm_password }}"
    name:
      - "{{ ((kube_service_cidr | default('10.96.0.0/12')) | ansible.utils.next_nth_usable(1)).split('.')[:3] | reverse | join('.') ~ '.in-addr.arpa' }}"
    state: present
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"

- name: Ipa-kubernetes-ca | ensure reverse zone for master node IP exists
  freeipa.ansible_freeipa.ipadnszone:
    ipaadmin_password: "{{ company_realm_password }}"
    name:
      - "{{ orchestration_master_ip.split('.')[:3] | reverse | join('.') ~ '.in-addr.arpa' }}"
    state: present
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"

- name: Ipa-kubernetes-ca | create A record for service cluster IP alias (satisfies _validate_san_ips forward reachability)
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ company_realm_password }}"
    name:
      - kubernetes-svc
    zone_name: "{{ company_domain }}"
    record_type: A
    record_value:
      - "{{ (kube_service_cidr | default('10.96.0.0/12')) | ansible.utils.next_nth_usable(1) }}"
  delegate_to: "{{ groups[idm_group][0] }}"
  become: true
  no_log: "{{ secure_logs }}"

- name: Ipa-kubernetes-ca | create A record for master node IP alias (satisfies _validate_san_ips forward reachability)
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ company_realm_password }}"
    name:
      - kubernetes-master
    zone_name: "{{ company_domain }}"
    record_type: A
    record_value:
      - "{{ orchestration_master_ip }}"
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"

# Create the PTR records. When the reverse zone comes into existence or a
# host is enrolled with an IP in the zone, IPA back-fills a relative-name
# PTR for the host IP (e.g. "master"). _validate_san_ips requires *every*
# PTR value for a SAN IP to be a SAN name resolving to that IP, so the
# back-filled short name must be removed. The removal targets only the
# short-name value (no-op when absent, hence idempotent); the create is
# additive and never replaces. Non-host IPs (service cluster IP) are never
# back-filled, so no removal is needed there.

- name: Ipa-kubernetes-ca | create PTR record for service cluster IP alias
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ company_realm_password }}"
    name:
      - "{{ ((kube_service_cidr | default('10.96.0.0/12')) | ansible.utils.next_nth_usable(1)).split('.')[-1] }}"
    zone_name: "{{ ((kube_service_cidr | default('10.96.0.0/12')) | ansible.utils.next_nth_usable(1)).split('.')[:3] | reverse | join('.') ~ '.in-addr.arpa' }}"
    record_type: PTR
    record_value:
      - "kubernetes-svc.{{ company_domain }}"
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"

- name: Ipa-kubernetes-ca | remove back-filled host shortname from PTR record for master node IP
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ company_realm_password }}"
    name:
      - "{{ orchestration_master_ip.split('.')[-1] }}"
    zone_name: "{{ orchestration_master_ip.split('.')[:3] | reverse | join('.') ~ '.in-addr.arpa' }}"
    record_type: PTR
    record_value:
      - "{{ orchestration_host_hostname.split('.')[0] }}"
    state: absent
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"

- name: Ipa-kubernetes-ca | create PTR record for master node IP alias
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ company_realm_password }}"
    name:
      - "{{ orchestration_master_ip.split('.')[-1] }}"
    zone_name: "{{ orchestration_master_ip.split('.')[:3] | reverse | join('.') ~ '.in-addr.arpa' }}"
    record_type: PTR
    record_value:
      - "kubernetes-master.{{ company_domain }}"
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"

# --- Certificate profiles ---
# kubeAdministrators: CN taken from the CSR, O=system:masters; IP SANs allowed
# (Dogtag reachability validation disabled, see the hosts/DNS tasks above).
# kubernetesNodes: forces O=system:nodes AND adds the system:node: CN prefix, so a
# worker's per-node cert authenticates as system:node:<hostname> in group
# system:nodes. The CSR only carries the bare hostname (matching the host principal
# for IPA's host check); the template adds the prefix. No IP SANs.
# kubeControllerManager / kubeScheduler: static-subject profiles (D3a): the CSR
# carries the master's hostname (host-principal check) and the profile rewrites the
# issued subject to the exact system:masters identity the cluster RBAC expects.
# Only kubeAdministrators and kubernetesNodes are linked to the CA #1 ACL here; the
# controller-manager/scheduler profiles are linked to the CA #2 ACL by
# ipa-kubeclusteradm-ca.yml (CA #2 is their issuing CA).

- name: Ipa-kubernetes-ca | ensure kubeAdministrators profile
  ansible.builtin.include_tasks: ipa-ca-profile.yml
  vars:
    ipa_ca_profile_id: kubeAdministrators
    ipa_ca_profile_desc: Kubernetes administration certificates
    ipa_ca_profile_file: /tmp/ipa_default_ca_profile.cfg
    ipa_ca_profile_subject: "CN=$request.req_subject_name.cn$, O=system:masters"
    ipa_ca_profile_extra:
      - regexp: '^subjectAltName='
        line: subjectAltName=$request.req_subject_alt_name$
      - line: disableDogtagReachabilityValidation=true

- name: Ipa-kubernetes-ca | ensure kubernetesNodes profile
  ansible.builtin.include_tasks: ipa-ca-profile.yml
  vars:
    ipa_ca_profile_id: kubernetesNodes
    ipa_ca_profile_desc: Kubernetes worker-node client certificates
    ipa_ca_profile_file: /tmp/ipa_node_ca_profile.cfg
    ipa_ca_profile_subject: "CN=system:node:$request.req_subject_name.cn$, O=system:nodes"

- name: Ipa-kubernetes-ca | ensure kubeControllerManager profile
  ansible.builtin.include_tasks: ipa-ca-profile.yml
  vars:
    ipa_ca_profile_id: kubeControllerManager
    ipa_ca_profile_desc: Kubernetes controller-manager client certificate
    ipa_ca_profile_file: /tmp/ipa_cm_ca_profile.cfg
    ipa_ca_profile_subject: "CN=system:kube-controller-manager, O=system:masters"

- name: Ipa-kubernetes-ca | ensure kubeScheduler profile
  ansible.builtin.include_tasks: ipa-ca-profile.yml
  vars:
    ipa_ca_profile_id: kubeScheduler
    ipa_ca_profile_desc: Kubernetes scheduler client certificate
    ipa_ca_profile_file: /tmp/ipa_scheduler_ca_profile.cfg
    ipa_ca_profile_subject: "CN=system:kube-scheduler, O=system:masters"

- name: Ipa-kubernetes-ca | link profiles to the kubernetes-ca ca-acl
  ansible.builtin.include_tasks: ipa-ca-link-profile.yml
  loop:
    - kubeAdministrators
    - kubernetesNodes
  vars:
    ipa_ca_link_acl: kubernetes-ca-acl
    ipa_ca_link_profile: "{{ item }}"
