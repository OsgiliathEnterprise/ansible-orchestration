---

- name: Ipa-certs | kerberos safeguard
  ansible.builtin.command: kinit -kt /etc/krb5.keytab
  become: true
  changed_when: false

- name: Ipa-certs | create kubernetes pki directory
  ansible.builtin.file:
    path: "{{ kubernetes_certificates_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: True

- name: Ipa-certs | backup kubeadm self-signed ca
  ansible.builtin.copy:
    src: "{{ kubernetes_certificates_path }}ca.crt"
    dest: "{{ kubernetes_certificates_path }}ca.crt.kubeadm"
    remote_src: yes
  failed_when: false
  become: true

- name: Ipa-certs | delegate kubernetes ca creation to IPA
  ansible.builtin.include_tasks: ipa-kubernetes-ca.yml

- name: Ipa-certs | download ca from IPA to temp location
  ansible.builtin.shell: |
    set -o pipefail && echo '{{ company_realm_password }}' | kinit admin > /dev/null
    ipa ca-show kubernetes-ca --certificate-out={{ kubernetes_certificates_path }}ca.crt.new
  no_log: "{{ secure_logs }}"
  changed_when: false
  become: true

- name: Ipa-certs | verify ca.crt.new fingerprint matches expected IPA CA
  ansible.builtin.shell: |
    openssl x509 -in {{ kubernetes_certificates_path }}ca.crt.new -noout -fingerprint -sha256 2>/dev/null | tr -d ':' | tr '[:upper:]' '[:lower:]' | sed 's/sha256 fingerprint=//'
  become: true
  changed_when: false

- name: Ipa-certs | create merged CA bundle (kubeadm + IPA) for client auth
  ansible.builtin.shell: |
    set -euo pipefail
    cat {{ kubernetes_certificates_path }}ca.crt.kubeadm {{ kubernetes_certificates_path }}ca.crt.new > {{ kubernetes_certificates_path }}ca-bundle.crt
  become: true
  changed_when: true

- name: Ipa-certs | replace CA cert with IPA CA
  ansible.builtin.copy:
    src: "{{ kubernetes_certificates_path }}ca.crt.new"
    dest: "{{ kubernetes_certificates_path }}ca.crt"
    remote_src: yes
    mode: '0644'
  become: true

- name: Ipa-certs | update API server static pod to use merged CA bundle for client auth
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    regexp: '--client-ca-file=/etc/kubernetes/pki/ca\.crt'
    replace: '--client-ca-file=/etc/kubernetes/pki/ca-bundle.crt'
  become: true

- name: Ipa-certs | update controller-manager to use kubeadm CA for signing and merged bundle for client auth
  ansible.builtin.shell: |
    set -euo pipefail
    CM="/etc/kubernetes/manifests/kube-controller-manager.yaml"
    sed -i 's|--client-ca-file=/etc/kubernetes/pki/ca\.crt|--client-ca-file=/etc/kubernetes/pki/ca-bundle.crt|' "$CM"
    sed -i 's|--cluster-signing-cert-file=/etc/kubernetes/pki/ca\.crt|--cluster-signing-cert-file=/etc/kubernetes/pki/ca.crt.kubeadm|' "$CM"
    sed -i 's|--root-ca-file=/etc/kubernetes/pki/ca\.crt|--root-ca-file=/etc/kubernetes/pki/ca-bundle.crt|' "$CM"
  become: true
  changed_when: true

- name: Ipa-certs | update scheduler to use merged CA bundle for root CA
  ansible.builtin.shell: |
    set -euo pipefail
    SC="/etc/kubernetes/manifests/kube-scheduler.yaml"
    if grep -q '\-\-root-ca-file' "$SC"; then
      sed -i 's|--root-ca-file=/etc/kubernetes/pki/ca\.crt|--root-ca-file=/etc/kubernetes/pki/ca-bundle.crt|' "$SC"
    fi
  become: true
  changed_when: true

- name: Ipa-certs | wait for API server to restart after static pod update
  ansible.builtin.wait_for:
    port: 6443
    host: localhost
    delay: 10
    timeout: 120
  become: true

- name: Ipa-certs | create IPA service principal for master hostname
  ansible.builtin.include_tasks: ipa-master.yml

- name: Ipa-certs | remove kubeadm apiserver cert so IPA-signed one is created
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ kubernetes_certificates_path }}apiserver.crt"
    - "{{ kubernetes_certificates_path }}apiserver.key"
    - "{{ kubernetes_certificates_path }}apiserver.csr"
  become: true

- name: Ipa-certs | create apiserver cert signed by IPA
  ansible.builtin.include_tasks: ipa-api-server.yml

- name: Ipa-certs | create front-proxy client cert
  ansible.builtin.include_tasks: ipa-front-proxy.yml

- name: Ipa-certs | create kubelet client certs
  ansible.builtin.include_tasks: kube-apiserver-kubelet-client.yml

- name: Ipa-certs | Check SA key exists
  ansible.builtin.stat:
    path: "{{ kubernetes_certificates_path }}sa.key"
  register: kube_sa_key_result

- name: Ipa-certs | generate SA key
  community.crypto.openssl_privatekey:
    path: "{{ kubernetes_certificates_path }}sa.key"
    mode: '0600'
    owner: root
    group: root
    type: ec
    size: 256
  when:
   - not kube_sa_key_result.stat.exists
  become: true

- name: Ipa-certs | restart API server to pick up new IPA-signed certificate
  ansible.builtin.shell: |
    touch /etc/kubernetes/manifests/kube-apiserver.yaml
  become: true
  changed_when: true

- name: Ipa-certs | wait for API server to restart with new certificate
  ansible.builtin.uri:
    url: "https://127.0.0.1:6443/healthz"
    validate_certs: no
    status_code: 200
  become: true
  retries: 12
  delay: 10
  register: result
  until: result.status == 200

- name: Ipa-certs | verify API server cert chain is valid
  ansible.builtin.shell: |
    openssl verify -CAfile /etc/kubernetes/pki/ca.crt /etc/kubernetes/pki/apiserver.crt
  become: true
  changed_when: false
  register: cert_chain_verify
  retries: 3
  delay: 5
  until: cert_chain_verify.rc == 0

- name: Ipa-certs | debug kubectl connection for troubleshooting
  ansible.builtin.shell: |
    kubectl --kubeconfig /etc/kubernetes/admin.conf cluster-info 2>&1 || true
  become: true
  changed_when: false
  register: kubectl_debug
  failed_when: false

- name: Ipa-certs | show kubectl debug output
  ansible.builtin.debug:
    var: kubectl_debug.stdout_lines

- name: Ipa-certs | verify kubectl can connect to API server (best effort, final check in ipa-pki-swap)
  ansible.builtin.shell: |
    kubectl --kubeconfig /etc/kubernetes/admin.conf cluster-info
  become: true
  changed_when: false
  failed_when: false
  register: kubectl_verify
  retries: 3
  delay: 10


