---

- name: Kube-install | Check if the control plane is already initialized on master
  ansible.builtin.stat:
    path: "{{ kube_config_path }}"
  when: kube_masters_group in group_names
  register: kube_init_stat

- name: Kube-install | Clean PKI directory before kubeadm init on master
  # Only clean when the cluster is NOT initialized: tcharl.kubernetes skips
  # `kubeadm init` when admin.conf exists, so on a re-converge of a live
  # cluster a wiped /etc/kubernetes/pki leaves admin.conf's
  # certificate-authority dangling and the coredns restart task (and every
  # other admin.conf-authenticated task) fails to trust the API server.
  # A broken PKI on an initialized master is recovered with reset_kube: True.
  ansible.builtin.file:
    path: "{{ kubernetes_certificates_path }}"
    state: absent
  become: true
  when:
    - kube_masters_group in group_names
    - not (kube_init_stat.stat.exists | default(false))

- name: Kube-install | Create kubernetes configuration directory
  ansible.builtin.file:
    path: "{{ kube_config_folder }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: True

- name: Kube-install | Compute geerlingguy-kubernetes node group
  ansible.builtin.debug:
    msg: "{{ 'control_plane' if kube_masters_group in group_names else ('node' if kube_nodes_group in group_names) }}"
  register: kube_node_role

- name: Kube-install | Compute Calico configuration directory
  # Stable location instead of a TemporaryFile: the temp directory was
  # recreated (changed) on every reconverge and its content never cleaned.
  # A fixed directory under the kubernetes home is idempotent by construction,
  # and the template copy below is content-idempotent (checksum-gated).
  ansible.builtin.set_fact:
    calico_conf_dir:
      path: "{{ kube_kubernetes_home_folder | default('/home/kubecreds') }}/calico-conf"

- name: Kube-install | Ensure Calico configuration directory
  ansible.builtin.file:
    path: "{{ calico_conf_dir.path }}"
    state: directory
    mode: '0755'
  become: True

- name: Kube-install | Calico configuration template copy on remote
  ansible.builtin.template:
    mode: '0640'
    src: calico_configuration.yml.j2
    dest: "{{ calico_conf_dir.path }}/calico_configuration.yml"
  become: True

- name: Kube-install | Compute configuration file
  ansible.builtin.debug:
#    msg: "{{ 'https://raw.githubusercontent.com/projectcalico/calico/' + calico_cni_version + '/manifests/custom-resources.yaml' }}"
    msg: "{{ calico_conf_dir.path + '/calico_configuration.yml' }}"
  register: calico_configuration_file

- name: Kube-install | Debug kubecidr ip address
  ansible.builtin.debug:
#    msg: "{{ 'https://raw.githubusercontent.com/projectcalico/calico/' + calico_cni_version + '/manifests/custom-resources.yaml' }}"
    msg: "{{ kube_cidr | ansible.utils.next_nth_usable(9) }}"
    verbosity: 2

- name: Kube-install | certs sans list
  ansible.builtin.debug:
#    msg: "{{ 'https://raw.githubusercontent.com/projectcalico/calico/' + calico_cni_version + '/manifests/custom-resources.yaml' }}"
    msg: "{{ kube_alt_names | default(['api.kubernetes.' + company_domain]) + [orchestration_master_ip | ansible.utils.ipaddr] | list }}"
    verbosity: 2

- name: Kubernetes | Determine expected IPA DNS server
  ansible.builtin.set_fact:
    kube_expected_dns_ip: >-
      {{ hostvars[groups[idm_group][0]].ansible_default_ipv4.address
         | default(hostvars[groups[idm_group][0]].ansible_host | default(''))
         if idm_group in groups and groups[idm_group] | length > 0
         else '' }}

- name: Kubernetes | Check systemd-resolved DNS servers
  ansible.builtin.command: resolvectl status
  register: kube_resolved_status
  changed_when: false
  become: True

- name: Kubernetes | Restart systemd-resolved # to be sure that the dns is using ipa
  # Restart only when the IPA DNS server is not among the active DNS servers
  # (or the expected address is unknown — preserve the old unconditional
  # behaviour). The IPA client install lands IPA's DNS in resolved's per-link
  # config; once it is live a restart is pure churn.
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted
  become: True
  when:
    - >-
      kube_expected_dns_ip | default('') | length == 0
      or not (kube_resolved_status.stdout_lines
              | select('search', 'DNS Server')
              | select('search', kube_expected_dns_ip)
              | list | length > 0)

- name: Kube-install | debug kubernetes package version
  ansible.builtin.debug:
    msg: "{{ kubernetes_package_version }}"
    verbosity: 2

- name: Kube-install | Check if Kubernetes is already initialized on this host
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kube_already_initialized
  become: true

# Join marker for workers: /etc/kubernetes/kubelet.conf is created by kubeadm join
# (performed by kube-install-join-node.yml). Once a node has joined, re-running the
# tcharl.kubernetes role is pure churn — its main.yml unconditionally restarts
# containerd and kubelet on every run. Mirrors the admin.conf gate above: the role
# runs on first install only.
- name: Kube-install | Check if this node has already joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kube_node_already_joined
  become: true

# Pre-join CA hash computation removed.
# Node join is now handled by kube-install-join-node.yml after master post-processing
# (IPAServer scale-down, ipa-certs, ipa-pki-swap) completes.
# This avoids the race condition where the ConfigMap CA changes between hash
# computation and join execution.
# kubernetes_join_command is set empty below on purpose to disable the built-in node
# join in tcharl.kubernetes (node-setup.yml only joins when it is non-empty).

- name: Kube-install | Install Kubernetes using role
  ansible.builtin.include_role:
    name: tcharl.kubernetes
  when:
    - not kube_already_initialized.stat.exists
    - not kube_node_already_joined.stat.exists
  vars:
    ansible_become: true
    kubernetes_version: "{{ k8s_version }}"
    kubernetes_yum_arch: '$basearch'
    kubernetes_yum_base_url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/"
    kubernetes_yum_gpg_key: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/repodata/repomd.xml.key"
    kubernetes_version_fedora_package: "{{ kubernetes_package_version }}"
    kubernetes_kubelet_extra_args: "--node-ip={{ orchestration_host_ip | ansible.utils.ipaddr }}"
    kubernetes_apiserver_advertise_address: "{{ orchestration_master_ip | ansible.utils.ipaddr }}"
    kubernetes_pod_network:
      cni: "{{ kube_cni }}"
      cidr: "{{ kube_cidr }}"
    calico_version: "{{ calico_cni_version }}"
    kubernetes_calico_configuration_file: "{{ calico_configuration_file.msg }}"
    kubernetes_allow_pods_on_control_plane: "{{ kubernetes_allow_pods_on_master }}"
    kubernetes_ignore_preflight_errors: "Firewalld,SystemVerification"
    kubernetes_role: "{{ kube_node_role.msg }}"
    kubernetes_join_command: ""
    kubernetes_kube_port: "{{ orchestration_kube_port }}"
    kubernetes_config_cluster_configuration:
      networking:
        podSubnet: "{{ kube_cidr }}"
        serviceSubnet: "{{ kube_service_cidr | default('10.96.0.0/12') }}"
      apiServer:
        certSANs: "{{ kube_alt_names | default(['api.kubernetes.' + company_domain]) + [orchestration_master_ip | ansible.utils.ipaddr, (kube_service_cidr | default('10.96.0.0/12')) | ansible.utils.next_nth_usable(1)] }}"
        extraArgs:
          - name: authorization-mode
            value: Node,RBAC
      controlPlaneEndpoint: "{{ orchestration_host_hostname }}:{{ orchestration_kube_port }}"
    kubernetes_config_kubelet_configuration:
      cgroupDriver: systemd
      resolvConf: /run/systemd/resolve/resolv.conf

- name: Kube-install | Give secure permissions to kubernetes admin file
  # First-install only: steady state is owned by ipa-pki-swap.yml, which relaxes
  # the kubeconfigs to 0644 for the testinfra suite (root:root 0700 on the kubecreds
  # dir already keeps them private). Re-applying 0600 on every reconverge created
  # a mode ping-pong (0600 here -> 0644 there = two changes per run).
  ansible.builtin.file:
    path: "{{ kube_config_path }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - kube_masters_group in group_names
    - not kube_already_initialized.stat.exists
  become: yes

- name: Kube-install | Wait for this node's calico-node pod to be Ready before restarting coredns
  # Fifth bucket (Travis kvm #108): the tcharl.kubernetes role above applies the Tigera
  # Installation and returns WITHOUT waiting for calico-node pods. Until this node's
  # calico-node is Ready the kubelet never initializes CNI, so every Pod scheduled here
  # (coredns first) stays unavailable — the restart rollout below starved on cold CI
  # runners where the calico image pull takes minutes. Gate on this node's pod only
  # (field_selector), not the whole DaemonSet: the master's own CNI is all the coredns
  # restart on this node needs, and workers join later via kube-install-join-node.yml.
  # failed_when: false keeps exhaustion inside our control so the named fail below owns
  # the failure with pod-level evidence (bare until-retries aborts on final attempt).
  # Split into phase A + diagnostics + phase B (Travis kvm #110 post-mortem): #110 was
  # killed by the 90-min travis_wait wall WHILE this gate polled, so the pod-level
  # evidence carried by the named fail never reached the log. Phase A burns only a
  # fraction of the budget; when it exhausts, the diagnostic tasks below dump the
  # calico-system / tigera-operator pod states into the log BEFORE the remaining
  # phase B budget is spent.
  # Param discipline (kvm #108 post-mortem): this pinned kubernetes.core does NOT
  # support all_namespaces nor the singular label_selector/field_selector — passing
  # them raises "Unsupported parameters", which failed_when: false used to swallow,
  # leaving the gate polling an empty list until it killed the run. Scope with the
  # plural list params and the namespace tigera-operator always places calico-node
  # in (Calico typha variant; verified on the live cluster), matching the known-good
  # query in tasks/certs/calico-ca-recovery.yml.
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kube_config_path }}"
    api_version: v1
    kind: Pod
    namespace: calico-system
    label_selectors:
      - "k8s-app=calico-node"
    field_selectors:
      - "spec.nodeName={{ inventory_hostname }}"
  register: kube_calico_node_pods_phase_a
  until: >-
    kube_calico_node_pods_phase_a.resources | default([]) | length > 0
    and kube_calico_node_pods_phase_a.resources
        | map(attribute='status.phase', default='') | select('equalto', 'Running') | list | length > 0
    and kube_calico_node_pods_phase_a.resources
        | map(attribute='status.conditions', default=[]) | flatten | default([], true)
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: "{{ kube_calico_node_ready_phase_a_retries }}"
  delay: "{{ kube_calico_node_ready_delay }}"
  failed_when: false
  when: kube_masters_group in group_names
  become: yes

# ---------------------------------------------------------------------------
# Interim diagnostics (Travis kvm #110): when phase A exhausts without the pod
# becoming Ready, dump why BEFORE spending the rest of the gate budget — a CI
# run killed by the wall then still shows container waiting reasons, operator
# state and cluster events in its log. Read-only k8s_info probes; every one is
# failed_when: false so diagnostics can never turn a passing run into a failure.
# ---------------------------------------------------------------------------

- name: Kube-install | Diagnostics | List all calico-system pods
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kube_config_path }}"
    api_version: v1
    kind: Pod
    namespace: calico-system
  register: kube_calico_diag_pods
  failed_when: false
  when:
    - kube_masters_group in group_names
    - not (kube_calico_node_pods_phase_a.resources | default([]) | length > 0
           and kube_calico_node_pods_phase_a.resources
               | map(attribute='status.conditions', default=[]) | flatten | default([], true)
               | selectattr('type', 'equalto', 'Ready')
               | selectattr('status', 'equalto', 'True') | list | length > 0)
  become: yes

- name: Kube-install | Diagnostics | List tigera-operator pods
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kube_config_path }}"
    api_version: v1
    kind: Pod
    namespace: tigera-operator
  register: kube_calico_diag_operator
  failed_when: false
  when:
    - kube_masters_group in group_names
    - not (kube_calico_node_pods_phase_a.resources | default([]) | length > 0
           and kube_calico_node_pods_phase_a.resources
               | map(attribute='status.conditions', default=[]) | flatten | default([], true)
               | selectattr('type', 'equalto', 'Ready')
               | selectattr('status', 'equalto', 'True') | list | length > 0)
  become: yes

- name: Kube-install | Diagnostics | List recent calico-system events
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kube_config_path }}"
    api_version: v1
    kind: Event
    namespace: calico-system
  register: kube_calico_diag_events
  failed_when: false
  when:
    - kube_masters_group in group_names
    - not (kube_calico_node_pods_phase_a.resources | default([]) | length > 0
           and kube_calico_node_pods_phase_a.resources
               | map(attribute='status.conditions', default=[]) | flatten | default([], true)
               | selectattr('type', 'equalto', 'Ready')
               | selectattr('status', 'equalto', 'True') | list | length > 0)
  become: yes

- name: Kube-install | Diagnostics | Print calico bring-up state
  ansible.builtin.debug:
    msg: |-
      CALICO-DIAG (phase A exhausted after {{ (kube_calico_node_ready_phase_a_retries | int + 1) * (kube_calico_node_ready_delay | int) }} s, pod still not Ready):
      this node's calico-node: {{ kube_calico_node_pods_phase_a.resources | default([], true)
        | map(attribute='metadata.name', default='(none)') | list }}
        phases {{ kube_calico_node_pods_phase_a.resources | default([], true)
        | map(attribute='status.phase', default='') | list }}
      calico-system pods:
      {% for p in kube_calico_diag_pods.resources | default([], true) %}
      - {{ p.metadata.name }} phase={{ p.status.phase | default('?') }} restarts={{ p.status.containerStatuses | default([], true) | map(attribute='restartCount', default=0) | list }} waiting={{ p.status.containerStatuses | default([], true) | map(attribute='state.waiting.reason', default='') | select | list }}
      {% endfor %}
      tigera-operator pods:
      {% for p in kube_calico_diag_operator.resources | default([], true) %}
      - {{ p.metadata.name }} phase={{ p.status.phase | default('?') }} restarts={{ p.status.containerStatuses | default([], true) | map(attribute='restartCount', default=0) | list }} waiting={{ p.status.containerStatuses | default([], true) | map(attribute='state.waiting.reason', default='') | select | list }} images={{ p.spec.containers | default([], true) | map(attribute='image') | list }}
      {% endfor %}
      recent calico-system events (reason/target/message):
      {% for e in (kube_calico_diag_events.resources | default([], true))[-25:] %}
      - {{ e.reason | default('?') }}/{{ e.involvedObject.kind | default('?') }}/{{ e.involvedObject.name | default('?') }}: {{ (e.message | default('')) | truncate(140, true) }}
      {% endfor %}
  when:
    - kube_masters_group in group_names
    - not (kube_calico_node_pods_phase_a.resources | default([]) | length > 0
           and kube_calico_node_pods_phase_a.resources
               | map(attribute='status.conditions', default=[]) | flatten | default([], true)
               | selectattr('type', 'equalto', 'Ready')
               | selectattr('status', 'equalto', 'True') | list | length > 0)

- name: Kube-install | Wait (phase B) for this node's calico-node pod to be Ready
  # Remaining budget after phase A. Same query shape; register keeps the historical
  # name so the named fail below reads the LAST observed state.
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kube_config_path }}"
    api_version: v1
    kind: Pod
    namespace: calico-system
    label_selectors:
      - "k8s-app=calico-node"
    field_selectors:
      - "spec.nodeName={{ inventory_hostname }}"
  register: kube_calico_node_pods
  until: >-
    kube_calico_node_pods.resources | default([]) | length > 0
    and kube_calico_node_pods.resources
        | map(attribute='status.phase', default='') | select('equalto', 'Running') | list | length > 0
    and kube_calico_node_pods.resources
        | map(attribute='status.conditions', default=[]) | flatten | default([], true)
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: "{{ (kube_calico_node_ready_retries | int) - (kube_calico_node_ready_phase_a_retries | int) }}"
  delay: "{{ kube_calico_node_ready_delay }}"
  failed_when: false
  when: kube_masters_group in group_names
  become: yes

- name: Kube-install | Fail clearly if this node's calico-node pod never became Ready
  ansible.builtin.fail:
    msg: >-
      Kube-install | calico-node pod on this node never became Ready within
      {{ (kube_calico_node_ready_retries | int + 1) * (kube_calico_node_ready_delay | int) }} s
      (last pods: {{ kube_calico_node_pods.resources | default([]) | map(attribute='metadata.name') | list }},
      phases {{ kube_calico_node_pods.resources | default([]) | map(attribute='status.phase', default='') | list }},
      container states {{ kube_calico_node_pods.resources | default([])
        | map(attribute='status.containerStatuses', default=[]) | flatten | default([], true)
        | map(attribute='state') | list }},
      query error: {{ kube_calico_node_pods.msg | default('none') }}
      ). CNI never initialized, so coredns could not start: calico image pull or
      tigera-operator failure upstream, or a broken gate query (see query error).
      Pod-level detail was already dumped by the CALICO-DIAG tasks above.
  when:
    - kube_masters_group in group_names
    - not (kube_calico_node_pods.resources | default([]) | length > 0
           and kube_calico_node_pods.resources
               | map(attribute='status.conditions', default=[]) | flatten | default([], true)
               | selectattr('type', 'equalto', 'Ready')
               | selectattr('status', 'equalto', 'True') | list | length > 0)
- name: Kube-install | Restarts coredns after calico installation # needed to fix kubernetes internal dns resolution
  # Explicit kubeconfig+context: at this point /root/.kube/config does not exist yet (it is only
  # symlinked later in ipa-pki-swap), so a bare kubectl call would fail and the old failed_when:false
  # swallowed that — likely a silent no-op on fresh installs. The restartedAt annotation value is
  # tied to the CNI version, so re-converge at an unchanged calico_cni_version is a no-op.
  # Load-tolerance (Travis kvm build #107): the freshly initialized API server answers this call
  # with 504 Gateway Timeout under calico bring-up load, which killed the master chain minutes
  # before kubernetesNodes profile creation and starved the node join gate. The patch is idempotent
  # (same restartedAt value), so the until-loop retries are safe; failed_when: false keeps
  # exhaustion inside our control so the named fail below reports the API-side evidence instead of
  # an anonymous until-exhaustion failure.
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    namespace: kube-system
    name: coredns
    kubeconfig: "{{ kube_config_path }}"
    context: kubernetes-admin@kubernetes
    state: present
    wait: false
    resource_definition:
      spec:
        template:
          metadata:
            annotations:
              restartedAt: "calico-{{ calico_cni_version }}"
  register: kube_coredns_restart_apply
  until: kube_coredns_restart_apply is succeeded
  retries: 6
  delay: 10
  failed_when: false
  when: kube_masters_group in group_names
  become: yes

- name: Kube-install | Fail if coredns restart annotation never applied
  ansible.builtin.fail:
    msg: >-
      Kube-install | coredns restart annotation could not be applied after 6 attempts
      (last error: {{ kube_coredns_restart_apply.msg | default('unknown') }}). The API server
      is unhealthy during calico bring-up; without the restartedAt patch cluster DNS stays broken
      and every downstream cert/DNS task will cascade. Upstream: kubeadm init / calico install.
  when: kube_masters_group in group_names and kube_coredns_restart_apply is failed

- name: Kube-install | Wait for coredns restart rollout
  # Replaces the module's wait:true (a 504 on any poll used to fail the task outright). The
  # observedGeneration check ensures we wait for the RESTARTED rollout, not the pre-patch one.
  # Transient 5xx during polling re-renders `until` false and simply retries; only true budget
  # exhaustion reaches the named fail. Combined with the calico-node gate above (48x10s) and the
  # apply retries (6x10s) the worst-case wait stays inside the node join profile-gate ceiling
  # (~20 min) so master never starves the gate behind these waits.
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: kube-system
    name: coredns
    kubeconfig: "{{ kube_config_path }}"
    context: kubernetes-admin@kubernetes
  register: kube_coredns_rollout
  until: >-
    (kube_coredns_rollout.resources | default([]) | length > 0) and
    (kube_coredns_rollout.resources[0].status | default({})).observedGeneration | default(0) >=
    (kube_coredns_rollout.resources[0].metadata | default({})).generation | default(0) and
    (kube_coredns_rollout.resources[0].status | default({})).readyReplicas | default(0) >=
    (kube_coredns_rollout.resources[0].spec | default({})).replicas | default(1)
  retries: 24
  delay: 20
  failed_when: false
  when: kube_masters_group in group_names
  become: yes

- name: Kube-install | Assess coredns rollout completion
  # Single evaluation of the rollout-complete condition, shared by the evidence task and
  # the named fail below (the until-loop keeps its own inline copy).
  ansible.builtin.set_fact:
    kube_coredns_rollout_complete: "{{ (kube_coredns_rollout.resources | default([]) | length > 0)
      and (kube_coredns_rollout.resources[0].status | default({})).observedGeneration | default(0) >=
           (kube_coredns_rollout.resources[0].metadata | default({})).generation | default(0)
      and (kube_coredns_rollout.resources[0].status | default({})).readyReplicas | default(0) >=
           (kube_coredns_rollout.resources[0].spec | default({})).replicas | default(1) }}"
  when: kube_masters_group in group_names
  become: yes

- name: Kube-install | Collect coredns pod evidence for the rollout failure
  # #108 post-mortem: the deployment-level observation alone could not say WHY replicas
  # stayed unavailable; pulling the pod summary (phase + container waiting reason) at the
  # failure point turns the next such CI failure into a one-line diagnosis.
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kube_config_path }}"
    api_version: v1
    kind: Pod
    namespace: kube-system
    # Plural param: singular label_selector is unsupported by the pinned kubernetes.core.
    label_selectors:
      - "k8s-app=kube-dns"
  register: kube_coredns_pods_evidence
  when:
    - kube_masters_group in group_names
    - not (kube_coredns_rollout_complete | default(false) | bool)
  become: yes

- name: Kube-install | Fail if coredns restart rollout never completed
  ansible.builtin.fail:
    msg: >-
      Kube-install | coredns deployment never reported a complete restarted rollout within the
      wait budget (last observation: {{ kube_coredns_rollout.resources | default('API unreachable') }};
      pods: {{ kube_coredns_pods_evidence.resources | default([]) | map(attribute='metadata.name') | list }},
      phases {{ kube_coredns_pods_evidence.resources | default([]) | map(attribute='status.phase', default='') | list }},
      waiting reasons {{ kube_coredns_pods_evidence.resources | default([])
        | map(attribute='status.containerStatuses', default=[]) | flatten | default([], true)
        | map(attribute='state.waiting.reason', default='') | list }}).
      Upstream: calico bring-up on master; inspect 'kubectl -n kube-system get deploy coredns' and
      calico pod logs.
  when: kube_masters_group in group_names and not (kube_coredns_rollout_complete | default(false) | bool)

- name: Kube-install | download calicoctl
  ansible.builtin.get_url:
    url: "https://github.com/projectcalico/calico/releases/download/{{ calico_cni_version }}/calicoctl-{{ calico_os }}-{{ (ansible_facts.architecture == 'aarch64') | ternary('arm64', 'amd64') }}"
    dest: "/usr/local/bin/kubectl-calico"
    mode: u=rwx,g=r,o=r
  become: yes
