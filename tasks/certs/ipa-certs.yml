---
# PKI swap onto the FreeIPA two-CA model:
#
#   CA #1 (kubernetes-ca) — the cluster trust anchor: signs the API server
#   *serving* cert (apiserver.crt) and stays as ca.crt (the kubeconfig
#   certificate-authority).
#   CA #2 (kubeclusteradm) — the client CA: signs the front-proxy, kubelet,
#   node, admin, controller-manager and scheduler client certs (the latter two
#   re-issued from CA #2 via static-subject profiles; the kubeadm originals are
#   replaced in-place). Its CA cert is fetched to ca.crt.kubeclusteradm
#   (provisioned by ipa-kubeclusteradm-ca.yml).
#   ca-bundle.crt = CA #2 + CA #1 — fed to --client-ca-file / --root-ca-file
#   so both CA-signed certs validate. The steady-state trust surface is exactly
#   these two IPA-issued CAs: the kubeadm self-signed CA is retired (deleted from
#   disk, KCM signing disabled) at the end of ipa-pki-swap.yml.

- name: Ipa-certs | create kubernetes pki directory
  ansible.builtin.file:
    path: "{{ kubernetes_certificates_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: True

# Retirement gating (design D5): while ca.crt is still the kubeadm self-signed
# CA (subject == issuer) the backup below must run; once ca.crt holds the
# IPA-issued CA #1 a re-converge must NOT re-copy it into ca.crt.kubeadm, or the
# retired artifact would be resurrected (and flap changed) on every run.
- name: Ipa-certs | read current cluster CA identity
  community.crypto.x509_certificate_info:
    path: "{{ kubernetes_certificates_path }}ca.crt"
  register: kube_current_ca_info
  failed_when: false
  become: true

- name: Ipa-certs | determine whether the cluster CA is already IPA-issued
  ansible.builtin.set_fact:
    kube_api_ca_is_ipa: >-
      {{ kube_current_ca_info.subject is defined
         and kube_current_ca_info.subject != kube_current_ca_info.issuer }}

- name: Ipa-certs | backup kubeadm self-signed ca
  ansible.builtin.copy:
    src: "{{ kubernetes_certificates_path }}ca.crt"
    dest: "{{ kubernetes_certificates_path }}ca.crt.kubeadm"
    mode: '0640'
    remote_src: yes
  failed_when: false
  when: not (kube_api_ca_is_ipa | bool)
  become: true

- name: Ipa-certs | delegate kubernetes ca creation to IPA
  ansible.builtin.include_tasks: ipa-kubernetes-ca.yml

- name: "Ipa-certs | delegate kubeclusteradm CA (CA #2) creation to IPA"
  ansible.builtin.include_tasks: ipa-kubeclusteradm-ca.yml

# Host grants must precede every self-enrollment in this play (design D3):
# usercat=all covers users only, so host-principal enrollment against CA #1 /
# CA #2 fails without an explicit caacl host membership. ipa-cert-renewal.yml
# re-asserts the same grants later as the steady-state pass.
- name: Ipa-certs | apply CA ACL host grants before any self-enrollment
  ansible.builtin.include_tasks: ipa-ca-acl-prejoin.yml

# CA downloads run as admin ON idm (design D1): the shuttle executes delegated
# to the FreeIPA server and only the fetched certificate bytes are shuttled to
# the master via slurp + copy: content. The realm admin password never reaches
# a kube host — the ticket is minted idm-local through the shared include (D4:
# pre-cleared scratch cache, changed_when: false; no_log derived from
# secure_logs). The shuttle is drift-gated (probes below) and mints a per-run
# root-only tempfile directory on idm — no fixed folder, so concurrent fetches
# on the shared idm host can never collide and steady state never touches it.
# The fingerprint verification below stays master-local: it reads the installed
# file and needs no ticket.
- name: Ipa-certs | acquire admin ticket into scratch cache (idm-local)
  ansible.builtin.include_tasks: ../_krb_ticket.yml
  vars:
    krb_ticket_principal: admin
    krb_ticket_cache_purpose: ca_download
    krb_ticket_password: "{{ company_realm_password }}"
    krb_ticket_delegate_to: "{{ groups[idm_group] | first }}"

# Legacy sweep: /run/ipa-ca-fetch was the fixed shuttle directory of an earlier
# implementation (default kube_idm_ca_fetch_dir, since removed). state: absent
# is idempotent by construction — it reports changed only on the first pass
# that actually removes the residue (same policy as the /tmp/kubeclusteradm
# .keytab sweep in ipa-cert-renewal.yml).
- name: Ipa-certs | sweep legacy fixed CA-fetch directory on idm
  ansible.builtin.file:
    path: /run/ipa-ca-fetch
    state: absent
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true

# Drift gate: fetch only when an installed copy is missing or its SHA-256
# fingerprint differs from the IPA-published CA. Both probes are read-only
# against IPA/master state (the published side writes only a shell-local
# mktemp scratch removed on exit, same class as the scratch ticket caches),
# so the blanket changed_when: false is truthful per the AGENTS policy;
# x509_certificate_info exposes certificate fields, not fingerprints, so the
# comparison follows the openssl idiom of the verify task below — both sides
# run the identical normalization and the strings are directly comparable. A
# probe failure (rc != 0) deliberately fails the task: silently treating a
# broken probe as "drift" would reopen the always-fetch path this gate removes.
- name: Ipa-certs | stat installed CA copies (fetch drift gate)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ kubernetes_certificates_path }}ca.crt.new"
    - "{{ kubernetes_certificates_path }}ca.crt.kubeclusteradm"
  register: kube_ca_installed_stat
  become: true

- name: Ipa-certs | read installed CA fingerprints (fetch drift gate)
  ansible.builtin.shell: |
    set -euo pipefail
    openssl x509 -in {{ item.item }} -noout -fingerprint -sha256 2>/dev/null | tr -d ':' | tr '[:upper:]' '[:lower:]' | sed 's/sha256 fingerprint=//'
  loop: "{{ kube_ca_installed_stat.results }}"
  when: item.stat.exists
  register: kube_ca_installed_fp
  changed_when: false
  become: true

- name: Ipa-certs | read published CA fingerprints from IPA (fetch drift gate)
  # Shell exception (no chain/fingerprint module covers this; see AGENTS table).
  # `ipa ca-show` emits PEM only via --certificate-out — plain and --raw stdout
  # print a labelled base64 DER attribute that openssl cannot parse — so the
  # probe exports to a shell-local mktemp scratch (0600, trap-removed on exit)
  # and fingerprints that, using the same proven PEM path as the fetch below.
  # The CLI also prints the entry's attributes to stdout even with
  # --certificate-out: silence it (>/dev/null) so the registered stdout holds
  # ONLY the normalized fingerprint, comparable to the installed side.
  ansible.builtin.shell: |
    set -euo pipefail
    f="$(mktemp --suffix=.crt)"
    trap 'rm -f "$f"' EXIT
    ipa ca-show {{ item }} --certificate-out="$f" >/dev/null
    openssl x509 -in "$f" -noout -fingerprint -sha256 | tr -d ':' | tr '[:upper:]' '[:lower:]' | sed 's/sha256 fingerprint=//'
  loop:
    - "{{ ipa_kubernetes_ca_name }}"
    - "{{ ipa_kubeclusteradm_ca_name }}"
  register: kube_ca_published_fp
  changed_when: false
  no_log: "{{ secure_logs }}"
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  environment:
    KRB5CCNAME: "{{ kube_scratch_cache_dir }}/admin.ca_download.ccache"

- name: Ipa-certs | decide whether the CA fetch shuttle must run
  # A missing installed copy yields '' for that entry (item skipped above),
  # which never equals the published hex digest — absence is drift.
  ansible.builtin.set_fact:
    kube_ca_fetch_needed: "{{ (kube_ca_installed_fp.results | default([]) | map(attribute='stdout', default='') | map('trim') | list) != (kube_ca_published_fp.results | map(attribute='stdout') | map('trim') | list) }}"

- name: Ipa-certs | fetch CA certificates from IPA (gated per-run tempfile shuttle, design D1)
  when: kube_ca_fetch_needed | bool
  block:
    - name: Ipa-certs | mint per-run root-only fetch directory on idm
      # Tempfile is always-changed by nature — acceptable inside this gate:
      # executing the block IS a real transition (missing or drifted CA), and
      # steady state never mints it (zero tempfile tasks on a no-op reconverge).
      # No mode parameter (tempfile has none): mkdtemp creates the directory
      # root-owned 0700 by default.
      ansible.builtin.tempfile:
        state: directory
      register: kube_ca_fetch_tmp
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true

    - name: Ipa-certs | download ca from IPA to the run fetch directory
      # No changed_when override: the block runs only on drift, so the shell's
      # own changed report is truthful.
      ansible.builtin.shell: |
        set -o pipefail && ipa ca-show {{ ipa_kubernetes_ca_name }} --certificate-out={{ kube_ca_fetch_tmp.path }}/ca.crt.new
      no_log: "{{ secure_logs }}"
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      environment:
        KRB5CCNAME: "{{ kube_scratch_cache_dir }}/admin.ca_download.ccache"

    - name: "Ipa-certs | download kubeclusteradm CA (CA #2) from IPA to the run fetch directory"
      ansible.builtin.shell: |
        set -o pipefail && ipa ca-show {{ ipa_kubeclusteradm_ca_name }} --certificate-out={{ kube_ca_fetch_tmp.path }}/ca.crt.kubeclusteradm
      no_log: "{{ secure_logs }}"
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      environment:
        KRB5CCNAME: "{{ kube_scratch_cache_dir }}/admin.ca_download.ccache"

    - name: "Ipa-certs | slurp kubernetes-ca (CA #1) from idm"
      ansible.builtin.slurp:
        src: "{{ kube_ca_fetch_tmp.path }}/ca.crt.new"
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      register: ca_fetch_ca1

    - name: "Ipa-certs | slurp kubeclusteradm CA (CA #2) from idm"
      ansible.builtin.slurp:
        src: "{{ kube_ca_fetch_tmp.path }}/ca.crt.kubeclusteradm"
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      register: ca_fetch_ca2

    - name: "Ipa-certs | install kubernetes-ca (CA #1) from shuttle"
      ansible.builtin.copy:
        content: "{{ ca_fetch_ca1.content | b64decode }}"
        dest: "{{ kubernetes_certificates_path }}ca.crt.new"
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: "Ipa-certs | install kubeclusteradm CA (CA #2) from shuttle"
      ansible.builtin.copy:
        content: "{{ ca_fetch_ca2.content | b64decode }}"
        dest: "{{ kubernetes_certificates_path }}ca.crt.kubeclusteradm"
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: Ipa-certs | remove the run fetch directory on idm
      ansible.builtin.file:
        path: "{{ kube_ca_fetch_tmp.path }}"
        state: absent
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true

- name: Ipa-certs | verify ca.crt.new fingerprint matches expected IPA CA
  ansible.builtin.shell: |
    set -euo pipefail
    openssl x509 -in {{ kubernetes_certificates_path }}ca.crt.new -noout -fingerprint -sha256 2>/dev/null | tr -d ':' | tr '[:upper:]' '[:lower:]' | sed 's/sha256 fingerprint=//'
  become: true
  changed_when: false

# The client CA bundle (ca-bundle.crt) is the merged kubeclusteradm (CA #2) +
# kubernetes-ca (CA #1). CA #2 signs the client certs (front-proxy, kubelet, node,
# admin); CA #1 signs the API server serving cert. The kubeadm CA is no longer part
# of the bundle — it is kept only as ca.crt.kubeadm for --cluster-signing-cert-file
# (CSR-based signing) and the CA #1 serving cert.
- name: "Ipa-certs | read kubeclusteradm CA (CA #2) certificate for bundle"
  ansible.builtin.slurp:
    src: "{{ kubernetes_certificates_path }}ca.crt.kubeclusteradm"
  register: ca_bundle_kubeclusteradm
  become: true

- name: "Ipa-certs | read kubernetes-ca (CA #1) certificate for bundle"
  ansible.builtin.slurp:
    src: "{{ kubernetes_certificates_path }}ca.crt.new"
  register: ca_bundle_ipa
  become: true

- name: Ipa-certs | create merged CA bundle (kubeclusteradm + kubernetes-ca) for client auth
  ansible.builtin.copy:
    content: "{{ ca_bundle_kubeclusteradm.content | b64decode }}{{ ca_bundle_ipa.content | b64decode }}"
    dest: "{{ kubernetes_certificates_path }}ca-bundle.crt"
    owner: root
    mode: '0644'
  become: true

- name: Ipa-certs | replace CA cert with IPA CA
  ansible.builtin.copy:
    src: "{{ kubernetes_certificates_path }}ca.crt.new"
    dest: "{{ kubernetes_certificates_path }}ca.crt"
    remote_src: yes
    mode: '0644'
  become: true

# Must run before the manifest edits below: those change mtime and make kubelet restart the
# KCM/scheduler static pods, which then boot with whatever their kubeconfigs point at. If the
# confs still carry the embedded kubeadm CA (certificate-authority-data), the restarted
# controllers can never verify the IPA-signed API cert and stay broken for the rest of the run.
#
# File references work for controller-manager.conf (its static pod mounts /etc/kubernetes/pki)
# and for kubelet.conf/admin.conf (host-side consumers, file exists on disk). The scheduler's
# static pod does NOT mount /etc/kubernetes/pki — a file reference there crashes the binary at
# boot ("unable to read certificate-authority ... no such file or directory") and it crash-loops
# forever, leaving every unscheduled pod (including CNI DaemonSets) stuck Pending. So the
# scheduler conf gets the IPA CA embedded instead, matching kubeadm's own convention.
- name: Ipa-certs | patch kubeconfigs to use IPA CA cert file reference
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^(\s*)certificate-authority-data:.*'
    replace: '\1certificate-authority: /etc/kubernetes/pki/ca.crt'
  loop:
    - /etc/kubernetes/controller-manager.conf
    - /etc/kubernetes/kubelet.conf
    - /etc/kubernetes/admin.conf
  become: true

- name: Ipa-certs | embed IPA CA in scheduler.conf (static pod lacks pki mount)
  ansible.builtin.replace:
    path: /etc/kubernetes/scheduler.conf
    regexp: '^(\s*)certificate-authority(-data)?:.*'
    replace: '\1certificate-authority-data: {{ ca_bundle_ipa.content }}'
  become: true

- name: Ipa-certs | update API server static pod to use merged CA bundle for client auth
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    regexp: '--client-ca-file=/etc/kubernetes/pki/ca\.crt'
    replace: '--client-ca-file=/etc/kubernetes/pki/ca-bundle.crt'
  become: true

# controller-manager trusts the merged bundle for client CA validation and root-CA
# display; the kubeadm-signed cluster CA is kept as ca.crt.kubeadm only for the
# mid-swap old-cert window (gate anchor below) — its KCM signing flags are emptied
# immediately below and the artifacts are deleted at the end of ipa-pki-swap.yml.
- name: Ipa-certs | update controller-manager client CA to merged bundle
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/kube-controller-manager.yaml
    regexp: '--client-ca-file=/etc/kubernetes/pki/ca\.crt'
    replace: '--client-ca-file=/etc/kubernetes/pki/ca-bundle.crt'
  become: true

- name: Ipa-certs | update controller-manager root CA to merged bundle
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/kube-controller-manager.yaml
    regexp: '--root-ca-file=/etc/kubernetes/pki/ca\.crt'
    replace: '--root-ca-file=/etc/kubernetes/pki/ca-bundle.crt'
  become: true

# Kubeadm self-signed CA retirement (design D5): every certificate in this role is
# minted through IPA ipacert enrollment (no kubelet bootstrap/rotation anywhere),
# so the kubeadm CSR signers have zero consumers. Empty both flag values (empty
# pair ⇒ signers stay disabled; the per-signer flags are unset and fall back to
# them). Also swallows the ca.crt.kubeadm variant written by earlier revisions.
# Once emptied the regex no longer matches, so re-converges are no-ops.
- name: Ipa-certs | disable KCM cluster signing (kubeadm CA retirement)
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/kube-controller-manager.yaml
    regexp: '--cluster-signing-(cert|key)-file=/etc/kubernetes/pki/ca\.(crt|key)(\.kubeadm)?'
    replace: '--cluster-signing-\1-file='
  become: true

- name: Ipa-certs | update scheduler to use merged CA bundle for root CA
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/kube-scheduler.yaml
    regexp: '--root-ca-file=/etc/kubernetes/pki/ca\.crt'
    replace: '--root-ca-file=/etc/kubernetes/pki/ca-bundle.crt'
  become: true

# Old-cert window: the API may legitimately present either the kubeadm-signed serving cert
# (fresh cluster: the IPA-signed one is only created below) or the CA #1-signed one
# (re-converge). The merged bundle no longer contains the kubeadm CA (D4), so anchor the
# gate to a file holding all three CAs — kubeadm CA + ca-bundle (CA #2 + CA #1). The
# kubeadm part is added only while ca.crt.kubeadm exists (fresh converge); after the
# swap retires it, the anchor degrades to bundle-only — which is then the API's only
# possible issuer — and the deletion task in ipa-pki-swap.yml sweeps the anchor file.
- name: Ipa-certs | check for retained kubeadm CA (old-cert window anchor)
  ansible.builtin.stat:
    path: "{{ kubernetes_certificates_path }}ca.crt.kubeadm"
  register: kubeadm_ca_stat
  become: true

- name: Ipa-certs | read retained kubeadm CA for old-cert window gate anchor
  ansible.builtin.slurp:
    src: "{{ kubernetes_certificates_path }}ca.crt.kubeadm"
  register: gate_kubeadm_ca
  become: true
  when: kubeadm_ca_stat.stat.exists

# The anchor is transient by design (ipa-pki-swap.yml sweeps it at the end of a
# successful run, and test_master.py asserts the absence of its prefix), so at
# steady state it must not be rebuilt on every converge: mint and write it only
# when the old-cert window is actually open — the retained kubeadm CA still
# exists, or this run is swapping the API serving certificate. A per-run
# tempfile (kube-api-gate-anchor-XXXXXX.crt) instead of a fixed /tmp name: the
# mint is always-changed, which is truthful only inside this gate, and the
# generated name removes any fixed-path residue/collision between runs. At
# steady state the healthz gate below validates directly against the merged
# bundle, which is then the API's only possible issuer.
- name: Ipa-certs | decide whether the transient gate anchor is needed
  ansible.builtin.set_fact:
    kube_gate_anchor_needed: "{{ kubeadm_ca_stat.stat.exists or (apiserver_swap_needed | default(false) | bool) }}"

- name: Ipa-certs | build gate anchor (retained kubeadm CA + merged bundle) for old-cert window
  when: kube_gate_anchor_needed | bool
  block:
    - name: Ipa-certs | mint gate anchor tempfile for the old-cert window
      ansible.builtin.tempfile:
        state: file
        prefix: kube-api-gate-anchor-
        suffix: .crt
      register: kube_gate_anchor_tmp
      become: true

    - name: Ipa-certs | write gate anchor content (retained kubeadm CA + merged bundle)
      ansible.builtin.copy:
        content: "{{ (gate_kubeadm_ca.content | default('')) | b64decode }}{{ ca_bundle_kubeclusteradm.content | b64decode }}{{ ca_bundle_ipa.content | b64decode }}"
        dest: "{{ kube_gate_anchor_tmp.path }}"
        mode: '0644'
      become: true

- name: Ipa-certs | wait for API server to restart after static pod update (validated)
  ansible.builtin.uri:
    url: "https://{{ orchestration_master_ip }}:{{ orchestration_kube_port }}/healthz"
    ca_path: "{{ kube_gate_anchor_tmp.path if (kube_gate_anchor_tmp is defined and kube_gate_anchor_tmp is not skipped and kube_gate_anchor_tmp.path is defined) else kubernetes_certificates_path + 'ca-bundle.crt' }}"
    status_code: 200
  become: true
  retries: "{{ kubernetes_api_ready_retries }}"
  delay: "{{ kubernetes_api_ready_delay }}"
  register: api_server_ready
  until: api_server_ready.status == 200

- name: Ipa-certs | create IPA service principal for master hostname
  ansible.builtin.include_tasks: ipa-master.yml

# One host ticket for the whole cert-enrollment phase (design D2): minted once
# from the master's own /etc/krb5.keytab into a pre-cleared scratch cache
# (changed_when: false), and inherited via env: KRB5CCNAME by all five cert
# enrollments below (apiserver, front-proxy, kubelet client, controller-manager,
# scheduler). They all request under the same host/<master> identity, so the
# per-file mint/discard cycle was pure overhead; each file keeps only its
# ipacert call and its own when:-gate.
- name: Ipa-certs | mint shared host ticket for the cert-enrollment phase
  ansible.builtin.include_tasks: ../_krb_ticket.yml
  vars:
    krb_ticket_principal: "host/{{ orchestration_host_hostname }}"
    krb_ticket_keytab_path: /etc/krb5.keytab
    krb_ticket_cache_purpose: cert_enroll

# Idempotence gate for the apiserver serving cert: the replacement pipeline below
# (delete kubeadm cert/key/CSR -> re-enroll via ipacert -> touch the static pod
# manifest) always re-issued. Decide from the on-disk serving cert: replay when it
# is missing, not issued by CA #1 (the IPA kubernetes CA), or within the renewal
# threshold. Mirrors the ipa-controller-manager-client.yml idiom.
- name: Ipa-certs | decide whether the apiserver serving cert needs replacement
  ansible.builtin.include_tasks: _cert_swap_decision.yml
  vars:
    cert_swap_cert_path: "{{ kubernetes_certificates_path }}apiserver.crt"
    cert_swap_expected_issuer: "{{ ipa_kubernetes_ca_name }}"
    cert_swap_decision_fact: apiserver_swap_needed

- name: Ipa-certs | remove kubeadm apiserver cert so IPA-signed one is created
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ kubernetes_certificates_path }}apiserver.crt"
    - "{{ kubernetes_certificates_path }}apiserver.key"
    - "{{ kubernetes_certificates_path }}apiserver.csr"
  when: apiserver_swap_needed
  become: true

- name: Ipa-certs | create apiserver cert signed by IPA
  ansible.builtin.include_tasks: ipa-api-server.yml

- name: Ipa-certs | create front-proxy client cert
  ansible.builtin.include_tasks: ipa-front-proxy.yml

- name: Ipa-certs | create kubelet client certs
  ansible.builtin.include_tasks: kube-apiserver-kubelet-client.yml

- name: "Ipa-certs | delegate controller-manager client cert to IPA"
  ansible.builtin.include_tasks: ipa-controller-manager-client.yml

- name: "Ipa-certs | delegate scheduler client cert to IPA"
  ansible.builtin.include_tasks: ipa-scheduler-client.yml

- name: Ipa-certs | Check SA key exists
  ansible.builtin.stat:
    path: "{{ kubernetes_certificates_path }}sa.key"
  register: kube_sa_key_result

- name: Ipa-certs | generate SA key
  community.crypto.openssl_privatekey:
    path: "{{ kubernetes_certificates_path }}sa.key"
    mode: '0600'
    owner: root
    group: root
    type: Ed25519
    size: 256
  when:
   - not kube_sa_key_result.stat.exists
  become: true

- name: Ipa-certs | restart API server to pick up new IPA-signed certificate
  ansible.builtin.file:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    mode: '0600'
    state: touch
  when: apiserver_swap_needed
  become: true

# Anchored to the IPA CA only: a still-stale serving cert must NOT pass — this gate asserts the
# transition completed, i.e. the running server presents the new certificate.
- name: Ipa-certs | wait for API server to restart with new certificate (validated)
  ansible.builtin.uri:
    url: "https://{{ orchestration_master_ip }}:{{ orchestration_kube_port }}/healthz"
    ca_path: "{{ kubernetes_certificates_path }}ca.crt"
    status_code: 200
  become: true
  retries: "{{ kubernetes_api_ready_retries }}"
  delay: "{{ kubernetes_api_ready_delay }}"
  register: result
  until: result.status == 200

# Command exception: community.crypto 3.3.0 has no certificate chain validation
# module (x509_certificate_info parses certificate fields only, it cannot verify
# that apiserver.crt chains to the new CA), so this task stays a shell command.
- name: Ipa-certs | verify API server cert chain is valid
  ansible.builtin.command: |
    openssl verify -CAfile /etc/kubernetes/pki/ca.crt /etc/kubernetes/pki/apiserver.crt
  become: true
  changed_when: false
  register: cert_chain_verify
  retries: 3
  delay: 5
  until: cert_chain_verify.rc == 0

- name: Ipa-certs | verify kubectl can connect to API server (best effort, final check in ipa-pki-swap)
  kubernetes.core.k8s_cluster_info:
    kubeconfig: "{{ kube_config_path }}"
    context: kubernetes-admin@kubernetes
  become: true
  failed_when: false
  register: kubectl_cluster_info
  retries: 3
  delay: "{{ kubernetes_api_ready_delay }}"
  until: (kubectl_cluster_info.version | default({})) | length > 0

- name: Ipa-certs | show API server version from cluster-info check
  ansible.builtin.debug:
    var: "kubectl_cluster_info.version | default({})"
