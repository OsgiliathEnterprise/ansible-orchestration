---

# Steady-state gate: read the on-disk front-proxy client cert's issuer and validity.
# When the cert is present, issued by CA #2 (kubeclusteradm) and outside the renewal
# threshold, the whole enrollment chain below is skipped — otherwise the removal loop
# forced a full re-enrollment (new key + CSR + ipacert re-request) on every converge.
# Replay when the cert is missing, kubeadm-signed (NOT-CA2), or near expiry
# (kube_cert_renewal_threshold_days).
- name: Ipa-front-proxy | read front-proxy client cert issuer and validity for the gate
  ansible.builtin.shell: |
    set -o pipefail
    crt="{{ kubernetes_certificates_path }}front-proxy-client.crt"
    if [ ! -f "$crt" ]; then echo "NOT-CA2"; exit 0; fi
    issuer=$(openssl x509 -in "$crt" -noout -issuer 2>/dev/null || echo MISSING)
    end=$(openssl x509 -in "$crt" -noout -enddate 2>/dev/null | cut -d= -f2)
    if ! openssl x509 -in "$crt" -noout -checkend $(({{ kube_cert_renewal_threshold_days }} * 86400)) >/dev/null 2>&1; then
      echo "EXPIRING $end"
    fi
    echo "$issuer"
  args:
    executable: /bin/bash
  register: fp_cert_issuer
  changed_when: false
  become: true

- name: Ipa-front-proxy | decide whether the front-proxy cert must be re-issued
  ansible.builtin.set_fact:
    fp_swap_needed: "{{ 'NOT-CA2' in fp_cert_issuer.stdout
                        or 'EXPIRING' in fp_cert_issuer.stdout
                        or ipa_kubeclusteradm_ca_name not in fp_cert_issuer.stdout }}"

- name: Ipa-front-proxy | remove kubeadm front-proxy cert so IPA-signed one is created
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ kubernetes_certificates_path }}front-proxy-client.crt"
    - "{{ kubernetes_certificates_path }}front-proxy-client.key"
    - "{{ kubernetes_certificates_path }}front-proxy-client.csr"
  become: true
  when: fp_swap_needed

- name: Ipa-front-proxy | create front-proxy-client private key
  community.crypto.openssl_privatekey:
    path: "{{ kubernetes_certificates_path }}front-proxy-client.key"
  become: true
  when: fp_swap_needed

- name: Ipa-front-proxy | create front-proxy-client csr
  community.crypto.openssl_csr:
    path: "{{ kubernetes_certificates_path }}front-proxy-client.csr"
    privatekey_path: "{{ kubernetes_certificates_path }}front-proxy-client.key"
    country_name: "{{ kube_credential_country_name }}"
    organization_name: "{{ company_domain }}"
    email_address: "{{ kube_credential_email_address }}"
    common_name: "{{ orchestration_host_hostname }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - clientAuth
  become: true
  when: fp_swap_needed

# The master owns this certificate's identity, so it authenticates the request
# with its own host ticket (C3): the shared phase ticket minted once by
# ipa-certs.yml from the master's /etc/krb5.keytab (design D2), inherited via
# env: KRB5CCNAME — no ipaadmin_password on the wire. The CA #2 ACL
# (kubeclusteradm-acl, usercat=all + host grants) authorizes the host principal.
- name: "Ipa-front-proxy | request front-proxy certificate from the kubeclusteradm CA (CA #2)"
  freeipa.ansible_freeipa.ipacert:
    ca: "{{ ipa_kubeclusteradm_ca_name }}"
    principal: "host/{{ orchestration_host_hostname }}"
    csr_file: "{{ kubernetes_certificates_path }}front-proxy-client.csr"
    certificate_out: "{{ kubernetes_certificates_path }}front-proxy-client.crt"
    profile_id: kubeAdministrators
    state: requested
  no_log: "{{ secure_logs }}"
  become: true
  when: fp_swap_needed
  environment:
    KRB5CCNAME: "{{ kube_cert_enroll_ccache }}"
