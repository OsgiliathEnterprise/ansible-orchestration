---
# Join the node with its own per-node IPA identity. The trust anchor (ca.crt) and the
# client certificate come from FreeIPA — not copied off the master — so this no longer
# depends on master post-processing state. It only waits for two readiness signals:
#   1. the API server is reachable and its serving certificate validates against the
#      node's IPA-derived trust anchor (design D2), and
#   2. the kubernetes-ca + kubernetesNodes profile exist in FreeIPA (design D3) — the
#      profile gate runs ahead of the CA fetch, so the anchor is installed before the gate.
# `kubeadm reset` must run after the validated gate (a trust mismatch fails fast before
# any node-local mutation), but it wipes /etc/kubernetes/pki/ — including ca.crt — so
# the anchor is reinstalled from the already-verified fetch immediately afterwards.

- name: Kube-install-join | check if node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  become: true
  register: kube_node_joined

- name: Kube-install-join | join node (skip if already joined)
  when: not kube_node_joined.stat.exists
  block:
    # Phase-attribution anchor for the rescue (design D2): kubelet/crictl captures are
    # windowed with --since so they contain only join-era lines.
    # Shell/command exception (AGENTS.md): node-local wall clock, no native equivalent.
    - name: Kube-install-join | record join start timestamp
      ansible.builtin.command: date -Is
      register: kube_join_started_at
      changed_when: false

    # Scratch admin ticket for the two idm-delegated `ipa` consumers below
    # (profile gate + CA fetch): they get the cache via env: KRB5CCNAME
    # instead of an in-shell `kinit admin` into the shared ambient cache.
    # The shared include pre-clears the cache and mints the ticket
    # (changed_when: false — the scratch cache is ephemeral state); it must
    # mint on idm because KRB5CCNAME resolves on the host running the `ipa`
    # commands, which are themselves delegated to idm.
    - name: Kube-install-join | mint admin ticket for the join gates
      ansible.builtin.include_tasks: _krb_ticket.yml
      vars:
        krb_ticket_principal: admin
        krb_ticket_password: "{{ company_realm_password }}"
        krb_ticket_cache_purpose: node_join
        krb_ticket_delegate_to: "{{ groups[idm_group] | first }}"

    # --- Gate: the CA + per-node profile must exist in FreeIPA before the CA fetch (design D1) ---
    # The CA is created before the profile, so passing this gate guarantees the fetch succeeds.
    # Budget: join-scale (kube_join_profile_ready_*), NOT the generic readiness pair — the
    # producer (tasks/certs/ipa-kubernetes-ca.yml) runs on the master behind kubeadm init,
    # which on a loaded CI runner outlives the 40 x 5 s window (Travis kvm determinism: see
    # openspec/changes/fix-kvm-join-cascade-ci/evidence.md). On timeout this fails into the
    # block rescue, which names the missing signal and its producer (task 2.2).
    - name: Kube-install-join | wait for kubernetesNodes profile to exist in FreeIPA
      ansible.builtin.shell: |
        set -o pipefail && ipa certprofile-find | grep -c ': kubernetesNodes'
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      changed_when: false
      no_log: "{{ secure_logs }}"
      retries: "{{ kube_join_profile_ready_retries }}"
      delay: "{{ kube_join_profile_ready_delay }}"
      register: node_profile_check
      until: node_profile_check.stdout == '1'
      environment:
        KRB5CCNAME: "{{ kube_scratch_cache_dir }}/admin.node_join.ccache"


    # --- Trust anchor from FreeIPA (task 3.1): fetch CA from the IDM host, not master ---
    # Per-run root-only tempdir on the shared idm host: concurrent joins each get
    # their own shuttle, so identical fixed names can never collide or expose a
    # partially written CA. This block only runs when the node has not joined
    # (real transition), so the always-changed tempfile pair is truthful.
    - name: Kube-install-join | mint per-run fetch directory on idm
      # No mode parameter (tempfile has none): mkdtemp creates the directory
      # root-owned 0700 by default.
      ansible.builtin.tempfile:
        state: directory
      register: kube_node_ca_fetch_tmp
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true

    # Bounded retry with content validation: the file must exist, be non-empty, and hold a
    # PEM header before we proceed (the master-side request/export races the fetch).
    # changed_when: false is truthful here: the task is a readiness query strictly
    # read-only against IPA state, writing only into the run-owned ephemeral dir
    # (same class as the scratch ticket caches); the join block itself reports the
    # real transition. no_log is off: stdout carries only public CA material / ipa CLI errors.
    - name: Kube-install-join | fetch CA cert from FreeIPA (delegated to idm)
      ansible.builtin.shell: |
        ipa ca-show kubernetes-ca --certificate-out={{ kube_node_ca_fetch_tmp.path }}/ca.crt || true
        grep -q 'BEGIN CERTIFICATE' {{ kube_node_ca_fetch_tmp.path }}/ca.crt
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      changed_when: false
      register: ca_fetch
      until: ca_fetch.rc == 0
      retries: 5
      delay: 5
      # failed_when: false keeps the exhaustion outcome non-fatal so the NAMED
      # CA_FETCH_TIMEOUT fail task below (not a generic until-retry failure) owns the
      # diagnosis. Until still governs the retry loop.
      failed_when: false
      environment:
        KRB5CCNAME: "{{ kube_scratch_cache_dir }}/admin.node_join.ccache"

    - name: Kube-install-join | fail if kubernetes-ca never validated as PEM
      ansible.builtin.fail:
        msg: >-
          CA_FETCH_TIMEOUT: CA 'kubernetes-ca' never materialised as valid PEM at
          {{ kube_node_ca_fetch_tmp.path }}/ca.crt on {{ groups[idm_group] | first }} (5 x 5 s exhausted).
          Last ipa output: {{ ca_fetch.stdout | default('') | truncate(400) }}
          {{ ca_fetch.stderr | default('') | truncate(400) }}
          Upstream dependencies: master certificate provisioning (tasks/certs/ipa-certs.yml)
          and idm CA availability.
      when: ca_fetch.rc != 0

    - name: Kube-install-join | slurp CA cert from idm
      ansible.builtin.slurp:
        src: "{{ kube_node_ca_fetch_tmp.path }}/ca.crt"
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      register: kube_ca_crt

    # The kubelet's x509 client authentication validates the API server's
    # apiserver-kubelet-client certificate, which the IPA PKI swap re-issues under
    # CA #2 (kubeclusteradm). Without this second anchor, kubectl exec/logs/port-forward
    # are proxied to the kubelet and rejected with 401 Unauthorized.
    - name: Kube-install-join | fetch kubeclusteradm CA cert from FreeIPA (delegated to idm)
      ansible.builtin.shell: |
        ipa ca-show {{ ipa_kubeclusteradm_ca_name }} --certificate-out={{ kube_node_ca_fetch_tmp.path }}/ca-clusteradm.crt || true
        grep -q 'BEGIN CERTIFICATE' {{ kube_node_ca_fetch_tmp.path }}/ca-clusteradm.crt
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      changed_when: false
      register: ca_clusteradm_fetch
      until: ca_clusteradm_fetch.rc == 0
      retries: 5
      delay: 5
      # failed_when: false — see the kubernetes-ca fetch above: the named
      # CA_FETCH_TIMEOUT fail task owns the diagnosis.
      failed_when: false
      environment:
        KRB5CCNAME: "{{ kube_scratch_cache_dir }}/admin.node_join.ccache"

    - name: Kube-install-join | fail if kubeclusteradm CA never validated as PEM
      ansible.builtin.fail:
        msg: >-
          CA_FETCH_TIMEOUT: CA '{{ ipa_kubeclusteradm_ca_name }}' never materialised as valid PEM at
          {{ kube_node_ca_fetch_tmp.path }}/ca-clusteradm.crt on {{ groups[idm_group] | first }} (5 x 5 s exhausted).
          Last ipa output: {{ ca_clusteradm_fetch.stdout | default('') | truncate(400) }}
          {{ ca_clusteradm_fetch.stderr | default('') | truncate(400) }}
          Upstream dependencies: master certificate provisioning (tasks/certs/ipa-certs.yml)
          and idm CA availability.
      when: ca_clusteradm_fetch.rc != 0

    - name: Kube-install-join | slurp kubeclusteradm CA cert from idm
      ansible.builtin.slurp:
        src: "{{ kube_node_ca_fetch_tmp.path }}/ca-clusteradm.crt"
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      register: kube_ca_clusteradm_crt

    # Both fetches are consumed by the slurps above; the run-owned shuttle leaves
    # no residue on the shared idm host.
    - name: Kube-install-join | remove the run fetch directory from idm
      ansible.builtin.file:
        path: "{{ kube_node_ca_fetch_tmp.path }}"
        state: absent
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true

    - name: Kube-install-join | create pki directory on node
      ansible.builtin.file:
        path: /etc/kubernetes/pki
        state: directory
        mode: '0755'
      become: true

    - name: Kube-install-join | install CA cert on node
      ansible.builtin.copy:
        content: "{{ kube_ca_crt.content | b64decode }}"
        dest: /etc/kubernetes/pki/ca.crt
        mode: '0644'
      become: true

    - name: Kube-install-join | install merged CA bundle on node
      ansible.builtin.copy:
        content: "{{ (kube_ca_clusteradm_crt.content | b64decode) + (kube_ca_crt.content | b64decode) }}"
        dest: /etc/kubernetes/pki/ca-bundle.crt
        mode: '0644'
      become: true

    # --- Gate: verify installed CA content matches the fresh fetch (task 3.2) ---
    # A stale anchor from a previous run must not pass the API readiness check with an old trust anchor.
    # Per-run tempfile (not a fixed /tmp name): this block only runs on a real join, so the
    # always-changed pair is truthful and the comparison file leaves no residue.
    - name: Kube-install-join | mint temp file for the expected CA comparison
      ansible.builtin.tempfile:
        state: file
        suffix: .crt
      register: kube_node_ca_expected_tmp
      become: true

    - name: Kube-install-join | write expected CA to temp file for comparison
      ansible.builtin.copy:
        content: "{{ kube_ca_crt.content | b64decode }}"
        dest: "{{ kube_node_ca_expected_tmp.path }}"
        mode: '0644'
      become: true

    - name: Kube-install-join | wait for CA cert content to match fresh fetch
      # The loop re-reads the INSTALLED file each pass (a concurrent remap is the
      # race it guards); the comparison target is the run-owned temp file above.
      ansible.builtin.shell: |
        set -o pipefail
        diff -q /etc/kubernetes/pki/ca.crt {{ kube_node_ca_expected_tmp.path }} > /dev/null && echo "MATCH" || echo "MISMATCH"
      become: true
      changed_when: false
      retries: "{{ orchestration_readiness_retries }}"
      delay: "{{ orchestration_readiness_delay }}"
      register: ca_content_check
      until: ca_content_check.stdout == 'MATCH'

    - name: Kube-install-join | remove temp CA comparison file
      ansible.builtin.file:
        path: "{{ kube_node_ca_expected_tmp.path }}"
        state: absent
      become: true

    # --- Gate: API server must be reachable and its serving certificate must validate
    #     against the node's own trust anchor (design D2) ---
    - name: Kube-install-join | wait for API server readiness (validated)
      ansible.builtin.uri:
        url: "https://{{ orchestration_master_ip }}:{{ orchestration_kube_port }}/healthz"
        ca_path: /etc/kubernetes/pki/ca.crt
        status_code: 200
      become: true
      retries: "{{ orchestration_readiness_retries }}"
      delay: "{{ orchestration_readiness_delay }}"
      register: api_server_ready
      # uri's `until` only retries when status == 200; on TLS verification failure (stale CA, cert not yet swapped) the module returns null for status and fails immediately without retrying — this guard makes the gate wait for both reachability AND trust.
      until: api_server_ready is not skipped and api_server_ready.status | default(0) == 200

    - name: Kube-install-join | remove kubeadm drop-in so kubelet won't try bootstrap on restart
      ansible.builtin.file:
        path: /usr/lib/systemd/system/kubelet.service.d/10-kubeadm.conf
        state: absent
      become: true
      failed_when: false

    - name: Kube-install-join | remove stale bootstrap drop-in if present
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d/20-bootstrap.conf
        state: absent
      become: true

    - name: Kube-install-join | ensure drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        mode: '0755'
      become: true

    - name: Kube-install-join | create our own kubelet drop-in
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/kubelet --kubeconfig=/etc/kubernetes/kubelet.conf --config=/var/lib/kubelet/config.yaml --cgroup-driver=systemd
        dest: /etc/systemd/system/kubelet.service.d/20-orchestration.conf
        mode: '0644'
      become: true

    - name: Kube-install-join | reload systemd with new drop-in
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: Kube-install-join | stop kubelet (won't restart with old args now)
      ansible.builtin.systemd:
        name: kubelet
        state: stopped
        enabled: false
        force: true
      become: true
      changed_when: false

    - name: Kube-install-join | kill any remaining kubelet processes
      ansible.builtin.shell: |
        pkill -9 kubelet 2>/dev/null || true
        sleep 1
        pgrep kubelet || echo "kubelet stopped"
      become: true
      changed_when: false

    - name: Kube-install-join | reset kubeadm state from failed join attempt
      ansible.builtin.shell: |
        kubeadm reset -f 2>/dev/null || true
      become: true
      changed_when: false

    # `kubeadm reset` wipes /etc/kubernetes/pki/ (including ca.crt), so the trust anchor
    # must be reinstalled before kubelet starts — otherwise it crash-loops on a missing
    # certificate-authority. The content is the same already-verified fresh fetch, so no
    # re-comparison gate is needed.
    - name: Kube-install-join | recreate pki directory wiped by kubeadm reset
      ansible.builtin.file:
        path: /etc/kubernetes/pki
        state: directory
        mode: '0755'
      become: true

    - name: Kube-install-join | reinstall CA cert wiped by kubeadm reset
      ansible.builtin.copy:
        content: "{{ kube_ca_crt.content | b64decode }}"
        dest: /etc/kubernetes/pki/ca.crt
        mode: '0644'
      become: true

    - name: Kube-install-join | reinstall merged CA bundle wiped by kubeadm reset
      ansible.builtin.copy:
        content: "{{ (kube_ca_clusteradm_crt.content | b64decode) + (kube_ca_crt.content | b64decode) }}"
        dest: /etc/kubernetes/pki/ca-bundle.crt
        mode: '0644'
      become: true

    - name: Kube-install-join | remove stale kubelet artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/kubernetes/kubelet.conf
        - /etc/kubernetes/bootstrap-kubelet.conf
        - /var/lib/kubelet/pki

    # --- Per-node client certificate (task 2.1): this node's own identity ---
    - name: Kube-install-join | request this node's own client cert from FreeIPA
      ansible.builtin.include_tasks: certs/kube-node-cert.yml

    # --- Construct per-node kubelet.conf (task 4.1): own cert/key + IPA CA + API URL ---
    - name: Kube-install-join | create per-node kubelet.conf
      ansible.builtin.copy:
        content: |
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              certificate-authority: /etc/kubernetes/pki/ca.crt
              server: https://{{ orchestration_master_ip }}:{{ orchestration_kube_port }}
            name: default-cluster
          contexts:
          - context:
              cluster: default-cluster
              user: default-user
            name: default-context
          current-context: default-context
          users:
          - name: default-user
            user:
              client-certificate: /etc/kubernetes/pki/node-client.crt
              client-key: /etc/kubernetes/pki/node-client.key
        dest: /etc/kubernetes/kubelet.conf
        mode: '0640'
      become: true

    - name: Kube-install-join | create minimal kubelet config
      ansible.builtin.copy:
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          authentication:
            anonymous:
              enabled: false
            webhook:
              enabled: true
            x509:
              clientCAFile: /etc/kubernetes/pki/ca-bundle.crt
          authorization:
            mode: Webhook
          cgroupDriver: systemd
          clusterDNS:
            - {{ orchestration_kube_dns_ip }}
          clusterDomain: cluster.local
        dest: /var/lib/kubelet/config.yaml
        mode: '0644'
      become: true

    - name: Kube-install-join | start kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: started
        enabled: true
        daemon_reload: true
      become: true

    - name: Kube-install-join | wait for node to appear in cluster
      # Per-node identity via kubelet.conf (no admin.conf dependency); the python client is already
      # installed on nodes by prereq.yml. k8s_info is read-only, so no changed_when needed.
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        name: "{{ inventory_hostname }}"
        kubeconfig: /etc/kubernetes/kubelet.conf
      become: true
      retries: "{{ orchestration_readiness_retries }}"
      delay: "{{ orchestration_readiness_delay }}"
      register: node_check
      until: node_check.resources | length > 0

  rescue:
    # Phase-aware diagnostics (design D2): every capture below is failed_when: false so the
    # original error is never masked. Shell exceptions (AGENTS.md): journalctl, crictl and
    # ipa-getcert have no native Ansible equivalents; all captures are read-only.
    - name: Kube-install-join | capture kubelet logs since join start
      ansible.builtin.shell: |
        journalctl -u kubelet --no-pager --since "{{ kube_join_started_at.stdout | default('') }}" -n 300
      become: true
      changed_when: false
      failed_when: false
      register: kubelet_logs

    - name: Kube-install-join | capture container runtime state
      ansible.builtin.shell: |
        # `crictl pods` has no -a flag (unlike `crictl ps -a`): it already lists pods in
        # every state (verified in the Phase-A negative test, where -a only printed usage).
        crictl pods
        crictl ps -a
      become: true
      changed_when: false
      failed_when: false
      register: crictl_state

    - name: Kube-install-join | capture ipa-getcert request list
      ansible.builtin.command: ipa-getcert list
      become: true
      changed_when: false
      failed_when: false
      register: getcert_list

    - name: Kube-install-join | capture join cert/key material presence
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/kubernetes/kubelet.conf
        - /etc/kubernetes/pki/ca.crt
        - /etc/kubernetes/pki/ca-bundle.crt
        - /etc/kubernetes/pki/node-client.crt
        - /etc/krb5.keytab
      become: true
      register: join_artifact_state
      failed_when: false

    # Upstream evidence (task 2.2): the node is only a waiter — when the failed task is one
    # of the upstream gates (profile / CA / API), capture the idm profile inventory so the
    # diagnosis names the missing signal instead of blaming a kubelet that never started.
    - name: Kube-install-join | capture certprofile inventory from idm
      ansible.builtin.command: ipa certprofile-find
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      changed_when: false
      failed_when: false
      when: >-
        ('profile' in (ansible_failed_task.name | default('') | lower)) or
        ('ca' in (ansible_failed_task.name | default('') | lower)) or
        ('api server' in (ansible_failed_task.name | default('') | lower))
      register: profile_inventory_diag
      environment:
        KRB5CCNAME: "{{ kube_scratch_cache_dir }}/admin.node_join.ccache"

    - name: Kube-install-join | print join diagnostics
      ansible.builtin.debug:
        msg:
          - "failed_task={{ ansible_failed_task.name | default('unknown') }}"
          - "join_started={{ kube_join_started_at.stdout | default('unknown') }}"
          - "original_failure={{ ansible_failed_result.msg | default(ansible_failed_result | default('unknown') | string | truncate(500)) }}"
          - "certprofile_find={{ profile_inventory_diag.stdout_lines | default(['<not captured: non-upstream gate or capture failed>']) }}"
          - "crictl={{ crictl_state.stdout_lines | default(['<capture failed>']) }}"
          - "ipa_getcert={{ getcert_list.stdout_lines | default(['<capture failed>']) }}"
          - "artifacts(exist)={{ join_artifact_state.results | default([]) | map(attribute='stat.exists') | list }} (order: kubelet.conf, ca.crt, ca-bundle.crt, node-client.crt, krb5.keytab)"
          - "kubelet_log(tail)={{ kubelet_logs.stdout_lines | default(['<capture failed>']) }}"

    - name: Kube-install-join | fail with named join diagnosis
      ansible.builtin.fail:
        msg: >-
          Node join failed in task '{{ ansible_failed_task.name | default('unknown') }}'
          (join started {{ kube_join_started_at.stdout | default('unknown') }}).
          Upstream dependencies for profile/CA/API gate failures: master-side certificate
          provisioning — tasks/certs/ipa-certs.yml, with the 'kubernetesNodes' profile
          created in tasks/certs/ipa-kubernetes-ca.yml — and idm CA availability: a
          profile-gate timeout means the master had not reached profile creation yet, not
          a node fault. certprofile-find (rc={{ profile_inventory_diag.rc | default('n/a') }}):
          {{ profile_inventory_diag.stdout | default('<not captured: non-upstream gate or capture failed>') | truncate(600) }}.
          Original failure: {{ ansible_failed_result.msg | default('unknown') }}
