---
# Join the node with its own per-node IPA identity. The trust anchor (ca.crt) and the
# client certificate come from FreeIPA — not copied off the master — so this no longer
# depends on master post-processing state. It only waits for two readiness signals:
#   1. the API server is reachable (/healthz == 200), and
#   2. the kubernetes-ca + kubernetesNodes profile exist in FreeIPA (design D2/D3).

- name: Kube-install-join | check if node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  become: true
  register: kube_node_joined

- name: Kube-install-join | join node (skip if already joined)
  when: not kube_node_joined.stat.exists
  block:
    # --- Gate: API server must be reachable before we join (design D3) ---
    - name: Kube-install-join | wait for API server readiness
      ansible.builtin.uri:
        url: "https://{{ orchestration_master_ip }}:6443/healthz"
        validate_certs: no
        status_code: 200
      become: true
      retries: 40
      delay: 5
      register: api_server_ready
      until: api_server_ready.status == 200

    - name: Kube-install-join | remove kubeadm drop-in so kubelet won't try bootstrap on restart
      ansible.builtin.file:
        path: /usr/lib/systemd/system/kubelet.service.d/10-kubeadm.conf
        state: absent
      become: true
      failed_when: false

    - name: Kube-install-join | remove stale bootstrap drop-in if present
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d/20-bootstrap.conf
        state: absent
      become: true

    - name: Kube-install-join | ensure drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        mode: '0755'
      become: true

    - name: Kube-install-join | create our own kubelet drop-in
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/kubelet --kubeconfig=/etc/kubernetes/kubelet.conf --config=/var/lib/kubelet/config.yaml --cgroup-driver=systemd
        dest: /etc/systemd/system/kubelet.service.d/20-orchestration.conf
        mode: '0644'
      become: true

    - name: Kube-install-join | reload systemd with new drop-in
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: Kube-install-join | stop kubelet (won't restart with old args now)
      ansible.builtin.systemd:
        name: kubelet
        state: stopped
        enabled: false
        force: true
      become: true
      changed_when: false

    - name: Kube-install-join | kill any remaining kubelet processes
      ansible.builtin.shell: |
        pkill -9 kubelet 2>/dev/null || true
        sleep 1
        pgrep kubelet || echo "kubelet stopped"
      become: true
      changed_when: false

    - name: Kube-install-join | reset kubeadm state from failed join attempt
      ansible.builtin.shell: |
        kubeadm reset -f 2>/dev/null || true
      become: true
      changed_when: false

    - name: Kube-install-join | remove stale kubelet artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/kubernetes/kubelet.conf
        - /etc/kubernetes/bootstrap-kubelet.conf
        - /var/lib/kubelet/pki

    - name: Kube-install-join | create pki directory on node
      ansible.builtin.file:
        path: /etc/kubernetes/pki
        state: directory
        mode: '0755'
      become: true

    # --- Gate: the CA + per-node profile must exist in FreeIPA before we request (design D3) ---
    - name: Kube-install-join | wait for kubernetesNodes profile to exist in FreeIPA
      ansible.builtin.shell: |
        set -o pipefail && echo '{{ company_realm_password }}' | kinit admin > /dev/null
        ipa certprofile-find | grep -c ': kubernetesNodes'
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      changed_when: false
      no_log: "{{ secure_logs }}"
      retries: 20
      delay: 5
      register: node_profile_check
      until: node_profile_check.stdout == '1'

    # --- Trust anchor from FreeIPA (task 3.1): fetch CA from the IDM host, not master ---
    - name: Kube-install-join | fetch CA cert from FreeIPA (delegated to idm)
      ansible.builtin.shell: |
        set -o pipefail && echo '{{ company_realm_password }}' | kinit admin > /dev/null
        ipa ca-show kubernetes-ca --certificate-out=/tmp/kube-node-ca.crt
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      changed_when: false
      no_log: "{{ secure_logs }}"

    - name: Kube-install-join | slurp CA cert from idm
      ansible.builtin.slurp:
        src: /tmp/kube-node-ca.crt
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      register: kube_ca_crt

    - name: Kube-install-join | install CA cert on node
      ansible.builtin.copy:
        content: "{{ kube_ca_crt.content | b64decode }}"
        dest: /etc/kubernetes/pki/ca.crt
        mode: '0644'
      become: true

    # --- Per-node client certificate (task 2.1): this node's own identity ---
    - name: Kube-install-join | request this node's own client cert from FreeIPA
      ansible.builtin.include_tasks: kube-node-cert.yml

    # --- Construct per-node kubelet.conf (task 4.1): own cert/key + IPA CA + API URL ---
    - name: Kube-install-join | create per-node kubelet.conf
      ansible.builtin.copy:
        content: |
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              certificate-authority: /etc/kubernetes/pki/ca.crt
              server: https://{{ orchestration_master_ip }}:6443
            name: default-cluster
          contexts:
          - context:
              cluster: default-cluster
              user: default-user
            name: default-context
          current-context: default-context
          users:
          - name: default-user
            user:
              client-certificate: /etc/kubernetes/pki/node-client.crt
              client-key: /etc/kubernetes/pki/node-client.key
        dest: /etc/kubernetes/kubelet.conf
        mode: '0640'
      become: true

    - name: Kube-install-join | create minimal kubelet config
      ansible.builtin.copy:
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          cgroupDriver: systemd
          clusterDNS:
            - {{ orchestration_kube_dns_ip }}
          clusterDomain: cluster.local
        dest: /var/lib/kubelet/config.yaml
        mode: '0644'
      become: true

    - name: Kube-install-join | start kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: started
        enabled: true
        daemon_reload: true
      become: true

    - name: Kube-install-join | wait for node to appear in cluster
      ansible.builtin.shell: |
        kubectl get node {{ inventory_hostname }} --kubeconfig /etc/kubernetes/kubelet.conf
      become: true
      retries: 40
      delay: 5
      register: node_check
      until: node_check.rc == 0
      changed_when: false

  rescue:
    - name: Kube-install-join | capture kubelet logs for debugging
      ansible.builtin.shell: |
        journalctl -u kubelet --no-pager -n 2000
      become: true
      changed_when: false
      register: kubelet_logs

    - name: Kube-install-join | show kubelet logs
      ansible.builtin.debug:
        var: kubelet_logs.stdout_lines

    - name: Kube-install-join | fail if join failed
      ansible.builtin.fail:
        msg: "Node join failed - kubelet not active. Check kubelet logs above."
