---

# Data-plane recovery after the IPA PKI swap.
# The swap replaces /etc/kubernetes/pki/ca.crt and restarts control-plane static pods, but
# pre-existing Calico/Tigera workloads keep their stale in-cluster ca.crt (kubelet materializes
# that file at pod-creation time). A rolling restart of the calico-node DaemonSet replaces each
# node's pod so kubelet re-materialises the post-swap CA and CNI initialises, bringing worker
# nodes back to Ready. Runs on the master (inherited from ipa-pki-swap.yml); no-op when Calico is
# not installed. Deliberately avoids recreating the operator: that forces an image re-pull (fragile
# on flaky registry access) and destabilises a healthy control plane.

- name: Calico-ca-recovery | detect calico-node DaemonSet (no-op if Calico absent)
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    namespace: calico-system
    name: calico-node
    kubeconfig: "{{ kube_config_path }}"
    context: kubernetes-admin@kubernetes
  become: true
  register: calico_node_ds

- name: Calico-ca-recovery | read current post-swap CA for fingerprint
  ansible.builtin.slurp:
    src: /etc/kubernetes/pki/ca.crt
  become: true
  register: ca_pem
  when: calico_node_ds.resources | length > 0

- name: Calico-ca-recovery | set CA fingerprint fact (restart trigger value)
  ansible.builtin.set_fact:
    # Full digest (Jinja has no slice syntax); stability per CA content is what matters for the trigger.
    calico_ca_fingerprint: "{{ ca_pem.content | b64decode | hash('sha256') }}"
  when: calico_node_ds.resources | length > 0

- name: Calico-ca-recovery | rolling restart calico-node to re-materialise post-swap CA
  # Rolling (not mass-delete) so each node's CNI stays up while its pod is replaced one at a time.
  # The restartedAt annotation value is the current CA fingerprint, so this fires only when the CA
  # actually changed: re-converge with an unchanged CA is a no-op (no workload churn).
  block:
    - name: Calico-ca-recovery | patch calico-node template annotation to trigger rolling restart
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: DaemonSet
        namespace: calico-system
        name: calico-node
        kubeconfig: "{{ kube_config_path }}"
        context: kubernetes-admin@kubernetes
        state: present
        wait: true
        wait_timeout: "{{ kubernetes_rollout_wait_timeout }}"
        resource_definition:
          spec:
            template:
              metadata:
                annotations:
                  restartedAt: "ca-{{ calico_ca_fingerprint }}"
      become: true

  rescue:
    - name: Calico-ca-recovery | collect ready calico-node pods for failure report
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: calico-system
        kubeconfig: "{{ kube_config_path }}"
        context: kubernetes-admin@kubernetes
      become: true
      register: calico_pods

    - name: Calico-ca-recovery | collect cluster nodes for failure report
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        kubeconfig: "{{ kube_config_path }}"
        context: kubernetes-admin@kubernetes
      become: true
      register: cluster_nodes

    - name: Calico-ca-recovery | fail naming nodes without a ready calico-node pod
      ansible.builtin.fail:
        msg: >-
          calico-node rollout did not complete within {{ kubernetes_rollout_wait_timeout }}s;
          nodes without a Ready calico-node pod:
          {{ ((cluster_nodes.resources | map(attribute='metadata.name') | list)
             - (calico_pods.resources | selectattr('status.ready', 'equalto', true)
                | selectattr('spec.nodeName', 'defined')
                | map(attribute='spec.nodeName') | list)) or ['<all nodes covered; check calico-node pod status>'] }}
