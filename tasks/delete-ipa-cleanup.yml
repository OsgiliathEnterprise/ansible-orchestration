---
- name: Delete-ipa-cleanup | Check admin cert existence
  ansible.builtin.stat:
    path: "{{ kube_credential_folder }}/kubeadm.crt"
  register: _cleanup_admin_cert_stat
  become: true

- name: Delete-ipa-cleanup | Extract serial number from admin cert
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -in "{{ kube_credential_folder }}/kubeadm.crt" -serial -noout | cut -d= -f2
  register: _cleanup_admin_cert_serial
  changed_when: false
  when: _cleanup_admin_cert_stat.stat.exists
  become: true

- name: Delete-ipa-cleanup | Revoke admin certificate from IPA using serial number
  freeipa.ansible_freeipa.ipacert:
    ipaadmin_password: "{{ company_realm_password }}"
    ca: kubernetes-ca
    serial_number: "{{ _cleanup_admin_cert_serial.stdout }}"
    state: revoked
    reason: 4
  failed_when: false
  when: _cleanup_admin_cert_stat.stat.exists and _cleanup_admin_cert_serial is defined
  become: true
  no_log: "{{ secure_logs }}"

