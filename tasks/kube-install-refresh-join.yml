---
# Refresh the join command with the current CA hash from the ConfigMap.
# This ensures the join command uses the correct CA hash at join time,
# accounting for any ConfigMap changes by the API server.

- name: Kube-install-refresh-join | fetch cluster-info ConfigMap from API server
  ansible.builtin.uri:
    url: https://localhost:6443/api/v1/namespaces/kube-public/configmaps/cluster-info
    validate_certs: false
    return_content: true
  become: true
  delegate_to: "{{ groups[kube_masters_group] | first }}"
  register: cluster_info_cm
  retries: 5
  delay: 10
  until: cluster_info_cm.status == 200

- name: Kube-install-refresh-join | extract kubeconfig from ConfigMap response
  ansible.builtin.set_fact:
    _kube_join_kubeconfig: "{{ cluster_info_cm.json.data.kubeconfig }}"

- name: Kube-install-refresh-join | extract certificate-authority-data from kubeconfig
  ansible.builtin.set_fact:
    _kube_join_ca_b64: >-
      {{ cluster_info_cm.json.data.kubeconfig
        | regex_search('certificate-authority-data:\\s*([A-Za-z0-9+/=]+)', '\\1')
        | first
        | trim }}

- name: Kube-install-refresh-join | decode CA PEM and write to temp file
  ansible.builtin.copy:
    content: "{{ _kube_join_ca_b64 | b64decode }}"
    dest: "/tmp/current-cm-ca.crt"
    mode: "0600"
  become: true
  delegate_to: "{{ groups[kube_masters_group] | first }}"

- name: Kube-install-refresh-join | compute CA DER SHA256 hash from ConfigMap
  ansible.builtin.shell: |
    set -euo pipefail
    openssl x509 -in /tmp/current-cm-ca.crt -outform DER 2>/dev/null \
      | openssl dgst -sha256 | awk '{print $NF}'
  become: true
  delegate_to: "{{ groups[kube_masters_group] | first }}"
  register: current_ca_hash_on_master
  changed_when: false

- name: Kube-install-refresh-join | clean up temporary CA file
  ansible.builtin.file:
    path: /tmp/current-cm-ca.crt
    state: absent
  become: true
  delegate_to: "{{ groups[kube_masters_group] | first }}"

- name: Kube-install-refresh-join | slurp IPA CA from master for direct hash
  ansible.builtin.slurp:
    src: "{{ kubernetes_certificates_path }}ca.crt"
  become: true
  delegate_to: "{{ groups[kube_masters_group] | first }}"
  register: ipa_ca_raw_refresh

- name: Kube-install-refresh-join | compute IPA CA DER hash directly
  ansible.builtin.shell: |
    set -euo pipefail
    echo "{{ ipa_ca_raw_refresh.content }}" | base64 -d | openssl x509 -outform DER 2>/dev/null | openssl dgst -sha256 | awk '{print $NF}'
  become: true
  changed_when: false
  delegate_to: "{{ groups[kube_masters_group] | first }}"
  register: ipa_ca_der_hash_refresh

- name: Kube-install-refresh-join | extract join token and API server address from existing join command
  ansible.builtin.set_fact:
    kube_join_token_refreshed: "{{ kubernetes_join_command | regex_search('--token (\\S+)', '\\1') | first }}"
    kube_api_server_addr_refreshed: "{{ kubernetes_join_command | regex_search('join (\\S+)', '\\1') | first }}"

- name: Kube-install-refresh-join | reconstruct join command with IPA CA DER hash
  ansible.builtin.set_fact:
    kubernetes_join_command: >
      kubeadm join {{ kube_api_server_addr_refreshed }} --token {{ kube_join_token_refreshed }} --discovery-token-ca-cert-hash sha256:{{ ipa_ca_der_hash_refresh.stdout | trim | lower }}
