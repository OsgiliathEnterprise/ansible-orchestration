---
# Create the kubeclusteradm IPA user and give it a usable Kerberos key, then verify
# that it can authenticate.
#
# Design (validated on FreeIPA 4.13.4):
#  - The user is created WITHOUT a password. An API-set password is stored with
#    krbPasswordExpiration equal to the set time (immediately expired), and the
#    only KDC-side fix (self-service changepw) is rejected within the KDC's
#    min-password-age window right after creation ("Too soon") — so a fresh
#    account can never activate itself.
#  - The key is set with `kadmin.local cpw` on the IPA server (root, local
#    KDB): no KDC changepw policy, no min-age rejection, and no expiry
#    attribute stored — the KDC computes the expiry as last-change + maxpwage
#    (90 days), in the future, so kinit succeeds immediately.
#
# Steady-state credential is the keytab, not the password:
#  - ipa-cert-renewal.yml (later in the converge) exports the renewal keytab
#    with `kadmin.local ktadd -norandkey` on the IPA master: a NON-rotating
#    write of the current KDB key (the native ipa_getkeytab module has no
#    non-rotating mode on FreeIPA 4.13 — see design D3 amendment).
#    The managed password therefore stays a live recovery path across keytab
#    regeneration, and the keytab tracks the KDB (an external key change is
#    picked up by the next regeneration).
#  - The probes therefore try the keytab first (delegated to idm, where
#    /tmp/kubeclusteradm.keytab lives) and fall back to the password only for
#    the fresh-install path (no keytab yet, before ipa-cert-renewal.yml runs).
#    cpw runs only when BOTH probes are unusable, and a `failed_when` on the
#    KDC min-age window ("Too soon") turns its silent rc=0 false success into a
#    hard failure (no longer triggered by keytab export — see above — only by
#    an external rotation landing right before the converge).
#  - Idempotency: on the second converge the keytab probe succeeds, cpw is
#    skipped (no "Too soon" exposure), verification uses the keytab, and the
#    keytab task (gated on usability) does not regenerate — the converge makes
#    no credential mutation.
#
# Ticketing model: every probe/verification ticket below is a community.general
# .krb_ticket acquisition into a per-purpose scratch cache under /tmp, always
# preceded by a pre-clear (the module's own idempotence check runs `klist`
# without -c, so it cannot see a scratch cache — pre-clearing makes "fresh"
# structural) and reporting changed_when: false (a ticket cache is ephemeral
# state, not configuration). No task reads or writes the ambient cache.
#
# Ordering: this file runs before admin-user.yml (CSR + ipacert enrollment),
# so the user must exist here before the CSR is submitted (the enrollment
# resolves the principal from the CSR's CN).

- name: Ipa-kube-admin-credential | ensure the kubeclusteradm IPA user exists (without a password)
  # `name` (login) is the identifier parameter; a top-level `principal` is only an
  # attribute filter and does not satisfy the module's "one of name or users"
  # requirement. No password here: an API-set password would be stored as
  # immediately expired (see header); the key is set via kadmin.local below.
  # `update_password: on_create` is a no-op without a password parameter but keeps
  # the module from comparing `userpassword` against the (absent) attribute on
  # re-converge.
  freeipa.ansible_freeipa.ipauser:
    ipaadmin_password: "{{ company_realm_password }}"
    name: "{{ ipa_kube_admin_principal }}"
    update_password: on_create
    # FreeIPA rejects user creation without a full name ("First name is needed")
    first: "Kubernetes"
    last: "ClusterAdmin"
    # Contact address for the managed account; ipacert enrollment does not
    # require it (the CSR's DN carries no email, and the kubeAdministrators
    # profile builds the issued cert DN from the CSR's CN only).
    email: "{{ ipa_kube_admin_email }}"
    state: present
  no_log: "{{ secure_logs }}"

- name: Ipa-kube-admin-credential | probe kubeclusteradm keytab usability
  # Keytab first: the steady-state credential (see header) — the file lives on
  # idm (root-only), hence delegation + become. A usable keytab mints a fresh
  # ticket and the block completes; a rotated key fails at the KDC and the
  # rescue records the keytab as unusable. `principal` is required: keytab-only
  # kinit requests the machine's default (host) principal, which is never
  # present in this user keytab ("Keytab contains no suitable keys", VM-
  # verified 2026-10-30).
  block:
    - name: Ipa-kube-admin-credential | pre-clear keytab-probe scratch cache
      ansible.builtin.file:
        path: /tmp/.kca_keytab_probe.ccache
        state: absent
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true

    - name: Ipa-kube-admin-credential | mint keytab ticket into scratch cache
      community.general.krb_ticket:
        keytab: true
        keytab_path: /tmp/kubeclusteradm.keytab
        principal: "{{ ipa_kube_admin_principal }}"
        cache_name: /tmp/.kca_keytab_probe.ccache
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      changed_when: false
  rescue:
    - name: Ipa-kube-admin-credential | record keytab unusable
      ansible.builtin.set_fact:
        kca_keytab_usable: false

- name: Ipa-kube-admin-credential | record keytab usable
  ansible.builtin.set_fact:
    kca_keytab_usable: true
  when: kca_keytab_usable is not defined

- name: Ipa-kube-admin-credential | probe kubeclusteradm Vault-password usability
  # Password fallback probe: the fresh-install path has no keytab yet (the user
  # is created without a password; the keytab is generated later by
  # ipa-cert-renewal.yml), and a stale keytab must not blindly trigger a key
  # reset when the managed password is still valid. Authenticates as
  # kubeclusteradm with the Vault-stored password into its own scratch cache.
  block:
    - name: Ipa-kube-admin-credential | pre-clear password-probe scratch cache
      ansible.builtin.file:
        path: /tmp/.kca_password_probe.ccache
        state: absent
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true

    - name: Ipa-kube-admin-credential | mint Vault-password ticket into scratch cache
      community.general.krb_ticket:
        principal: "{{ ipa_kube_admin_principal }}"
        password: "{{ vault_kube_admin_password | default('KubeClusterAdm2026') }}"
        cache_name: /tmp/.kca_password_probe.ccache
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      no_log: "{{ secure_logs }}"
      changed_when: false
  rescue:
    - name: Ipa-kube-admin-credential | record Vault password unusable
      ansible.builtin.set_fact:
        kca_password_usable: false

- name: Ipa-kube-admin-credential | record Vault password usable
  ansible.builtin.set_fact:
    kca_password_usable: true
  when: kca_password_usable is not defined

- name: Ipa-kube-admin-credential | reset the kubeclusteradm key via kadmin.local on the IPA server
  # kadmin.local runs as root against the local KDB: no KDC changepw policy and no
  # expiry attribute stored — the KDC computes the expiry as last-change + maxpwage,
  # so the account is immediately usable. Shell required: no native module for
  # kadmin; the password is piped via stdin (kadmin prompts twice: new + confirm).
  # No ticket needed (local KDB operation) — the `kinit admin` bootstrap this task
  # once carried had no consumer and is gone.
  #
  # The KDC min-password-age window can still reject a re-assert made shortly
  # after an *external* key rotation: kadmin then prints "Too soon to change
  # password" to stderr while exiting 0 — failed_when turns that silent false
  # success into a hard failure instead of letting the verification task fail
  # with an opaque kinit error. (The role's own keytab export no longer rotates
  # the key, so it cannot trigger this window.)
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s\n%s\n' "{{ vault_kube_admin_password | default('KubeClusterAdm2026') }}" "{{ vault_kube_admin_password | default('KubeClusterAdm2026') }}" | kadmin.local -q "cpw {{ ipa_kube_admin_principal }}"
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"
  register: kube_admin_cpw_result
  # Truthful, not blanket suppression: the probe gate means the task only runs
  # when neither credential is usable, and in that case it genuinely mutates
  # the account key — so changed=true is the correct report.
  changed_when: true
  failed_when: "'Too soon' in (kube_admin_cpw_result.stderr | default(''))"
  when:
    - not kca_keytab_usable | bool
    - not kca_password_usable | bool

- name: Ipa-kube-admin-credential | verify kubeclusteradm can authenticate
  # Mirrors the probes: the keytab is tried first (steady-state credential);
  # the rescue mints a password ticket instead — the fresh-install path, where
  # the cpw task above just set the key (the keytab does not exist yet —
  # ipa-cert-renewal.yml generates it later in the converge). If neither
  # credential authenticates, the rescue's ticket task fails and the converge
  # stops here rather than continuing with a broken admin credential.
  block:
    - name: Ipa-kube-admin-credential | pre-clear verification scratch cache
      ansible.builtin.file:
        path: /tmp/.kca_admin.ccache
        state: absent
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true

    - name: Ipa-kube-admin-credential | mint keytab ticket for verification
      community.general.krb_ticket:
        keytab: true
        keytab_path: /tmp/kubeclusteradm.keytab
        principal: "{{ ipa_kube_admin_principal }}"
        cache_name: /tmp/.kca_admin.ccache
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      changed_when: false
  rescue:
    - name: Ipa-kube-admin-credential | re-clear verification scratch cache
      ansible.builtin.file:
        path: /tmp/.kca_admin.ccache
        state: absent
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true

    - name: Ipa-kube-admin-credential | mint Vault-password ticket for verification
      community.general.krb_ticket:
        principal: "{{ ipa_kube_admin_principal }}"
        password: "{{ vault_kube_admin_password | default('KubeClusterAdm2026') }}"
        cache_name: /tmp/.kca_admin.ccache
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      no_log: "{{ secure_logs }}"
      changed_when: false

- name: Ipa-kube-admin-credential | confirm the verification ticket is in the scratch cache
  # Exception: no native klist module; strictly read-only cache inspection
  # (changed_when: false is truthful). Proves the ticket above landed in the
  # scratch cache — a silent no-ticket would fail here, not pass unnoticed.
  ansible.builtin.command: klist /tmp/.kca_admin.ccache
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  register: kube_admin_verify
  changed_when: false

# NOTE: the cluster-API acceptance check (`kubectl get nodes` against admin.conf) used
# to run here, but it ran BEFORE admin-user.yml re-embedded admin.conf with the CA #2
# admin client cert — so it could only pass against the pre-swap trust anchor and
# failed against the 2-CA bundle. It now runs at the end of admin-user.yml, after the
# re-embed (and before ipa-pki-swap.yml, whose gates reuse the same admin.conf).
