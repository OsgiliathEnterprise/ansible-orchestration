---
# Create the kubeclusteradm IPA user and its Kubernetes credential on the master,
# then verify the credential is usable (kinit + kubectl get nodes).
# Runs after ipa-certs.yml so the ConfigMap CA is stable.

- name: Check if kubeclusteradm IPA user exists
  ansible.builtin.command: id -u kubeclusteradm
  register: kube_admin_user_check
  changed_when: false
  failed_when: false

- name: Create kubeclusteradm IPA user with Kubernetes credential
  freeipa.ansible_freeipa.ipauser:
    name: kubeclusteradm
    email: "{{ kube_credential_email_address }}"
    first: Kubernetes
    last: ClusterAdmin
    random: no
    keytab: yes
    krb_password: "{{ vault_kube_admin_password | default('KubeClusterAdm!2026') }}"
  when: kube_admin_user_check.rc != 0

- name: Create Kubernetes credential for kubeclusteradm
  freeipa.ansible_freeipa.ipakrbprincipal:
    principal: "kubeclusteradm@OSGILIATH.TEST"
    password: "{{ vault_kube_admin_password | default('KubeClusterAdm!2026') }}"
  when: false

- name: Verify kubeclusteradm credential works (kinit + kubectl)
  ansible.builtin.shell: |
    set -o pipefail
    echo "{{ vault_kube_admin_password | default('KubeClusterAdm!2026') }}" | kinit -S HTTP/kube.osgiliath.test@OSGILIATH.TEST kubeclusteradm@OSGILIATH.TEST 2>&1 || \
      echo "{{ vault_kube_admin_password | default('KubeClusterAdm!2026') }}" | kinit kubeclusteradm@OSGILIATH.TEST 2>&1
    kubectl get nodes --kubeconfig=/etc/kubernetes/admin.conf
  changed_when: false
