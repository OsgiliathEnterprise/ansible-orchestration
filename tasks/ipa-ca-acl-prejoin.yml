---
# Pre-join CA ACL host grants (design D3): authorize every kube host to
# self-enroll from both CAs BEFORE any self-enrollment task runs.
# ipa-cert-renewal.yml applies the same grants, but it runs late in the
# converge — after the master cert swap (ipa-certs.yml) and the node join
# (kube-install-join-node.yml) — and the CA ACL user category (usercat=all)
# covers users only, never host principals, so a host keytab ticket cannot
# enroll without an explicit host grant.
#
# Called from ipa-certs.yml immediately after the two CAs and their profile
# links exist (ipa-kubernetes-ca.yml + ipa-kubeclusteradm-ca.yml) and before
# the master enrollment tasks (ipa-master.yml, ipa-api-server.yml,
# ipa-front-proxy.yml, kube-apiserver-kubelet-client.yml,
# ipa-controller-manager-client.yml, ipa-scheduler-client.yml). Node
# self-enrollment (kube-node-cert.yml via kube-install-join-node.yml) is
# likewise covered: main.yml orders the master's ipa-certs.yml before the
# node join block.
#
# The grant wrapper (tasks/_ipa-ca-acl-grants.yml, single source of truth)
# mints the scratch admin ticket via tasks/_krb_ticket.yml and loops the shared
# check-then-add include (tasks/ipa-ca-acl-host.yml) for both CAs;
# ipa-cert-renewal.yml includes the same wrapper as the steady-state re-assert
# (late-added hosts are repaired on the next converge).

- name: Ipa-ca-acl-prejoin | grant both CAs to all kube hosts
  ansible.builtin.include_tasks: _ipa-ca-acl-grants.yml
  vars:
    ipa_ca_acl_grant_hosts_kubernetes_ca: "{{ groups[kube_masters_group] + groups[kube_nodes_group] }}"
    ipa_ca_acl_grant_hosts_kubeclusteradm: "{{ groups[kube_masters_group] + groups[kube_nodes_group] }}"
