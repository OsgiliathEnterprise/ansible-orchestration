---
# Pre-join CA ACL host grants (design D3): authorize every kube host to
# self-enroll from both CAs BEFORE any self-enrollment task runs.
# ipa-cert-renewal.yml applies the same grants, but it runs late in the
# converge — after the master cert swap (ipa-certs.yml) and the node join
# (kube-install-join-node.yml) — and the CA ACL user category (usercat=all)
# covers users only, never host principals, so a host keytab ticket cannot
# enroll without an explicit host grant.
#
# Called from ipa-certs.yml immediately after the two CAs and their profile
# links exist (ipa-kubernetes-ca.yml + ipa-kubeclusteradm-ca.yml) and before
# the master enrollment tasks (ipa-master.yml, ipa-api-server.yml,
# ipa-front-proxy.yml, kube-apiserver-kubelet-client.yml,
# ipa-controller-manager-client.yml, ipa-scheduler-client.yml). Node
# self-enrollment (kube-node-cert.yml via kube-install-join-node.yml) is
# likewise covered: main.yml orders the master's ipa-certs.yml before the
# node join block.
#
# The loops reuse the shared check-then-add include (tasks/ipa-ca-acl-host.yml,
# single source of truth) rather than copying it; ipa-cert-renewal.yml keeps
# its own loops as the steady-state re-assert (late-added hosts are repaired
# on the next converge).

- name: Ipa-ca-acl-prejoin | pre-clear admin ticket scratch cache
  ansible.builtin.file:
    path: "{{ kube_scratch_cache_dir }}/admin.ca_acl.ccache"
    state: absent
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  changed_when: false

- name: Ipa-ca-acl-prejoin | acquire admin ticket into scratch cache
  community.general.krb_ticket:
    principal: admin
    password: "{{ company_realm_password }}"
    cache_name: "{{ kube_scratch_cache_dir }}/admin.ca_acl.ccache"
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"
  changed_when: false

- name: Ipa-ca-acl-prejoin | grant kubernetes-ca access to all kube hosts
  ansible.builtin.include_tasks: ipa-ca-acl-host.yml
  loop: "{{ groups[kube_masters_group] + groups[kube_nodes_group] }}"
  vars:
    ipa_ca_acl_name: "kubernetes-ca-acl"
    ipa_ca_acl_host: "{{ item }}"
    ipa_ca_acl_ccache: "{{ kube_scratch_cache_dir }}/admin.ca_acl.ccache"

- name: Ipa-ca-acl-prejoin | grant kubeclusteradm CA access to all kube hosts
  ansible.builtin.include_tasks: ipa-ca-acl-host.yml
  loop: "{{ groups[kube_masters_group] + groups[kube_nodes_group] }}"
  vars:
    ipa_ca_acl_name: "{{ ipa_kubeclusteradm_ca_name }}-acl"
    ipa_ca_acl_host: "{{ item }}"
    ipa_ca_acl_ccache: "{{ kube_scratch_cache_dir }}/admin.ca_acl.ccache"
