---
# Swap the controller-manager client certificate from the kubeadm CA (CA #0) to the IPA
# kubeclusteradm CA (CA #2), mirroring the front-proxy / node-client pattern. The
# controller-manager authenticates to the API by client certificate and its cert is
# embedded (base64) in controller-manager.conf.
#
# Re-issuing under the host/<master> service principal requires the CSR's CN to equal
# the master's hostname: IPA's host-principal check compares the CSR subject to the
# principal's hostname, and a GID like system:kube-controller-manager fails that check
# (ipacert rejects the request). The static-subject profile kubeControllerManager
# (created in ipa-kubernetes-ca.yml) rewrites the issued subject to the exact
# system:masters identity, so the CSR only needs to pass the host check. The cert is
# requested under the master's host principal, so it stays renewable by the host keytab
# (mirroring kube-cert-renew.sh).
#
# Idempotency: the gate extracts the embedded client certificate from
# controller-manager.conf and checks its issuer — once the conf carries a CA #2-signed
# cert, the whole file is a no-op. The scheduler's re-issue is gated independently in
# ipa-scheduler-client.yml.

# --- gate: is the controller-manager cert already CA #2-signed? ---
# (shell exception: no native module extracts an embedded client certificate from a
# kubeconfig and reports its issuer; this is strictly read-only.)
- name: Ipa-controller-manager-client | extract controller-manager client cert issuer from controller-manager.conf
  ansible.builtin.shell: |
    set -o pipefail
    b64=$(grep 'client-certificate-data' /etc/kubernetes/controller-manager.conf | awk '{print $2}')
    echo "$b64" | base64 -d > /tmp/controller-manager-current.crt
    if openssl x509 -in /tmp/controller-manager-current.crt -noout -issuer | grep -q "{{ ipa_kubeclusteradm_ca_name }}"; then
      echo "CA2-SIGNED"
    else
      echo "NOT-CA2"
    fi
  become: true
  changed_when: false
  register: cm_cert_issuer

- name: "Ipa-controller-manager-client | controller-manager cert not yet CA #2-signed"
  ansible.builtin.set_fact:
    cm_swap_needed: "{{ 'NOT-CA2' in cm_cert_issuer.stdout }}"

# --- controller-manager client certificate ---
- name: Ipa-controller-manager-client | create controller-manager-client private key
  community.crypto.openssl_privatekey:
    path: "{{ kubernetes_certificates_path }}controller-manager-client.key"
  become: true
  when: cm_swap_needed

- name: Ipa-controller-manager-client | create controller-manager-client csr
  community.crypto.openssl_csr:
    path: "{{ kubernetes_certificates_path }}controller-manager-client.csr"
    privatekey_path: "{{ kubernetes_certificates_path }}controller-manager-client.key"
    country_name: "{{ kube_credential_country_name }}"
    organization_name: "system:masters"
    # CN must be the master's hostname: the request runs under the host/<master>
    # service principal and IPA's host-principal check compares the CSR subject to
    # the principal's hostname (a GID CN fails the check). The static-subject
    # profile kubeControllerManager rewrites the issued subject to the exact
    # system:masters identity (D3a).
    common_name: "{{ orchestration_host_hostname }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - clientAuth
  become: true
  when: cm_swap_needed

- name: "Ipa-controller-manager-client | request controller-manager certificate from the kubeclusteradm CA (CA #2)"
  freeipa.ansible_freeipa.ipacert:
    ipaadmin_password: "{{ company_realm_password }}"
    ca: "{{ ipa_kubeclusteradm_ca_name }}"
    principal: "host/{{ orchestration_host_hostname }}"
    csr_file: "{{ kubernetes_certificates_path }}controller-manager-client.csr"
    certificate_out: "{{ kubernetes_certificates_path }}controller-manager-client.crt"
    profile_id: kubeControllerManager
    state: requested
  no_log: "{{ secure_logs }}"
  become: true
  when: cm_swap_needed

# --- re-embed into the static-pod conf file ---
# kubectl config set-credentials with --embed-certs=true reads the new cert/key and
# embeds them (base64) into the conf, overwriting the old embedded data.
# (shell exception: kubectl config set-credentials writes credentials into a kubeconfig —
# no native module for this; see the AGENTS.md shell-exception rule.)
- name: Ipa-controller-manager-client | re-embed controller-manager cert into controller-manager.conf
  ansible.builtin.shell: |
    set -o pipefail
    kubectl config set-credentials system:kube-controller-manager \
      --client-key="{{ kubernetes_certificates_path }}controller-manager-client.key" \
      --client-certificate="{{ kubernetes_certificates_path }}controller-manager-client.crt" \
      --embed-certs=true \
      --kubeconfig=/etc/kubernetes/controller-manager.conf
  become: true
  changed_when: true
  when: cm_swap_needed

# --- restart the static pod (manifest-move pattern, mirroring kube-cert-renew.sh) ---
# The controller-manager static pod reads its conf at startup; moving the manifest
# restarts the pod, which re-reads the conf with the new embedded cert.
# (shell exception: static-pod restart via manifest move — no native module; the renewal
# script kube-cert-renew.sh uses this exact pattern for the kube-apiserver.)
- name: Ipa-controller-manager-client | restart controller-manager static pod
  ansible.builtin.shell: |
    set -o pipefail
    MANIFEST=/etc/kubernetes/manifests/kube-controller-manager.yaml
    mv "$MANIFEST" "${MANIFEST}.renewing"
    for _ in $(seq 1 30); do
      crictl ps --name kube-controller-manager -q | grep -qv . || break
      sleep 1
    done
    mv "${MANIFEST}.renewing" "$MANIFEST"
  become: true
  changed_when: true
  when: cm_swap_needed
