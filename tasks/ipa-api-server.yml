---
- name: Ipa-api-server | Check apiserver cert existence
  ansible.builtin.stat:
    path: "{{ kubernetes_certificates_path }}apiserver.crt"
  register: orchestration_apiservercert
  become: true

- name: Ipa-api-server | configure http service
  freeipa.ansible_freeipa.ipaservice:
    ipaadmin_password: "{{ company_realm_password }}"
    name: "{{ item }}"
    host: "{{ orchestration_host_hostname }}"
    allow_retrieve_keytab_host: "{{ orchestration_host_hostname }}"
    allow_create_keytab_host: "{{ orchestration_host_hostname }}" # TODO create kubernetes master group
    force: True
  delegate_to: "{{ groups[idm_group][0] }}"
  no_log: "{{ secure_logs }}"
  loop:
   - "HTTP/{{ orchestration_host_hostname }}"
  failed_when: false

# ipacert also requires an existing service principal for every DNS SAN
# ("The service principal for subject alt name X ... does not exist"), and —
# since self-enrollment authenticates with the master's *host* ticket — the
# certificate's DNS SANs are privilege-checked against service ownership:
# every HTTP/<san> must be managed by a host the authenticated principal
# controls (otherwise: "Insufficient privilege to create a certificate with
# subject alt name ..."). So the alias services are created managed-by the
# master host, exactly like HTTP/<master> above.
#
# skip_host_check: True — the alias names are DNS names, not IPA host entries, so the
# host_show lookup is skipped.
# force: True — the ipaservice pre_callback still runs util.verify_host_resolvable(),
# which resolves the name through the IPA *server host's system resolver* (not the IPA
# zone database). The idm link's resolvectl races the IPA DNS servers (authoritative,
# answer) against the public upstream (NXDOMAIN for the company domain); whichever
# answers first is adopted and cached for the negative-cache TTL, so the check is flaky
# per cache window even though the A records exist in the zone. The invariant it guards
# ("hostname has an A record in the zone") is enforced earlier by ipa-kubernetes-ca.yml
# (A+PTR records for kubernetes-svc / kubernetes-master); force skips only the
# resolvability check (matches the HTTP/<master> task above, which already uses force).
- name: Ipa-api-server | configure http services for SAN alias names (satisfies ipacert service principal and SAN-ownership checks)
  freeipa.ansible_freeipa.ipaservice:
    ipaadmin_password: "{{ company_realm_password }}"
    name: "{{ item }}"
    host: "{{ orchestration_host_hostname }}"
    skip_host_check: True
    force: True
  delegate_to: "{{ groups[idm_group] | first }}"
  no_log: "{{ secure_logs }}"
  loop:
   - "HTTP/kubernetes-svc.{{ company_domain }}"
   - "HTTP/kubernetes-master.{{ company_domain }}"
  changed_when: false

- name: Ipa-api-server | create apiserver certs
  community.crypto.openssl_privatekey:
    path: "{{ kubernetes_certificates_path }}apiserver.key"
  become: true

- name: Ipa-api-server | create kube-apiserver csr
  community.crypto.openssl_csr:
    path: "{{ kubernetes_certificates_path }}apiserver.csr"
    privatekey_path: "{{ kubernetes_certificates_path }}apiserver.key"
    country_name: "{{ kube_credential_country_name }}"
    organization_name: "{{ company_domain }}"
    email_address: "{{ kube_credential_email_address }}"
    common_name: "{{ orchestration_host_hostname }}"
    subject_alt_name: "{{ ['DNS:' + (orchestration_host_hostname), 'DNS:kubernetes-svc.' + company_domain, 'DNS:kubernetes-master.' + company_domain, 'IP:' + ((kube_service_cidr | default('10.96.0.0/12')) | ansible.utils.next_nth_usable(1)), 'IP:' + (orchestration_master_ip)] + (kube_alt_names | default([]) | map('regex_replace', '^', 'DNS:') | unique) }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
  when:
   - not orchestration_apiservercert.stat.exists
  become: true

# The master owns this certificate's identity, so it authenticates the request
# with its own host ticket (C3): minted from the master's /etc/krb5.keytab into
# a pre-cleared scratch cache, consumed via KRB5CCNAME — no ipaadmin_password
# on the wire. The CA #1 ACL (kubernetes-ca-acl, usercat=all, created in
# ipa-ca-ensure.yml) authorizes the authenticated host principal to request the
# HTTP/<master> certificate; verified by spike before this conversion.
- name: Ipa-api-server | pre-clear master host ticket scratch cache
  ansible.builtin.file:
    path: "{{ kube_scratch_cache_dir }}/host_master.apiserver.ccache"
    state: absent
  become: true
  changed_when: false

- name: Ipa-api-server | acquire master host ticket from the host keytab
  community.general.krb_ticket:
    keytab: true
    keytab_path: /etc/krb5.keytab
    principal: "host/{{ orchestration_host_hostname }}"
    cache_name: "{{ kube_scratch_cache_dir }}/host_master.apiserver.ccache"
  become: true
  changed_when: false

- name: Ipa-api-server | request apiserver certificate from IPA
  freeipa.ansible_freeipa.ipacert:
    ca: kubernetes-ca
    principal: "HTTP/{{ orchestration_host_hostname }}"
    csr_file: "{{ kubernetes_certificates_path }}apiserver.csr"
    certificate_out: "{{ kubernetes_certificates_path }}apiserver.crt"
    profile_id: kubeAdministrators
    state: requested
  no_log: "{{ secure_logs }}"
  become: true
  environment:
    KRB5CCNAME: "{{ kube_scratch_cache_dir }}/host_master.apiserver.ccache"
