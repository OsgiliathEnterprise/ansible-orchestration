- name: Ipa-api-server | configure http service
  freeipa.ansible_freeipa.ipaservice:
    ipaadmin_password: "{{ company_realm_password }}"
    name: "{{ item }}"
    host: "{{ orchestration_host_hostname }}"
    allow_retrieve_keytab_host: "{{ orchestration_host_hostname }}"
    allow_create_keytab_host: "{{ orchestration_host_hostname }}" # TODO create kubernetes master group
    force: True
  delegate_to: "{{ groups[idm_group][0] }}"
  no_log: "{{ secure_logs }}"
  loop:
   - "HTTP/{{ orchestration_host_hostname }}"
  failed_when: false
  changed_when: false

- name: Ipa-api-server | create apiserver certs
  community.crypto.openssl_privatekey:
    path: "{{ kubernetes_certificates_path }}apiserver.key"
  become: true

- name: Ipa-api-server | create kube-apiserver csr
  community.crypto.openssl_csr:
    path: "{{ kubernetes_certificates_path }}apiserver.csr"
    privatekey_path: "{{ kubernetes_certificates_path }}apiserver.key"
    country_name: "{{ kube_credential_country_name }}"
    organization_name: "{{ company_domain }}"
    email_address: "{{ kube_credential_email_address }}"
    common_name: "{{ orchestration_host_hostname }}"
    subject_alt_name: "{{ ['DNS:' + (orchestration_host_hostname), 'IP:' + ((kube_service_cidr | default('10.96.0.0/12')) | ansible.utils.next_nth_usable(1)), 'IP:' + (orchestration_master_ip)] + (kube_alt_names | default([]) | map('regex_replace', '^', 'DNS:') | unique) }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
  when:
   - not orchestration_apiservercert.stat.exists
  become: true

# - name: ansible-orchestration | ipa-api-server | apiserver service to kubernetes adminstrator group
