- name: Ipa-api-server | request apiserver certificate from IPA
  freeipa.ansible_freeipa.ipacert:
    ipaadmin_password: "{{ company_realm_password }}"
    ca: kubernetes-ca
    principal: "HTTP/{{ orchestration_host_hostname }}"
    csr_file: "{{ kubernetes_certificates_path }}apiserver.csr"
    certificate_out: "{{ kubernetes_certificates_path }}apiserver.crt"
    profile_id: kubeAdministrators
    state: requested
  no_log: "{{ secure_logs }}"
  become: true
