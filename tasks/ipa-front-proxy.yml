---

- name: Ipa-front-proxy | remove kubeadm front-proxy cert so IPA-signed one is created
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ kubernetes_certificates_path }}front-proxy-client.crt"
    - "{{ kubernetes_certificates_path }}front-proxy-client.key"
    - "{{ kubernetes_certificates_path }}front-proxy-client.csr"
  become: true

- name: Ipa-front-proxy | create front-proxy-client private key
  community.crypto.openssl_privatekey:
    path: "{{ kubernetes_certificates_path }}front-proxy-client.key"
  become: true

- name: Ipa-front-proxy | create front-proxy-client csr
  community.crypto.openssl_csr:
    path: "{{ kubernetes_certificates_path }}front-proxy-client.csr"
    privatekey_path: "{{ kubernetes_certificates_path }}front-proxy-client.key"
    country_name: "{{ kube_credential_country_name }}"
    organization_name: "{{ company_domain }}"
    email_address: "{{ kube_credential_email_address }}"
    common_name: "{{ orchestration_host_hostname }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - clientAuth
  become: true

# The master owns this certificate's identity, so it authenticates the request
# with its own host ticket (C3): minted from the master's /etc/krb5.keytab into
# a pre-cleared scratch cache, consumed via KRB5CCNAME — no ipaadmin_password
# on the wire. The CA #2 ACL (kubeclusteradm-acl, usercat=all + host grants)
# authorizes the host principal.
- name: Ipa-front-proxy | pre-clear master host ticket scratch cache
  ansible.builtin.file:
    path: "{{ kube_scratch_cache_dir }}/host_master.front_proxy.ccache"
    state: absent
  become: true
  changed_when: false

- name: Ipa-front-proxy | acquire master host ticket from the host keytab
  community.general.krb_ticket:
    keytab: true
    keytab_path: /etc/krb5.keytab
    principal: "host/{{ orchestration_host_hostname }}"
    cache_name: "{{ kube_scratch_cache_dir }}/host_master.front_proxy.ccache"
  become: true
  changed_when: false

- name: "Ipa-front-proxy | request front-proxy certificate from the kubeclusteradm CA (CA #2)"
  freeipa.ansible_freeipa.ipacert:
    ca: "{{ ipa_kubeclusteradm_ca_name }}"
    principal: "host/{{ orchestration_host_hostname }}"
    csr_file: "{{ kubernetes_certificates_path }}front-proxy-client.csr"
    certificate_out: "{{ kubernetes_certificates_path }}front-proxy-client.crt"
    profile_id: kubeAdministrators
    state: requested
  no_log: "{{ secure_logs }}"
  become: true
  environment:
    KRB5CCNAME: "{{ kube_scratch_cache_dir }}/host_master.front_proxy.ccache"
