---
- name: Admin-user | create a kube credential folder
  ansible.builtin.file:
    state: directory
    dest: "{{ kube_credential_folder }}"
    mode: "0755"
    owner: "root"
    group: "root"
  become: true

- name: Admin-user | create a kube credential key and store into the first datastore mountpoint
  community.crypto.openssl_privatekey:
    path: "{{ kube_credential_folder }}/kubeadm.pem"
  when:
   - not kube_credential_key is defined
  become: true

- name: Admin-user | create a kube credential key and store into the first datastore mountpoint
  ansible.builtin.copy:
    dest: "{{ kube_credential_folder }}/kubeadm.pem"
    content: "{{ kube_credential_key }}"
    owner: "root"
    group: "root"
    mode: '0600'
  when:
   - kube_credential_key is defined
  become: true

- name: Admin-user | Generate an OpenSSL Certificate Signing Request with Subject information
  community.crypto.openssl_csr:
    privatekey_path: "{{ kube_credential_folder }}/kubeadm.pem"
    country_name: "{{ kube_credential_country_name }}"
    organization_name: "clusterAdministrators"
    common_name: "kubeclusteradm"
    email_address: "{{ kube_credential_email_address }}"
    path: "{{ kube_credential_folder }}/kubeadm.csr"
    use_common_name_for_san: false
  become: true

- name: Admin-user | Check that the admin cert exists
  ansible.builtin.stat:
    path: "{{ kube_credential_folder }}/kubeadm.crt"
  register: orchestration_admin_cert
  become: true

- name: Admin-user | read CSR content from master host
  ansible.builtin.slurp:
    src: "{{ kube_credential_folder }}/kubeadm.csr"
  register: csr_content
  when:
   - not orchestration_admin_cert.stat.exists
  become: true

# IPA PKI path: create admin principal via ipauser module, sign cert via ipacert module
- name: Admin-user | create user principal for admin cert (IPA PKI)
  freeipa.ansible_freeipa.ipauser:
    ipaadmin_password: "{{ company_realm_password }}"
    name: "kubeclusteradm"
    first: "kube"
    last: "ClusterAdmin"
    email: "{{ kube_credential_email_address }}"
    password: "{{ company_realm_password }}"
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"

- name: Admin-user | request admin certificate from IPA (IPA PKI)
  freeipa.ansible_freeipa.ipacert:
    ipaadmin_password: "{{ company_realm_password }}"
    ca: kubernetes-ca
    profile_id: kubeAdministrators
    principal: "kubeclusteradm"
    csr_file: "{{ kube_credential_folder }}/kubeadm.csr"
    certificate_out: "{{ kube_credential_folder }}/kubeadm.crt"
    state: requested
  no_log: "{{ secure_logs }}"
  become: true
  when:
   - not orchestration_admin_cert.stat.exists

- name: Admin-user | create kubernetes cluster administrator group file
  ansible.builtin.copy:
    src: "{{ item }}.yml"
    dest: "/tmp/{{ item }}.yml"
    owner: root
    group: root
    mode: '0640'
  become: true
  loop:
    - clusteradministrators
    - cluster-administrators-crb
    - namespace-creator-cr
    - namespace-requestors-cr
    - namespace-creator-crb
    - namespace-requestor-crb

- name: Admin-user | create kubernetes cluster administrator group
  kubernetes.core.k8s:
    state: present
    src: "/tmp/{{ item }}.yml"
    kubeconfig: "/etc/kubernetes/admin.conf"
  failed_when: false
  become: true
  loop:
    - clusteradministrators
    - cluster-administrators-crb
    - namespace-creator-cr
    - namespace-requestors-cr
    - namespace-creator-crb
    - namespace-requestor-crb

- name: Admin-user | configure kubernetes admin.conf with IPA signed credentials
  ansible.builtin.command: "kubectl config set-credentials kubernetes-admin --client-key={{ kube_credential_folder }}/kubeadm.pem --client-certificate={{ kube_credential_folder }}/kubeadm.crt --kubeconfig=/etc/kubernetes/admin.conf"
  failed_when: false
  changed_when: False
  become: true

- name: Admin-user | cat kubernetes admin certificates
  ansible.builtin.slurp:
    src: "{{ kube_credential_folder }}/kubeadm.crt"
  register: key
  become: true

- name: Admin-user | cat kubernetes admin certificates
  ansible.builtin.debug:
    msg: "{{ key['content'] | b64decode }}"
