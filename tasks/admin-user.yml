---
# Create a dedicated kubeadmin user in FreeIPA and provision its client certificate for kubectl access.
# The CSR is generated locally (on the control node) so the private key never leaves this machine;
# only the public CSR is submitted to IPA PKI. On re-converge, an existing kubeadm.crt short-circuits
# both CSR generation and the IPA enrollment path.

- name: Check whether a kubeadmin client certificate already exists
  ansible.builtin.stat:
    path: "{{ kube_credential_folder }}/kubeadm.crt"
  register: orchestration_admin_cert

- name: Generate kubeadmin private key and CSR (control node only)
  community.crypto.openssl_csr:
    private_key_path: "{{ kube_credential_folder }}/kubeadm.key"
    common_name: "kubeadmin"
    country_name: "FR"
    state: present
    path: "{{ kube_credential_folder }}/kubeadm.csr"
  when: not orchestration_admin_cert.stat.exists

- name: Read CSR for IPA enrollment
  ansible.builtin.slurp:
    src: "{{ kube_credential_folder }}/kubeadm.csr"
  register: orchestration_admin_csr
  when: not orchestration_admin_cert.stat.exists

# --- FreeIPA PKI path (master only) -------------------------------------

- name: Create the kubeadmin user in FreeIPA
  community.ipa.ipauser:
    ipahost: "{{ freeipa_server }}"
    principal: "kubeadmin"
    password: "{{ freeipa_admin_password }}"
    state: present
  when:
    - not orchestration_admin_cert.stat.exists
    - kube_masters_group is defined

- name: Enroll the kubeadmin CSR in FreeIPA PKI and store the certificate
  community.ipa.ipacert:
    ipahost: "{{ freeipa_server }}"
    principal: "kubeadmin"
    password: "{{ freeipa_admin_password }}"
    csr_file: "{{ kube_credential_folder }}/kubeadm.csr"
    certificate_out: "{{ kube_credential_folder }}/kubeadm.crt"
  when:
    - not orchestration_admin_cert.stat.exists
    - kube_masters_group is defined

# --- kubectl configuration -------------------------------------------------

- name: Create the kubeadmin user on the master node
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: "{{ admin_user_groups | join(',') }}"
    state: present

- name: Ensure .kube directory exists for kubeadmin
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.kube"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
    state: directory

- name: Write kubeconfig for kubeadmin with client certificate
  ansible.builtin.copy:
    dest: "/home/{{ admin_user }}/.kube/config"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
    content: |
      apiVersion: v1
      kind: Config
      clusters:
        - cluster:
            certificate-authority: /etc/kubernetes/pki/kubelet-ca-current.pem
            server: https://{{ master_ip }}:6443
          name: osgiliath
      contexts:
        - context:
            cluster: osgiliath
            user: kubeadmin
          name: osgiliath
      current-context: osgiliath
      users:
        - name: kubeadmin
          user:
            client-certificate: "{{ kube_credential_folder }}/kubeadm.crt"
            client-key: "{{ kube_credential_folder }}/kubeadm.key"

- name: Copy the kubeadmin certificate to the master node for kubectl use
  ansible.builtin.copy:
    src: "{{ kube_credential_folder }}/kubeadm.crt"
    dest: "/home/{{ admin_user }}/.kube/kubeadmin.crt"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
