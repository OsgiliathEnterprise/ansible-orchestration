---
# Request this worker node's own client certificate from the kubeclusteradm CA (CA #2),
# entirely on the node (principals-in-place D2): the private key, the CSR, the Kerberos
# ticket and the enrollment all stay on the node — the master never mints the node's
# key and no admin identity ever holds the node's private key. The node authenticates
# to the IPA API with its own host keytab (/etc/krb5.keytab), the same identity
# kube-cert-renew.sh.j2 uses to renew this certificate at runtime.
#
# The CSR carries CN=<hostname> (matching host/<hostname> so IPA's host-principal
# hostname check passes) and O=system:nodes; the kubernetesNodes profile template adds
# the system:node: prefix, so the ISSUED cert is O=system:nodes,
# CN=system:node:<hostname> and the kubelet registers with node-scoped RBAC instead of
# a shared admin identity.
#
# Prerequisites are already in place when this runs: main.yml includes the master's
# ipa-certs.yml (which provisions CA #2, the kubernetesNodes profile and the
# ipa-ca-acl-prejoin.yml host grants) before kube-install-join-node.yml, and the node
# is an enrolled IPA client from prepare.yml, so /etc/krb5.keytab exists pre-join.

- name: Kube-node-cert | check if node client cert exists locally
  ansible.builtin.stat:
    path: "{{ kubernetes_certificates_path }}node-client.crt"
  register: node_client_cert_result
  become: true

# openssl_privatekey/openssl_csr write into this directory but do not create it;
# the old shuttle flow relied on `copy` parent creation, the node-local flow needs
# it to exist before the key task.
- name: Kube-node-cert | ensure certificate directory exists
  ansible.builtin.file:
    path: "{{ kubernetes_certificates_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

# Node-local ticket: each worker mints from its OWN /etc/krb5.keytab (the
# shared include's delegate default = inventory host is exactly right here).
# Explicit slug preserves the historically-observable per-node cache name so
# re-runs on a VM converged before this change keep finding the same file.
- name: Kube-node-cert | mint ticket from the node's own host keytab
  ansible.builtin.include_tasks: _krb_ticket.yml
  vars:
    krb_ticket_principal: "host/{{ orchestration_host_hostname }}"
    krb_ticket_keytab_path: /etc/krb5.keytab
    krb_ticket_cache_purpose: node_cert
    krb_ticket_cache_slug: "{{ orchestration_host_hostname }}"
  when: not node_client_cert_result.stat.exists

- name: Kube-node-cert | create node client private key (on the node)
  community.crypto.openssl_privatekey:
    path: "{{ kubernetes_certificates_path }}node-client.key"
    mode: '0600'
  become: true
  when: not node_client_cert_result.stat.exists

- name: Kube-node-cert | create node client csr (on the node)
  community.crypto.openssl_csr:
    path: "{{ kubernetes_certificates_path }}node-client.csr"
    privatekey_path: "{{ kubernetes_certificates_path }}node-client.key"
    country_name: "{{ kube_credential_country_name }}"
    organization_name: "system:nodes"
    email_address: "{{ kube_credential_email_address }}"
    # CSR carries the bare hostname (matches host/<hostname> principal); the profile
    # template adds the system:node: prefix so the issued CN is system:node:<hostname>.
    common_name: "{{ orchestration_host_hostname }}"
    key_usage: [digitalSignature, keyEncipherment]
    extended_key_usage: [clientAuth]
  become: true
  when: not node_client_cert_result.stat.exists

- name: "Kube-node-cert | self-enroll node client certificate from the kubeclusteradm CA (CA #2)"
  # Node-local enrollment against the remote IPA API: the module authenticates with
  # the node's own host ticket via KRB5CCNAME — no ipaadmin_password on the wire, and
  # neither the master nor idm ever holds the private key. The CA ACL
  # (kubeclusteradm-acl: user category all + explicit host grants from
  # ipa-ca-acl-prejoin.yml) and profile linkage cover the request for
  # principal host/<hostname>.
  freeipa.ansible_freeipa.ipacert:
    ca: "{{ ipa_kubeclusteradm_ca_name }}"
    principal: "host/{{ orchestration_host_hostname }}"
    csr_file: "{{ kubernetes_certificates_path }}node-client.csr"
    certificate_out: "{{ kubernetes_certificates_path }}node-client.crt"
    profile_id: kubernetesNodes
    state: requested
  become: true
  environment:
    KRB5CCNAME: "{{ kube_scratch_cache_dir }}/{{ orchestration_host_hostname }}.node_cert.ccache"
  when: not node_client_cert_result.stat.exists
