---
# Provision unattended certificate renewal (keytab-based; no admin password at runtime).
# Master only: grant the IT Specialist role to this host (needed for write access on the
# apiserver SAN principals), grant every kube host access to kubernetes-ca via its CA ACL
# (renewal runs as the host principal, which usercat=all does not cover), grant every host
# (including the IPA server) access to the kubeclusteradm CA (CA #2) via its CA ACL
# (client-cert renewal runs as the host principal, which usercat=all does not cover), and
# install the kubeclusteradm user keytab used to renew the cluster-admin client certificate.
# All hosts: install the renewal script + systemd timer.

- name: Ipa-cert-renewal | Grant IT Specialist role to master host (SAN write access)
  freeipa.ansible_freeipa.iparole:
    ipaadmin_password: "{{ company_realm_password }}"
    name: "IT Specialist"
    state: present
    action: member
    host: ["{{ orchestration_host_hostname }}"]
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"
  when: kube_masters_group in group_names

# Host grants run before the renewal script is deployed (below): the script
# authenticates as the host principal and the kubeclusteradm user, so their
# ACL membership must exist before the first unattended tick. The
# check-then-add pattern lives in the shared include (single source of
# truth; see tasks/ipa-ca-acl-host.yml).

# Scratch admin ticket for this file's idm-delegated `ipa` consumers: the
# looped CA-ACL grants (ipa-ca-acl-host.yml) authenticate with this cache via
# environment: KRB5CCNAME. Runs unconditionally before the loops. Pre-cleared
# so a stale/expired ticket is never reused; changed_when: false — the scratch
# cache is ephemeral state. (The keytab export below does NOT need it:
# kadmin.local binds to the local KDB.)
- name: Ipa-cert-renewal | pre-clear admin ticket scratch cache
  ansible.builtin.file:
    path: "{{ kube_scratch_cache_dir }}/admin.ca_acl.ccache"
    state: absent
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  changed_when: false

- name: Ipa-cert-renewal | acquire admin ticket into scratch cache
  community.general.krb_ticket:
    principal: admin
    password: "{{ company_realm_password }}"
    cache_name: "{{ kube_scratch_cache_dir }}/admin.ca_acl.ccache"
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"
  changed_when: false

- name: Ipa-cert-renewal | Grant kubernetes-ca access to all kube hosts (host-principal renewal)
  ansible.builtin.include_tasks: ipa-ca-acl-host.yml
  loop: "{{ groups[kube_masters_group] + groups[kube_nodes_group] }}"
  vars:
    ipa_ca_acl_name: "kubernetes-ca-acl"
    ipa_ca_acl_host: "{{ item }}"
    ipa_ca_acl_ccache: "{{ kube_scratch_cache_dir }}/admin.ca_acl.ccache"
  when: kube_masters_group in group_names

- name: Ipa-cert-renewal | Grant kubeclusteradm CA access to all hosts (host-principal renewal)
  ansible.builtin.include_tasks: ipa-ca-acl-host.yml
  loop: "{{ groups[idm_group] + groups[kube_masters_group] + groups[kube_nodes_group] }}"
  vars:
    ipa_ca_acl_name: "{{ ipa_kubeclusteradm_ca_name }}-acl"
    ipa_ca_acl_host: "{{ item }}"
    ipa_ca_acl_ccache: "{{ kube_scratch_cache_dir }}/admin.ca_acl.ccache"
  when: kube_masters_group in group_names

- name: Ipa-cert-renewal | probe kubeclusteradm keytab usability
  # Gate regeneration on usability, not file presence: a stale keytab (the KDB
  # key rotated out from under it) must trigger a regeneration, which a mere
  # file check would not. The probe mints a fresh ticket from the keytab into
  # a scratch cache (pre-cleared) — no ambient cache read or write, and no
  # change reported (the cache is ephemeral state). `principal` is required:
  # keytab-only kinit requests the machine's default (host) principal, which
  # is never present in this user keytab.
  when: kube_masters_group in group_names
  block:
    - name: Ipa-cert-renewal | pre-clear rotation probe scratch cache
      ansible.builtin.file:
        path: "{{ kube_scratch_cache_dir }}/kubeclusteradm.rotation_probe.ccache"
        state: absent
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      changed_when: false

    - name: Ipa-cert-renewal | mint keytab ticket into scratch cache
      community.general.krb_ticket:
        keytab: true
        keytab_path: "{{ kube_idm_keytab_path }}"
        principal: "{{ ipa_kube_admin_principal }}"
        cache_name: "{{ kube_scratch_cache_dir }}/kubeclusteradm.rotation_probe.ccache"
      delegate_to: "{{ groups[idm_group] | first }}"
      become: true
      changed_when: false
  rescue:
    - name: Ipa-cert-renewal | mark keytab unusable (triggers the re-export below)
      ansible.builtin.set_fact:
        kca_rotation_keytab_usable: false

# Regeneration is a two-step pair, both gated on the usability probe above:
# delete, then export the CURRENT key. Steady state: the probe passes and
# both tasks are skipped — no keytab churn, and the one time they do run they
# genuinely regenerate, so no blanket changed_when is needed.
# The keytab's home on idm is the unit state directory (principals-in-place D5):
# a root-only (0700) directory, not /tmp. Created before any operation that
# reads or writes the keytab (probe handles absence by failing to the rescue;
# ktadd would NOT create the parent directory).
- name: Ipa-cert-renewal | ensure idm keytab state directory
  ansible.builtin.file:
    path: "{{ kube_unit_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  when: kube_masters_group in group_names

- name: Ipa-cert-renewal | remove unusable keytab before re-export
  # ktadd APPENDS entries, so a stale entry left at the top of the file would
  # shadow the fresh key (kinit uses the first matching entry) — the file must
  # hold exactly the current key. Deletion is declarative here, not an inline
  # `rm -f` inside the export command.
  ansible.builtin.file:
    path: "{{ kube_idm_keytab_path }}"
    state: absent
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  when:
    - kube_masters_group in group_names
    - not (kca_rotation_keytab_usable | default(true))

- name: Ipa-cert-renewal | export kubeclusteradm keytab on idm (kadmin.local ktadd -norandkey, non-rotating)
  # SHELL EXCEPTION (no native equivalent, verified 2026-11-01 on
  # freeipa-server-4.13.4): community.general.ipa_getkeytab cannot perform a
  # non-rotating export here. Its only non-rotating mode is retrieve_mode
  # (--retrieve), but FreeIPA protects krbPrincipalKey behind a search-only
  # ACI, so the server rejects --retrieve with "Insufficient access rights"
  # for every requester — admin included (VM-reproduced for user, host and
  # service principals). The module's default mode GENERATES a new key
  # (rotates), which the credential contract forbids (design D8: the managed
  # password must survive re-export; the keytab must track the KDB).
  # `kadmin.local ktadd -norandkey` (MIT kadmin, on the IPA master) writes
  # the stored key verbatim — no rotation, kvno unchanged, managed password
  # still mints a ticket after export (VM-verified). kadmin.local binds to
  # the local KDB: no ticket, no keytab, no password in parameters, and the
  # -norandkey export only works on the master — which is exactly where this
  # task is delegated.
  # changed_when gated on ktadd's own "added to keytab" receipt (not a
  # blanket suppression): success without writing entries would report
  # no-change instead of hiding a silent no-op.
  ansible.builtin.command:
    cmd: >-
      kadmin.local -q
      "ktadd -norandkey -k {{ kube_idm_keytab_path }} {{ ipa_kube_admin_principal }}@{{ company_domain | upper }}"
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  register: kca_keytab_export
  changed_when: "'added to keytab' in kca_keytab_export.stdout"
  when:
    - kube_masters_group in group_names
    - not (kca_rotation_keytab_usable | default(true))

- name: Ipa-cert-renewal | lock down idm keytab permissions
  # ktadd creates the file 0644 under the default umask; the keytab holds the
  # kubeclusteradm long-term key, so it must be root-only. Unconditional
  # (master-gated): `file: mode` is idempotent by construction and truthfully
  # reports a change only when the mode (or ownership) actually differs, which
  # also repairs a keytab exported by an older converge.
  ansible.builtin.file:
    path: "{{ kube_idm_keytab_path }}"
    owner: root
    group: root
    mode: '0600'
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  when: kube_masters_group in group_names

- name: Ipa-cert-renewal | slurp kubeclusteradm keytab from idm
  ansible.builtin.slurp:
    src: "{{ kube_idm_keytab_path }}"
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true
  no_log: "{{ secure_logs }}"
  register: kca_keytab_slurp
  when: kube_masters_group in group_names

- name: Ipa-cert-renewal | Install kubeclusteradm keytab for admin cert renewal
  # Master-local copy the kube-cert-renew.sh timer reads ($CRED_DIR/kubeclusteradm.keytab);
  # the idm-side {{ kube_idm_keytab_path }} above is the source of truth kept in sync
  # with the KDB.
  ansible.builtin.copy:
    content: "{{ kca_keytab_slurp.content | b64decode }}"
    dest: "{{ kube_credential_folder }}/kubeclusteradm.keytab"
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ secure_logs }}"
  become: true
  when: kube_masters_group in group_names

- name: Ipa-cert-renewal | remove legacy /tmp keytab location on idm
  # The keytab moved to {{ kube_unit_state_dir }} (principals-in-place D5); the old
  # /tmp location held a credential file and must not linger from earlier converges.
  # file: state: absent is idempotent by construction, so no changed_when suppression
  # is needed — a genuine removal reports changed, steady state reports ok.
  ansible.builtin.file:
    path: /tmp/kubeclusteradm.keytab
    state: absent
  delegate_to: "{{ groups[idm_group] | first }}"
  become: true

# IPA's SAN-validation DNS precondition (zone discovery for IP SANs) is satisfied by the
# scoped dual-nameserver resolved config that tcharl.freeipa_server / tcharl.ansible_securehost
# deploy during prepare — renewal no longer manages resolver configuration here.

- name: Ipa-cert-renewal | Install certificate renewal script
  ansible.builtin.template:
    src: kube-cert-renew.sh.j2
    dest: /usr/local/sbin/kube-cert-renew.sh
    mode: "0755"
  become: true

- name: Ipa-cert-renewal | Install systemd service unit
  ansible.builtin.copy:
    content: "{{ lookup('template', 'kube-cert-renew.service.j2') }}"
    dest: /etc/systemd/system/kube-cert-renew.service
    mode: "0644"
  become: true

- name: Ipa-cert-renewal | Install systemd timer unit
  ansible.builtin.copy:
    content: "{{ lookup('template', 'kube-cert-renew.timer.j2') }}"
    dest: /etc/systemd/system/kube-cert-renew.timer
    mode: "0644"
  become: true

- name: Ipa-cert-renewal | Enable and start renewal timer
  ansible.builtin.systemd:
    name: kube-cert-renew.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
