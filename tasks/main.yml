---
# tasks file for ansible-orchestration

- name: Drain kube
  ansible.builtin.include_tasks: delete.yml
  when:
   - reset_kube

- name: Requirements
  ansible.builtin.import_tasks: requirements.yml

- name: Fix Requirements
  ansible.builtin.include_tasks: fix-requirements.yml
  when:
   - kube_nodes_group in group_names or kube_masters_group in group_names

- name: Install needed packages
  ansible.builtin.import_tasks: prereq.yml

- name: Gather facts
  ansible.builtin.include_tasks: facts.yml

- name: Prepare node for cri
  ansible.builtin.include_tasks: cri.yml

- name: Configure firewall
  ansible.builtin.include_tasks: firewall.yml

- name: Install kube on master (kubeadm init)
  ansible.builtin.include_tasks: kube-install.yml
  when:
    - kube_masters_group in group_names

- name: Setup IPA PKI certificates on master
  ansible.builtin.include_tasks: ipa-certs.yml
  when:
    - kube_masters_group in group_names

- name: Install kube on nodes (packages + kubelet, join deferred to file-based discovery)
  when:
    - kube_nodes_group in group_names
  block:
    - name: Install kube on nodes
      ansible.builtin.include_tasks: kube-install.yml
  rescue:
    - name: Node join failed (expected on first converge), will retry with file-based discovery
      ansible.builtin.debug:
        msg: "Node join failed during kube-install. Packages installed. Will join via kube-install-join-node.yml after master post-processing."

- name: Join nodes before API server cert swap (JWS signature still valid)
  ansible.builtin.include_tasks: kube-install-join-node.yml
  when:
    - kube_nodes_group in group_names

# The admin credential (IPA user + kinit) and the CA #2 admin client cert
# (admin-user.yml) must exist BEFORE ipa-pki-swap.yml: the pki-swap verification
# gates (KCM lease, scheduler Ready, kubectl) authenticate with admin.conf, whose
# client cert must be the CA #2-issued one to be trusted by the 2-CA bundle (the
# kubeadm CA was dropped from it). The kubectl get nodes verification therefore runs
# at the end of admin-user.yml, after admin.conf is re-embedded with the CA #2 cert.
- name: Create kube admin credential from IPA CA (master)
  ansible.builtin.include_tasks: ipa-kube-admin-credential.yml
  when:
    - kube_masters_group in group_names

- name: "Create admin user (CA #2 cert + admin.conf re-embed, before pki-swap gate)"
  ansible.builtin.import_tasks: admin-user.yml
  when:
    - kube_masters_group in group_names

- name: Patch kube configs to use IPA CA
  ansible.builtin.include_tasks: ipa-pki-swap.yml
  when:
    - kube_masters_group in group_names

- name: Firewalld configuration for kube
  ansible.builtin.include_tasks: kube-firewall.yml
  when:
    - kube_masters_group in group_names or kube_nodes_group in group_names

- name: Install unattended certificate renewal timers
  ansible.builtin.include_tasks: ipa-cert-renewal.yml
  when:
    - kube_masters_group in group_names or kube_nodes_group in group_names

- name: Create NFS-type persistent volumes on master
  ansible.builtin.include_tasks: nfs-mountpoints.yml
  when:
    - nfs_mountpoints is defined
    - nfs_mountpoints | length > 0
    - kube_masters_group in group_names
